Request:
  type: object
  description: |-
    iClient configuration. The shape varies by `provider` — each provider
    requires its own credential sub-object (`oauth2`, `netsuite`,
    `salesforce`, `ebay`, `amazonmws`, `azureserviceprincipal`,
    `googleserviceaccount`, `awsIam`).
    For `custom_oauth2`, credentials go in the `oauth2` sub-object.
    Secrets (`clientSecret`, `privateKey`, and so on) come back masked
    as `"******"`. Re-send that mask on update to keep the stored
    secret; omitting it does not. Two providers differ. A Google
    service account: `serviceAccountJSON` is not returned, and every
    update must send the full key — the mask or an omission fails with
    422 `invalid_json_key`. An Azure service principal: the stored
    `clientSecret` or `certificate` is kept when its field is omitted
    on update, and only a new value replaces it (`certificate` is never
    returned, not even masked).
  required:
    - provider
  allOf:
    - $ref: "./base.yml#/IClientBase"
