Salesforce:
  type: object
  description: |
    Salesforce-specific iClient config for custom Connected App OAuth.
    Used when the connection's salesforce._iClientId points at it; a
    connection that omits salesforce._iClientId uses Celigo's Connected App.
  properties:
    clientId:
      type: string
      description: Consumer key from the Salesforce Connected App
    clientSecret:
      type: string
      description: |
        Consumer secret from the Salesforce Connected App.
        Stored encrypted; API responses return "******".
        Re-send the mask on update to keep it; an omitted secret is not kept.
    apiToken:
      type: string
      description: |
        Salesforce API token. Stored encrypted; API responses return "******".
        Re-send the mask on update to keep it; an omitted token is not kept.
    privateKey:
      type: string
      description: |
        Private key for JWT bearer token flow (PEM format).
        Stored encrypted; API responses return "******".
        Re-send the mask on update to keep it; an omitted key is not kept.
    publicKey:
      type: string
      description: Public key for API signature verification (PEM format)
