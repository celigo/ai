ResponseBase:
  type: object
  description: Shared properties present on every connection response regardless of type.
  allOf:
    - $ref: '../common-schemas/resource-response.yml#/ResourceResponse'
    - $ref: '../common-schemas/ia-resource-response.yml#/IAResourceResponse'
    - type: object
      properties:
        name:
          type: string
          description: Display name for the connection.
          examples: ["Salesforce Production", "NetSuite Non-Production", "PostgreSQL Orders DB"]
          maxLength: 100
        type:
          type: string
          description: The type of connection determining which authentication and connectivity options are available
          enum:
            - netsuite
            - salesforce
            - ftp
            - s3
            - wrapper
            - http
            - rdbms
            - mongodb
            - as2
            - filesystem
            - mcp
            - dynamodb
            - jdbc
            - van
            - rest
          x-enumDescriptions:
            netsuite: NetSuite ERP connection using token-based authentication (TBA).
            salesforce: Salesforce CRM connection with OAuth 2.0 authentication.
            ftp: FTP, SFTP, or FTPS file transfer connection.
            s3: Amazon S3 cloud storage connection, authenticated with an access key pair or an AWS IAM role (`s3.authType`).
            wrapper: Wrapper connection that delegates to another connection type.
            http: Generic HTTP/REST API connection with full configuration control.
            rdbms: Native relational-database connection — MySQL, PostgreSQL, MariaDB, Microsoft SQL Server, Azure Synapse, Oracle, Snowflake, Google BigQuery, Amazon Redshift (the database is `rdbms.type`).
            mongodb: MongoDB NoSQL database connection.
            as2: AS2 (Applicability Statement 2) EDI connection.
            filesystem: Local or network filesystem connection (requires an Agent).
            mcp: MCP (Model Context Protocol) server connection.
            dynamodb: Amazon DynamoDB NoSQL database connection.
            jdbc: JDBC connection for relational systems without a native `rdbms` type (Databricks, Db2, Workday, NetSuite JDBC) and for the driver-specific paths `jdbc.type` names (Oracle Thin, SQL Server with Active Directory); Redshift, BigQuery and Snowflake are `rdbms` types.
            van: Value-Added Network connection for EDI document exchange.
            rest: REST connection driven by a pre-built HTTP Connector template. Deprecated — use `http` instead.
        externalId:
          type: string
          description: External identifier for the connection, often used for integration with third-party systems
          examples: ["erp-conn-001"]
        assistant:
          type: string
          description: |
            Application name in lowercase for HTTP connections to systems with integrator.io adaptors.
            Used to identify the target application being connected to.
            Examples - Shopify: "shopify", eBay: "ebay".
            Only applicable for HTTP connection types.
          examples: ["shopify"]
        _agentId:
          type: string
          format: objectId
          x-celigo-refModel: agents
          description: |
            Reference to a Celigo on-premise Agent. Required for connection types that need
            local network or filesystem access (JDBC, filesystem, Oracle RDBMS, and on-premise MongoDB).
            The agent establishes a secure tunnel between the on-premise environment and integrator.io.
          examples: ["5f8d43a1b9e5a80011a35f2c"]
        _borrowConcurrencyFromConnectionId:
          type: string
          format: objectId
          x-celigo-refModel: connections
          description: |-
            Reference to another connection to share concurrency limits with. When set, this
            connection's traffic counts against the referenced connection's limit instead of its own,
            and its own concurrency and auto-recovery settings have no effect. One level only: the
            referenced connection may not itself borrow, and a connection that others borrow from
            cannot start borrowing. A connection cannot reference itself (422).
          examples: ["615dfa0742763671275b70ab"]
          x-celigo-ai-guidance:
            - |-
              Set this when several connections target one external account whose API enforces a
              single account-wide concurrency limit (for example one NetSuite account): put the limit
              on one parent connection and point the others here, so their combined traffic can never
              exceed it.
            - |-
              A borrower drains through the parent's queue as well as its ceiling, so a high-volume
              borrower competes with the parent's own flows — settle the priority split before
              choosing who borrows from whom.
        debugDate:
          type: string
          format: date-time
          description: Date until which debug logging is enabled for this connection
          examples: ["2026-01-15T09:30:00.000Z"]
        settingsForm:
          type: object
          description: Dynamic form configuration for connection-specific settings
        settings:
          type: object
          description: Connection-specific settings and configurations
        pgp:
          description: Present for file-based connections (ftp, s3, filesystem, …) that encrypt or decrypt files with PGP.
          allOf:
            - $ref: './pgp.yml#/PGP'
        ssl:
          $ref: './ssl.yml#/SSL'
        aiDescription:
          $ref: '../common-schemas/ai-description.yml#/AIDescription'
        offline:
          type: boolean
          description: |-
            When true, the connection has been taken offline and is skipped during flow execution.
            It is set by the connection test a create or `PUT` runs: the result arrives in the
            write's response or, when the target is slow to answer, shortly afterwards (the audit
            log records a `system` change; `lastModified` doesn't move), so read it again a few
            seconds after the write. On an `http` connection the write runs the test only when
            `http.ping` is configured, and an `http` connection that was never tested has no
            `offline` key.
          readOnly: true
        needsAuthorization:
          type: boolean
          readOnly: true
          description: |-
            OAuth handshake state. Celigo's OAuth callback sets it to `false` once the user consents
            and the tokens are stored (see `GET /v1/connection/{_id}/oauth2`). A connection that
            was never authorized usually has no `needsAuthorization` key, so its absence does not
            mean the connection is authorized.
        sandbox:
          type: boolean
          deprecated: true
          description: Whether this connection belongs to a sandbox environment.
          readOnly: true
        _sourceId:
          type: string
          format: objectId
          x-celigo-refModel: connections
          description: Source connection this was cloned from.
          readOnly: true
          examples: ["5f29dbc69e8a0f0e29a491b7"]
        connectionRole:
          type: string
          enum: [standard, mcpChild]
          x-enumDescriptions:
            standard: An ordinary account-owned connection, created and edited through this API
            mcpChild: An MCP end user's private credential copy of a parent connection, created by the end-user setup page
          readOnly: true
          description: |-
            Distinguishes account-owned connections from the per-end-user credential copies
            MCP servers collect. Absent on connections last saved before the field existed,
            which behave as `standard`. Sending `mcpChild` on `POST` or `PUT /v1/connections`
            fails with 422 `mcp_child_generic_route_not_allowed`, and `/connectionRole` is not a
            patchable path; child connections are written only by the MCP end-user setup page,
            never through `/v1`.
          examples: [standard]
        endUserProvidedFields:
          type: array
          items:
            type: string
          description: |-
            Dot-paths of this connection's fields (for example `http.encrypted.apiKey` or
            `rdbms.user`) that each MCP end user must supply on their own `mcpChild` copy instead
            of inheriting the parent's value. Only returned on a `standard` connection that has
            paths set; never returned on a child. Writable through `POST`, `PUT`, and `PATCH`;
            by the platform contract, a write that changes the list invalidates the children end
            users already hold against this parent.
          examples: [["http.encrypted.apiKey", "http.unencrypted.accountId"]]
        _parentConnectionId:
          type: string
          format: objectId
          x-celigo-refModel: connections
          readOnly: true
          description: |-
            Parent connection this child copies its non-credential configuration from. Present
            only when `connectionRole` is `mcpChild`; set by the end-user setup page and ignored
            when sent on a standard connection.
          examples: ["615dfa0742763671275b70ab"]
        _mcpOwnerId:
          type: string
          format: objectId
          x-celigo-refModel: users
          readOnly: true
          description: |-
            Account owner whose parent connection and MCP servers this child belongs to. Present
            only when `connectionRole` is `mcpChild`; on a child, `_userId` is the end user and
            this field is the account.
          examples: ["5d2e1f0a9b8c7d6e5f4a3b2c"]
        _parentSyncedAt:
          type: string
          format: date-time
          readOnly: true
          description: |-
            Timestamp when the child's non-credential fields were last synced from the parent
            connection. Present only when `connectionRole` is `mcpChild`.
          examples: ["2026-09-15T18:42:10.331Z"]
        _userId:
          type: string
          format: objectId
          x-celigo-refModel: users
          description: |-
            End user who owns this `mcpChild` connection's credentials. Present only when
            `connectionRole` is `mcpChild`; a standard connection belongs to the account and
            omits this field.
          readOnly: true
          examples: ["5d2e1f0a9b8c7d6e5f4a3b2c"]
        debugUntil:
          type: string
          format: date-time
          description: Debug logging is active until this timestamp. Absent or in the past means debug is off.
          readOnly: true
          examples: ["2026-01-15T09:30:00.000Z"]
        encrypted:
          type: string
          description: Masked placeholder for encrypted credential fields. Always returns `"******"`.
          readOnly: true
        isHTTP:
          type: boolean
          description: When true, the connection uses the HTTP adaptor internally, even when `type` is `wrapper`.
          readOnly: true
        autoRecoverRateLimitErrors:
          type: boolean
          default: true
          description: |-
            When true, rate-limit errors from the target system trigger automatic recovery: concurrency
            drops to 1, the rate-limited requests are retried with doubling waits (1 to 1024 minutes,
            after which the flag switches itself off), and concurrency climbs back toward
            `targetConcurrencyLevel`. While true, `targetConcurrencyLevel` is the throughput lever: a
            `concurrencyLevel` sent in a PUT is ignored, and one sent in a PATCH is stored but the
            recovery machinery moves it back toward the target.
          x-celigo-ai-guidance:
            - To change throughput while this is true, write `targetConcurrencyLevel`; a `concurrencyLevel` sent in a PUT returns 200 and changes nothing.
            - Turning it on copies `concurrencyLevel` into `targetConcurrencyLevel`; turning it off unsets the target and leaves `concurrencyLevel` at its current value, which may be below the old target if a recovery was in progress. A `targetConcurrencyLevel` written while this is false is unset by the save.
            - These four settings (`concurrencyLevel`, `targetConcurrencyLevel`, `_borrowConcurrencyFromConnectionId`, this flag) accept a credential-free `PATCH /v1/connections/{_id}`. A PUT replaces the whole document, so send each secret back as its masked `******` value (that keeps it) or as a new value, and never drop one to keep it — an omitted password or `http.encrypted` is cleared, and a static token left out (with no `refreshMethod`) fails the PUT with 422.
        enableMicroBatchForOneToMany:
          type: boolean
          default: true
          description: When true, enables micro-batching for one-to-many data flows through this connection.
        enableCsvObjectParsing:
          type: boolean
          default: true
          description: When true, enables CSV-to-object parsing for data received through this connection.
        microServices:
          type: object
          description: Per-adaptor feature flags controlling which microservice workers handle this connection's traffic.
          readOnly: true
          properties:
            disableHttp:
              type: boolean
              description: When true, the HTTP microservice worker is disabled for this connection.
            disableNetSuiteDistributed:
              type: boolean
              description: When true, the NetSuite distributed-processing worker is disabled for this connection.
            disableNetSuiteProxy:
              type: boolean
              description: When true, the NetSuite proxy worker is disabled for this connection.
            disableNetSuiteWebservices:
              type: boolean
              description: When true, the NetSuite SuiteTalk Web Services worker is disabled for this connection.
            disableRdbms:
              type: boolean
              description: When true, the RDBMS worker is disabled for this connection.
            disableAs2:
              type: boolean
              description: When true, the AS2 worker is disabled for this connection.
            disableAs2File:
              type: boolean
              description: When true, the AS2 file-processing worker is disabled for this connection.
            disableDataLoaderFile:
              type: boolean
              description: When true, the data-loader file worker is disabled for this connection.
            disableFtp:
              type: boolean
              description: When true, the FTP worker is disabled for this connection.
            disableS3:
              type: boolean
              description: When true, the S3 worker is disabled for this connection.
            disableSalesforce:
              type: boolean
              description: When true, the Salesforce worker is disabled for this connection.
            disableFile:
              type: boolean
              description: When true, the generic file worker is disabled for this connection.
            disableNsFile:
              type: boolean
              description: When true, the NetSuite file worker is disabled for this connection.
            workerGroup:
              type: string
              description: Name of the worker group that processes this connection's traffic.
              examples: ["default"]
        queues:
          type: array
          description: Message queue sizes for this connection. Always present on GET-by-ID; on the list endpoint only when `fetchQueueSize=true`.
          readOnly: true
          items:
            type: object
            properties:
              name:
                type: string
                description: Queue identifier (typically the connection ID).
                examples: ["615dfa0742763671275b70ab"]
              size:
                type: integer
                description: Number of messages currently in the queue.
                examples: [0]
