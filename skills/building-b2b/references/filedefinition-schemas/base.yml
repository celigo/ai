FileDefinitionBase:
  type: object
  description: Writable file definition fields shared by the request and response schemas.
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 100
      description: |
        Human-readable name for the file definition.
      examples: ["Invoice EDI 810", "Customer CSV Import", "Fixed-Width Payment File"]
    description:
      type: string
      maxLength: 10240
      description: |
        Optional detailed description of the file definition's purpose and format.
      examples: ["Defines the structure for parsing incoming EDI 810 invoice documents"]
    version:
      type: string
      enum: ["1", "2"]
      x-enumDescriptions:
        "1": Original file definition schema version.
        "2": Updated file definition schema version with breaking changes.
      description: |
        Schema version of the file definition. Only incremented for breaking changes.
      examples: ["1", "2"]
    format:
      type: string
      description: The file format this definition describes.
      enum: [delimited, delimited/x12, delimited/edifact, fixed]
      x-enumDescriptions:
        delimited: Standard delimited files (CSV, TSV, etc.).
        delimited/x12: EDI X12 format. Requires `globalId` when EDI license is enabled.
        delimited/edifact: EDI EDIFACT format. Requires `globalId` when EDI license is enabled.
        fixed: Fixed-width positional format.
    documentType:
      type: string
      enum: ["997", "CONTRL"]
      x-enumDescriptions:
        "997": X12 functional acknowledgement document type.
        CONTRL: EDIFACT functional acknowledgement document type.
      description: EDI document type for acknowledgement documents.
    globalId:
      type: string
      description: |-
        Entry in the platform's registry of standard EDI document definitions that this
        definition is built from. On an EDI-licensed account an X12 or EDIFACT create without
        it fails with 422 `global_id_not_provided`, and one naming an id the registry doesn't
        have fails with 422 `invalid_global_id`. No public route lists the registry, so copy the
        `globalId` of an existing definition for the same standard document. Immutable after
        creation.
      examples: ["Generic-4010-850-PurchaseOrder"]
    rules:
      type: array
      x-celigo-agent:
        - file_definition_rules
      description: |
        Ordered array of recursive parsing/generation `Rule` nodes that
        describe the file's structure — segments, elements, loops, and
        their relationships. The array shape is the same for every
        `format` (delimited, EDI X12/EDIFACT, and fixed-width): the first
        element is the file's root rule, EDI envelopes nest through
        `Rule.children`, and openers pair with trailers via
        `Rule.closeRule`. Fixed-width rules list every column in order,
        each element with its `length`.

        The cleared / "no rules configured" form is an empty array `[]`.
        The serialized rules tree must not exceed 20 KB once attached to
        the parent file definition document. A save doesn't parse a sample,
        so a tree that saves can still fail or drop rows when parsed; test
        it against a sample with `POST /v1/processors/structuredFileParser`.
      items:
        $ref: './rules.yml#/Rule'
    fixed:
      type: object
      description: |
        Configuration specific to fixed-width format files.

        Used when `format` is "fixed", which requires `rowDelimiter` and `paddingChar`.
      properties:
        rowSuffix:
          type: string
          description: |
            Character(s) appended after each row during generation.
          examples: ["\\n", "\\r\\n"]
        rowDelimiter:
          type: string
          description: |
            Character(s) used to delimit rows during parsing. Required when `format` is "fixed".

            A delimiter after the last row is read as one more, empty row: a required row
            rule then fails the parse at that line ("Required rule must have the respective
            row in the source file"), and an optional one adds an empty `{}` record. Set
            `skipIntermittentEmptyLines: true` to drop it.
          examples: ["\\n", "\\r\\n"]
        paddingChar:
          type: string
          description: |
            Character used to pad fixed-width fields to their required length. Required when
            `format` is "fixed".
          examples: [" ", "0"]
    delimited:
      type: object
      description: |
        Configuration specific to delimited format files (CSV, EDI, etc.).

        Used when `format` starts with "delimited".
      properties:
        rowSuffix:
          type: string
          description: |
            Character(s) appended after each row during generation.
          examples: ["\\n", "\\r\\n"]
        rowDelimiter:
          type: string
          description: |
            Character(s) used to delimit rows during parsing.
          examples: ["\\n", "~\\n"]
        colDelimiter:
          type: string
          description: |
            Character(s) used to delimit columns/fields within a row.
          examples: [",", "\\t", "*", "|"]
        compositeDelimiter:
          type: string
          description: |
            Character(s) used to delimit composite elements within a field.
            Primarily used in EDI formats.
          examples: [":", ">"]
    strict:
      type: boolean
      description: |
        Whether to fail on all validation errors.

        Reserved for future use.
    skipEmptyEndColDelimiter:
      type: boolean
      description: |
        Whether to skip trailing empty column delimiters at the end of rows.
    skipIntermittentEmptyLines:
      type: boolean
      description: |
        Whether to remove empty rows found in the file content during parsing. On a
        fixed-width definition this includes the empty row a trailing line break adds.
    escapeReleaseChar:
      type: boolean
      description: |
        Whether to handle escape/release characters in delimited data.
        Primarily relevant for EDI EDIFACT format.
    skipEDIValidation:
      type: boolean
      description: |
        Whether to skip EDI structural validation during parsing.
    skipEDIProfileValidation:
      type: boolean
      default: false
      description: |
        Whether to skip EDI profile-level validation during parsing.
    externalId:
      type: string
      description: |
        External identifier for correlating this file definition with an external system.
      examples: ["ext-filedef-12345"]
  x-celigo-ai-guidance:
    - |-
      `rules` is an ordered array of `Rule` nodes for every `format`, fixed-width included. For
      EDI (X12 / EDIFACT) the root rule's `children` build the envelope → group → transaction →
      segment hierarchy.
    - |-
      Rows repeat only under an elements-less `container: true` rule (a group `name`,
      `maxOccurrence` above 1, no `elements`) whose child rule carries the row's elements. A
      row-marker rule with no such container above it, or under a container whose
      `maxOccurrence` is 1 or unset, matches only the first row: in fixed-width and delimited
      files the parser drops the rest without an error, and an X12 parse fails at the next row,
      naming a mandatory segment as missing.
