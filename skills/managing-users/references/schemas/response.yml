User:
  type: object
  required:
    - _id
    - sharedWithUser
    - integrationAccessLevel
    - createdAt
    - lastModified
  description: |-
    A user's access record in the account. Each user who has been invited
    (or shared access) gets one record per account they belong to. The
    `_id` is the access-record id, not the user's own id — the user's
    identity is in `sharedWithUser._id`. The account owner does not
    appear in this list.
  x-celigo-ai-guidance:
    - Account user object representing a user's access to the account
  allOf:
    - $ref: ./base.yml#/UserBase
    - type: object
      properties:
        _id:
          type: string
          format: objectId
          readOnly: true
          x-celigo-refModel: users
          examples:
            - 6798f4dc43db9184f4bc8ee0
          description: Access-record id for this user in the account.
        accepted:
          type: boolean
          readOnly: true
          description: When true, the user has accepted the invitation to join the account.
        userType:
          type: string
          readOnly: true
          enum: [workspace]
          description: |-
            Discriminates workspace users from end users on the underlying
            access-record model. This endpoint only returns `workspace`
            records — end users are managed through the End Users API.
          x-enumDescriptions:
            workspace: A workspace (team member) access record.
        lastSignIn:
          type: string
          format: date-time
          readOnly: true
          examples:
            - '2026-05-02T17:02:59.370Z'
          description: When the user last signed in to this account.
          x-celigo-ai-guidance:
            - Last sign-in timestamp for the user (if available).
        dismissed:
          type: boolean
          readOnly: true
          description: When true, the invitation has been declined by the user.
        isProductionAdmin:
          type: boolean
          readOnly: true
          description: When true, the user has production-admin privileges in this account.
        createdVia:
          type: string
          readOnly: true
          description: How this user's access record was created.
          enum:
            - existing_account_invite
            - existing_account_share_request
            - invited_during_signup
            - new_account_auto_join
          x-enumDescriptions:
            existing_account_invite: User was invited to an existing account by an admin.
            existing_account_share_request: User requested access to a shared account.
            invited_during_signup: User was invited as part of a new account signup flow.
            new_account_auto_join: User automatically joined a new account via domain matching.
          x-celigo-canon:
            decision: verified-exact
            reason: >-
              Enum confirmed exact against the full production population — no other values
              exist; do not relitigate.
            method: full-population
            verified: '2026-07-04'
        ssoSetupPending:
          type: boolean
          readOnly: true
          description: |-
            When true, the user must complete SSO setup for this account
            before their SSO-required access is fully active. Set by the
            server during SSO enrollment; cleared by removing the field, so
            it is never `false`.
          x-celigo-canon:
            decision: no-constraint
            reason: >-
              Do not freeze to a const despite uniform true in production — a readOnly
              server flag; freezing observed uniformity guards nothing.
            method: full-population
            verified: '2026-07-04'
        mcpServerAccessLevel:
          type: array
          deprecated: true
          description: |-
            Legacy per-MCP-server access grants on workspace users —
            superseded by end-user `resourceGrants` and permission sets
            (End Users API). The workspace-to-end-user migration endpoint
            clears these fields from workspace records. Still returned for
            records that carry it.
          items:
            type: object
            properties:
              _mcpServerId:
                type: string
                format: objectId
                x-celigo-refModel: mcpservers
                examples:
                  - 6a1b2c3d4e5f6a7b8c9d0e1f
                description: MCP server the access grant applies to.
              scopes:
                type: array
                description: Scopes granted for this MCP server.
                items:
                  type: string
                  enum: ["mcp:read", "mcp:write"]
                  x-enumDescriptions:
                    "mcp:read": Read-only access to MCP server tools and resources.
                    "mcp:write": Read-write access to MCP server tools and resources.
        allMcpServerAccess:
          type: boolean
          deprecated: true
          description: |-
            Legacy environment-wide MCP access flag — superseded by end-user
            `resourceGrants` wildcard grants. Still returned for records that
            carry it; takes precedence over `mcpServerAccessLevel` when set.
        sharedWithUser:
          type: object
          readOnly: true
          description: Identity details of the invited/shared user.
          properties:
            _id:
              type: string
              format: objectId
              x-celigo-refModel: users
              examples:
                - 624774a6a7574d3ed9f9a5cc
              description: The user's own account id.
            email:
              type: string
              format: email
              examples:
                - admin@example.com
              description: Email address of the user.
            name:
              type: string
              examples:
                - Account Admin
              description: Display name of the user.
            lastSignIn:
              type: string
              format: date-time
              examples:
                - '2026-05-02T17:02:59.370Z'
              description: When the user last signed in (across any account).
            allowedToResetMFA:
              type: boolean
              description: When true, the current requester can reset MFA for this user.
            accountSSOLinked:
              type: string
              description: |-
                SSO linkage status for the user in this account.
                `this_account` means SSO is linked to the current account.
                `other_account` means SSO is linked to a different account.
              enum: [not_linked, this_account, other_account]
              x-enumDescriptions:
                not_linked: User has no SSO linkage for this account.
                this_account: User's SSO is linked to this account.
                other_account: User's SSO is linked to a different account.
    - $ref: ../../../common/schemas/resource-response.yml#/ResourceResponse
