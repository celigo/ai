ResourceGrant:
  type: object
  description: |-
    Grants access to a resource (currently MCP servers only). A grant names
    the resource, or applies as a wildcard across all resources of the type,
    and lists the capabilities granted on it.
  required:
    - resourceType
    - capabilities
  properties:
    resourceType:
      type: string
      enum: [mcpServer]
      x-enumDescriptions:
        mcpServer: Grants access to an MCP server and its tools, APIs, or permission sets.
      description: Resource type this grant applies to.
    _resourceId:
      type: [string, 'null']
      format: objectId
      x-celigo-refModel: mcpservers
      examples: ["6a1b2c3d4e5f6a7b8c9d0e1f"]
      description: |-
        MCP server this grant applies to. Omit or set to null for a wildcard
        grant across all MCP servers in the account.
    capabilities:
      type: array
      minItems: 1
      description: |-
        Capabilities granted on the target resource. Each `:all` capability
        covers only its own kind — grant `tool:all`, `api:all`, `prompt:all`,
        and `resource:all` together to open every item on a server.
      items:
        type: string
        pattern: "^(?:tool|api|prompt|resource):(?:[a-fA-F0-9]{24}|all)$|^pset:[a-fA-F0-9]{24}$"
        description: |-
          Capability string for an `mcpServer` grant. `tool:`, `api:`,
          `prompt:`, and `resource:` take `all` or a 24-hex id on the target
          server — a `tools[]._toolId` or upstream tool row `_id`, an
          `apis[]._apiId`, a `prompts[]._id`, or a `resources[]._id`; `pset:`
          takes a `permissionSets[]._id`. Grant prompts with `prompt:<_id>`:
          older grants written as `tool:<prompt _id>` still validate but are
          not reported by effective access. Any other shape is rejected with
          400 `validation_failed` ("Invalid capability"), and an id that is
          not attached to the target server with 400 `validation_failed`
          naming the missing item.
        examples: ["tool:all", "prompt:6b2c3d4e5f6a7b8c9d0e1f2a", "pset:6c3d4e5f6a7b8c9d0e1f2a3b"]
        x-celigo-canon:
          decision: verified-exact
          reason: >-
            The pattern is the validator's own regular expression, shared by the model and the
            end-user, group, and role routes; a kind outside it or a malformed id is rejected.
          method: live-probe
          verified: '2026-09-21'
