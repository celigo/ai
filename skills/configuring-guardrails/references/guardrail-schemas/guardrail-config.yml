# Guardrail-owned contract for the `guardrail` object. It mirrors the import spec's
# GuardrailConfig field for field with one deliberate difference: the AI-agent branch
# (GuardrailAiAgentConfig, below) is composed without the `tools` arrays that the server
# rejects on guardrails, instead of $ref-ing the tool-bearing AiAgentConfig. Keep the shared
# fields (type, confidenceThreshold, pii, moderation, and the provider blocks) in step with
# specs/v1/import/components/schemas/{guardrail,aiagent}.yml when either side changes.
GuardrailConfig:
  type: object
  description: |-
    Selects the check a guardrail applies and carries its settings. `type` picks the check
    and the matching sub-object (`pii`, `moderation`, or `aiAgent`) configures it.
    Responses echo the active sub-object with `confidenceThreshold` defaulted and also
    return the inactive `pii` / `moderation` siblings as empty stubs
    (`pii: {entities: [], mask: false}`, `moderation: {categories: []}`) — only the active
    type's sub-object is meaningful. Guardrails created before the AI-agent stub was
    stripped on write may still return an inert `aiAgent` on `pii` / `moderation` guardrails.
  x-celigo-ai-guidance:
    - |-
      Pick exactly one type. Prefer the deterministic local classifiers (`pii`, then
      `moderation`) whenever the brief's intent fits; use `ai_agent` only for custom
      judgement that has no `pii.entities` / `moderation.categories` analogue — the full
      decision rule is on `type`.
    - |-
      Guardrails never invoke tools. A non-empty `tools` array anywhere under `aiAgent`
      (`aiAgent.tools`, `aiAgent.openai.tools`, `aiAgent.litellm._overrides.gemini.tools`,
      `aiAgent.litellm._overrides.anthropic.tools`) fails the save with 422
      `guardrail_tools_not_allowed`. MCP `prompts` and `resources` are still accepted on
      save, but don't rely on them for the check: with their MCP server unreachable, a
      guardrail runs on its instructions and input alone, with no error, where an AI agent's
      run fails (verified on OpenAI). Put the policy the guardrail must apply in its
      instructions.
  properties:
    type:
      type: string
      enum: ["ai_agent", "pii", "moderation"]
      x-enumDescriptions:
        ai_agent: Evaluate data using an AI model with custom instructions.
        pii: Detect personally identifiable information in data fields.
        moderation: Check content for harmful or inappropriate categories.
      description: |-
        The type of guardrail to apply. Each type requires its corresponding
        sub-configuration object (`aiAgent`, `pii`, or `moderation`).
      x-celigo-ai-guidance:
        - |-
          The type of guardrail to apply.
          Pick exactly one — `pii` / `moderation` / `ai_agent` are mutually exclusive at
          the type level (a brief that wants both runs as two guardrails in sequence,
          not one).
        - |-
          ## How to choose

          Apply these rules **in order** and pick the first match.  Do
          NOT skip ahead to `ai_agent` just because the brief is in
          natural language — `pii` and `moderation` are also expressed
          as natural-language briefs.  The decision is about WHAT the
          brief asks the guardrail to detect, not how the brief is
          worded.

          1. **`pii`** — pick this when the brief names ANY personally
             identifiable information, OR when the brief names entity
             categories (SSN, email, phone, credit card, address, name,
             passport, license, account number, etc.) that match
             `pii.entities`.  Examples that route here:
             "detect SSN and credit card numbers", "mask customer
             emails and phone numbers", "scan for PII".

          2. **`moderation`** — pick this when the brief asks the
             guardrail to detect harmful, inappropriate, unsafe, or
             policy-violating CONTENT (as opposed to PII data fields)
             AND the intent maps to any value in `moderation.categories`
             (`sexual`, `hate`, `harassment`, `self_harm`, `violence`,
             `illicit`, etc.) — including via close synonyms.  Apply
             the synonym mapping liberally:
             - "explicit", "obscene", "vulgar", "profane",
               "inappropriate language", "swearing", "NSFW" → typically
               maps to `sexual` and/or `harassment`
             - "abusive", "insulting", "bullying", "toxic" → `harassment`
             - "hateful", "discriminatory", "racist", "sexist" → `hate`
             - "threatening", "intimidating" → `harassment_threatening`
               or `violence`
             - "graphic violence", "gore" → `violence_graphic`
             - "suicide", "self-injury" → `self_harm`
             - "drugs", "weapons", "illegal activity" → `illicit`
             Briefs like "screen email body for explicit language",
             "block toxic chat messages", "flag harassment in support
             tickets", "moderate user-generated content for unsafe
             material" all route to `moderation`.  When the brief uses
             a synonym, populate `moderation.categories` with the
             closest enum value(s) — do NOT invent new category
             strings; the enum is fixed.

          3. **`ai_agent`** — pick this ONLY when the brief asks for
             judgement that doesn't fit `pii` or `moderation`.  Typical
             triggers: domain-specific compliance checks (HIPAA / SOX
             rule evaluation), business-policy validation (price
             bounds, approval thresholds), data-quality assertions
             (required fields populated, values plausible), or any
             "evaluate against these custom rules" framing where the
             rules are domain-specific and have no `pii.entities` /
             `moderation.categories` analogue.  If you can map the
             brief's intent to a moderation category (even via a
             synonym above), use `moderation` instead — `ai_agent` is
             the catch-all, not the default.

          Tie-breaker for borderline cases: prefer the more specific
          type (`pii` > `moderation` > `ai_agent`).  `pii` and
          `moderation` are local deterministic classifiers with fixed
          enums — they're cheaper, faster, and more predictable than
          `ai_agent` (which calls a real LLM per record).  Default to
          the cheaper path whenever the intent fits.
        - |-
          ## Sub-configuration requirements (one per type)

          - **ai_agent** requires the `aiAgent` sub-configuration.
          - **pii** requires the `pii` sub-configuration with at least
            one entity from `pii.entities`.
          - **moderation** requires the `moderation` sub-configuration
            with at least one category from `moderation.categories`.
    confidenceThreshold:
      type: number
      minimum: 0
      maximum: 1
      default: 0.7
      x-celigo-ui-override: >-
        Required by the guardrail form (confidenceThreshold is required:true once a type is
        selected, default 0.7). Encoded to mirror the form so builders produce connectable
        configurations.
      description: |-
        Confidence threshold (0 to 1). Detections below this threshold are
        ignored. Lower values catch more issues but increase false positives.
      x-celigo-ai-guidance:
        - Confidence threshold for guardrail detection (0 to 1).
        - |-
          Only detections with confidence at or above this threshold will be flagged.
          Lower values catch more potential issues but may increase false positives.
      examples: [0.7, 0.5, 0.9]
    aiAgent:
      type: object
      description: |-
        LLM configuration for the check; set when `type` is `ai_agent` and validated
        against `GuardrailAiAgentConfig`. On `pii` / `moderation` guardrails a legacy
        server-written stub may appear here — it is inert, and current servers strip it on
        write.
    pii:
      type: object
      required: [entities]
      description: |-
        PII detection configuration. Required when `type` is `pii`.
      x-celigo-ai-guidance:
        - Configuration for PII (Personally Identifiable Information) detection.
        - |-
          Required when `guardrail.type` is "pii".
          At least one entity type must be specified.
      properties:
        entities:
          type: array
          description: |-
            PII entity types to detect. When `type` is `pii`, at least one
            entry is required; the inactive sibling on other guardrail types
            may be served with an empty list.
          x-celigo-ai-guidance:
            - PII entity types to detect in the data.
            - At least one entity must be specified when using PII guardrails.
          items:
            type: string
            enum:
              - credit_card_number
              - card_security_code_cvv_cvc
              - cryptocurrency_wallet_address
              - date_and_time
              - email_address
              - iban_code
              - bic_swift_bank_identifier_code
              - ip_address
              - location
              - medical_license_number
              - national_registration_number
              - persons_name
              - phone_number
              - url
              - us_bank_account_number
              - us_drivers_license
              - us_itin
              - us_passport_number
              - us_social_security_number
              - uk_nhs_number
              - uk_national_insurance_number
              - spanish_nif
              - spanish_nie
              - italian_fiscal_code
              - italian_drivers_license
              - italian_vat_code
              - italian_passport
              - italian_identity_card
              - polish_pesel
              - finnish_personal_identity_code
              - singapore_nric_fin
              - singapore_uen
              - australian_abn
              - australian_acn
              - australian_tfn
              - australian_medicare
              - indian_pan
              - indian_aadhaar
              - indian_vehicle_registration
              - indian_voter_id
              - indian_passport
              - korean_resident_registration_number
            x-enumDescriptions:
              credit_card_number: Credit or debit card number (e.g., Visa, Mastercard, Amex).
              card_security_code_cvv_cvc: Card security code printed on credit or debit cards (CVV/CVC).
              cryptocurrency_wallet_address: Cryptocurrency wallet address (e.g., Bitcoin, Ethereum).
              date_and_time: Date and/or time values that could identify an individual.
              email_address: Email address in standard format.
              iban_code: International Bank Account Number used for cross-border payments.
              bic_swift_bank_identifier_code: BIC/SWIFT code identifying a specific bank for international transfers.
              ip_address: IPv4 or IPv6 network address.
              location: Physical location or geographic coordinates.
              medical_license_number: Medical professional license or registration number.
              national_registration_number: National identification or registration number.
              persons_name: Full or partial name of a person.
              phone_number: Telephone number in any format.
              url: Web URL or URI.
              us_bank_account_number: United States bank account number.
              us_drivers_license: United States driver's license number.
              us_itin: United States Individual Taxpayer Identification Number.
              us_passport_number: United States passport number.
              us_social_security_number: United States Social Security Number (SSN).
              uk_nhs_number: United Kingdom National Health Service number.
              uk_national_insurance_number: United Kingdom National Insurance number.
              spanish_nif: Spanish tax identification number (NIF).
              spanish_nie: Spanish foreigner identification number (NIE).
              italian_fiscal_code: Italian fiscal code (Codice Fiscale).
              italian_drivers_license: Italian driver's license number.
              italian_vat_code: Italian VAT identification number (Partita IVA).
              italian_passport: Italian passport number.
              italian_identity_card: Italian national identity card number.
              polish_pesel: Polish national identification number (PESEL).
              finnish_personal_identity_code: Finnish personal identity code (henkilotunnus).
              singapore_nric_fin: Singapore National Registration Identity Card or Foreign Identification Number.
              singapore_uen: Singapore Unique Entity Number for business registration.
              australian_abn: Australian Business Number.
              australian_acn: Australian Company Number.
              australian_tfn: Australian Tax File Number.
              australian_medicare: Australian Medicare card number.
              indian_pan: Indian Permanent Account Number for tax purposes.
              indian_aadhaar: Indian Aadhaar unique identity number.
              indian_vehicle_registration: Indian vehicle registration number.
              indian_voter_id: Indian voter identification card number.
              indian_passport: Indian passport number.
              korean_resident_registration_number: South Korean resident registration number.
          examples:
            - ["email_address", "phone_number", "persons_name"]
            - ["us_social_security_number", "credit_card_number"]
        mask:
          type: boolean
          default: false
          description: |-
            When true, the result also carries `masked`: the evaluated input with each detected
            value replaced by asterisks. The record itself is unchanged. With whole-record input
            (no `mapping`, and no top-level `text` field on the record), `masked` is the record
            serialized as one JSON string. When false, PII is flagged only.
          x-celigo-ai-guidance:
            - |-
              Masking doesn't rewrite the record. To pass masked text on, select the field as the
              `text` input (`mapping`) and response-map `masked` back onto that field on the
              guardrail's flow step (`{"extract": "masked", "generate": "<field>"}`).
    moderation:
      type: object
      required: [categories]
      description: |-
        Content moderation configuration. Required when `type` is `moderation`.
      x-celigo-ai-guidance:
        - |-
          Required when `guardrail.type` is "moderation".
          At least one category must be specified.
      properties:
        categories:
          type: array
          description: |-
            Content moderation categories to check. When `type` is
            `moderation`, at least one entry is required; the inactive
            sibling on other guardrail types may be served with an empty
            list.
          x-celigo-ai-guidance:
            - At least one category must be specified when using moderation guardrails.
          items:
            type: string
            enum:
              - sexual
              - sexual_minors
              - hate
              - hate_threatening
              - harassment
              - harassment_threatening
              - self_harm
              - self_harm_intent
              - self_harm_instructions
              - violence
              - violence_graphic
              - illicit
              - illicit_violent
            x-enumDescriptions:
              sexual: Content depicting sexual activity or explicit sexual material.
              sexual_minors: Sexual content involving minors.
              hate: Content expressing hatred toward a group based on protected characteristics.
              hate_threatening: Hateful content that includes threats of violence or serious harm.
              harassment: Content that targets, intimidates, or bullies an individual.
              harassment_threatening: Harassment content that includes threats of violence or serious harm.
              self_harm: Content that promotes or depicts self-harm behaviors.
              self_harm_intent: Content expressing intent to engage in self-harm.
              self_harm_instructions: Content providing instructions for self-harm methods.
              violence: Content depicting or promoting physical violence.
              violence_graphic: Graphic or gory depictions of violence or injury.
              illicit: Content promoting illegal activities or unlawful behavior.
              illicit_violent: Content promoting illegal activities that involve violence.
          examples:
            - ["hate", "violence", "harassment"]
            - ["sexual", "self_harm", "illicit"]
  required:
    - type
    - confidenceThreshold
  if:
    required: [type]
    properties:
      type:
        const: pii
  then:
    required: [pii]
    properties:
      pii:
        required: [entities]
        properties:
          entities:
            minItems: 1
  else:
    if:
      required: [type]
      properties:
        type:
          const: moderation
    then:
      required: [moderation]
      properties:
        moderation:
          required: [categories]
          properties:
            categories:
              minItems: 1
    else:
      required: [aiAgent]
      properties:
        aiAgent:
          $ref: '#/GuardrailAiAgentConfig'

GuardrailAiAgentConfig:
  type: object
  description: |
    LLM configuration for an `ai_agent` guardrail — which provider and model evaluate each
    record, with instructions, parameter tuning, and output format. Guardrails never invoke
    tools, so unlike an AI agent import no block here accepts a `tools` array. MCP `prompts`
    and `resources` are accepted on save, but an unreachable MCP server doesn't fail the
    run (verified on OpenAI), so put the policy the guardrail must apply in its
    instructions. Providers come in two families with two configuration formats:

    - **Built-in providers** — each has its own configuration block.
      - **openai**: OpenAI models (GPT-4.1, GPT-5, etc.). Configure via the `openai` object.
      - **gemini**: Google Gemini models via the LiteLLM proxy. Configure via `litellm` with overrides in `litellm._overrides.gemini`.
      - **anthropic**: Anthropic Claude models via the LiteLLM proxy. Configure via `litellm` with overrides in `litellm._overrides.anthropic`.
    - **Catalog providers** — `mistral`, `xai`, `huggingface`, `deepseek`, `cohere`, `groq`. Added
      as catalog data rather than platform code, they share one generic flat format:
      `model`, `modelOptions`, `instructions`, `output`, and the `prompts` / `resources`
      arrays directly on this object.

    A `_connectionId` on the parent import selects bring-your-own-key (BYOK)
    credentials. Without one, built-in providers run on platform-managed
    credentials; catalog providers have no platform-managed credentials, so the
    save requires one — without it the guardrail fails to save with 422
    `connection_required` on `_connectionId`.
  x-celigo-ai-guidance:
    - |-
      Do not send `tools` on any block. A non-empty array at `tools`, `openai.tools`,
      `litellm._overrides.gemini.tools`, or `litellm._overrides.anthropic.tools` fails the
      save with 422 `guardrail_tools_not_allowed` naming that path. Responses still echo
      `openai.tools: []` on OpenAI guardrails; do not copy it back into a write.
  required: [provider]
  properties:
    provider:
      type: string
      enum: ["openai", "gemini", "anthropic", "mistral", "xai", "huggingface", "deepseek", "cohere", "groq"]
      x-enumDescriptions:
        openai: Use OpenAI models via the OpenAI Responses API (built-in; `openai` block).
        gemini: Use Google Gemini models via the LiteLLM proxy (built-in; `litellm` block).
        anthropic: Use Anthropic Claude models via the LiteLLM proxy (built-in; `litellm` block).
        mistral: Use Mistral models (catalog provider; generic flat format, BYOK).
        xai: Use xAI Grok models (catalog provider; generic flat format, BYOK).
        huggingface: Use Hugging Face inference endpoint models (catalog provider; generic flat format, BYOK).
        deepseek: Use DeepSeek models (catalog provider; generic flat format, BYOK).
        cohere: Use Cohere models (catalog provider; generic flat format, BYOK).
        groq: Use Groq-hosted models (catalog provider; generic flat format, BYOK).
      description: AI provider to use.
      x-celigo-ai-guidance:
        - |-
          The provider decides the configuration format, and the server rejects a
          mismatch with 422 `invalid_provider_config_format`: `openai` needs the
          `openai` block, `gemini` and `anthropic` need the `litellm` block (Gemini- or
          Claude-specific settings under `litellm._overrides`), and the catalog
          providers (`mistral`, `xai`, `huggingface`, `deepseek`, `cohere`, `groq`) need the
          generic flat format — `model` and `modelOptions` directly on this object,
          never an `openai` or `litellm` block.
        - |-
          Catalog providers are BYOK-only, and the save enforces it: without a `_connectionId`
          the guardrail fails to save with 422 `connection_required` on `_connectionId` ("No
          API key is available for provider 'xai'. Add a connection for this provider with
          your API key and select it on this agent."). Attach an HTTP connection to the
          vendor's API (token auth) before saving a catalog-provider guardrail.
    model:
      type: string
      description: |-
        Model identifier for a catalog provider (generic flat format) — for example
        `grok-4.6`. Built-in providers set the model inside their own block
        (`openai.model`, `litellm.model`) instead.
      x-celigo-ai-guidance:
        - |-
          Required for every catalog provider — omitting it or sending an empty string
          fails the save with 422 `missing_required_field`.
        - |-
          The connection is checked before the model: without a `_connectionId` on the
          parent import a catalog-provider guardrail fails to save with 422
          `connection_required` whatever the model string (an unknown id included).
          With a `_connectionId` (BYOK) any model string saves — the server does not
          check it against the catalog or the vendor.
    modelOptions:
      type: object
      description: |-
        Model tuning for a catalog provider (generic flat format). Which keys, values, and
        ranges are accepted is defined per catalog model and validated on save when the
        model is a catalog entry.
      properties:
        maxOutputTokens:
          type: number
          description: Maximum number of tokens the model may generate.
        temperature:
          type: number
          description: Sampling temperature.
        topP:
          type: number
          description: Nucleus sampling threshold.
        reasoning_effort:
          type: string
          enum: ["low", "medium", "high", "xhigh"]
          x-enumDescriptions:
            low: Minimal reasoning before answering.
            medium: Moderate reasoning.
            high: Extensive reasoning.
            xhigh: Maximum reasoning.
          description: Reasoning depth for models that expose it.
      x-celigo-ai-guidance:
        - |-
          When the model is a catalog entry, the server validates this object against
          that model's schema and fails the save with 422 `invalid_model_options`
          naming the key: unknown keys are rejected, `reasoning_effort` must be one of
          the enum values where the model accepts it at all (xAI's `grok-4.6` does;
          DeepSeek's `deepseek-chat` rejects the key), and numeric bounds apply —
          on `grok-4.6`, `temperature` ≤ 2, `topP` ≤ 1, `maxOutputTokens` ≥ 100.
        - |-
          With a `_connectionId` and a model the catalog does not list, the object is
          passed through unvalidated — send only options the vendor's API accepts.
    instructions:
      type: string
      description: |-
        System prompt for a catalog provider (generic flat format). Built-in providers
        set it inside their own block (`openai.instructions`,
        `litellm._overrides.anthropic.systemInstruction`).
    output:
      type: object
      description: |-
        Output format for a catalog provider (generic flat format). Built-in providers
        configure it inside their own block (`openai.output`, `litellm.responseFormat`).
      properties:
        format:
          type: object
          description: Controls the structure of the model's output.
          properties:
            type:
              type: string
              enum: ["text", "json_schema"]
              x-enumDescriptions:
                text: Free-form text.
                json_schema: Structured JSON conforming to `jsonSchema`.
              description: Output type.
              x-celigo-ai-guidance:
                - |-
                  `blob` is not accepted here — the save fails with 422
                  `unsupported_output_format` naming the model (verified on `grok-4.6`).
            name:
              type: string
              description: Name of the JSON schema, for `json_schema` output.
            strict:
              type: boolean
              description: When true, the model must conform exactly to `jsonSchema`.
            jsonSchema:
              type: object
              additionalProperties: true
              description: JSON Schema the structured output must conform to, for `json_schema` output.
        verbose:
          type: string
          description: Level of detail in the model's response, for models that expose it.
    tools:
      type: array
      deprecated: true
      description: |-
        Not available on guardrails: a non-empty array fails the save with 422
        `guardrail_tools_not_allowed`. Kept in source only because the field exists on the
        shared import model.
      items:
        type: object
        additionalProperties: true
    prompts:
      type: array
      description: |-
        MCP prompt entries saved with a catalog-provider guardrail (generic flat format).
        Each entry references one MCP connection and the prompt names allowed from it.
      items:
        type: object
        properties:
          type:
            type: string
            enum: ["mcp"]
            x-enumDescriptions:
              mcp: Reference prompts exposed by an MCP server.
            description: Type of prompt entry. Always "mcp".
          mcp:
            type: object
            properties:
              _mcpConnectionId:
                type: string
                format: objectId
                x-celigo-refModel: connections
                description: Connection to the MCP server that exposes the prompts.
              allowedPrompts:
                type: array
                description: Prompt names the model may fetch from the server.
                items:
                  type: string
      x-celigo-ai-guidance:
        - |-
          An unknown `_mcpConnectionId` fails the save with 422 `invalid_ref` naming
          the array index.
    resources:
      $ref: '../schemas/aiagent.yml#/McpResources'
    openai:
      type: object
      description: |
        OpenAI-specific configuration. Used when `provider` is "openai".
      required: [model, instructions]
      properties:
        instructions:
          type: string
          maxLength: 1000000
          description: |
            System prompt that defines the check's behavior, goals, and constraints.
          examples: ["You are a data validation agent. Check each record for completeness."]
          x-celigo-ui-override: >-
            Required by the AI agent configuration form (the model's system prompt). Encoded
            here to mirror the form so builders produce connectable configurations.
        model:
          type: string
          description: |-
            OpenAI model identifier. Open string (not an enum) — model names change frequently.
          examples: ["gpt-5.4", "gpt-5.4-pro", "gpt-5-mini", "gpt-5-nano", "gpt-4.1-mini"]
          x-celigo-ui-override: >-
            Required by the AI agent configuration form. Encoded here to mirror the form so
            builders produce connectable configurations.
          x-celigo-ai-guidance:
            - |-
              With platform-managed credentials (no `_connectionId` on the parent
              import), the model must be one the platform hosts. The save does not
              check this — an unlisted model saves, and the guardrail's first run fails
              with 422 `invalid_model`, whose message lists the hosted models. A
              BYOK connection bypasses the hosted list and the model string is
              passed through to the provider as-is.
        reasoning:
          type: object
          description: |-
            Controls depth of reasoning for complex tasks.
          x-celigo-ai-guidance:
            - |-
              Supported on reasoning-capable OpenAI models only (currently the GPT-5 family and the o-series).
              Setting `reasoning` on a non-reasoning model (e.g.
              `gpt-4.1-mini`) is rejected by the provider at runtime — omit the field on those models.
          properties:
            effort:
              type: string
              enum: ["none", "minimal", "low", "medium", "high", "xhigh", "max"]
              x-enumDescriptions:
                none: No additional reasoning effort.
                minimal: Least reasoning effort for simple, straightforward tasks.
                low: Light reasoning for moderately simple tasks.
                medium: Balanced reasoning effort for typical tasks.
                high: Extensive reasoning effort for complex, multi-step tasks.
                xhigh: Extended reasoning effort beyond high for demanding tasks.
                max: Highest available reasoning effort.
              description: How much reasoning effort the model should invest
              x-celigo-ai-guidance:
                - |-
                  How much reasoning effort the model should invest.
                  Reasoning- capable models only — see `reasoning` for the gating rule.
            summary:
              type: string
              enum: ["concise", "auto", "detailed"]
              x-enumDescriptions:
                concise: Brief, high-level reasoning summary.
                auto: Let the model decide the appropriate level of detail.
                detailed: Comprehensive reasoning summary with full explanations.
              description: Level of detail in reasoning summaries
              x-celigo-ai-guidance:
                - |-
                  Level of detail in reasoning summaries.
                  Reasoning-capable models only — see `reasoning` for the gating rule.
        temperature:
          type: number
          minimum: 0
          maximum: 2
          description: |
            Sampling temperature. Higher values (e.g. 1.5) produce more creative output,
            lower values (e.g. 0.2) produce more focused and deterministic output.
        topP:
          type: number
          minimum: 0.1
          maximum: 1
          description: Nucleus sampling parameter
        topLogprobs:
          type: number
          minimum: 0
          maximum: 20
          description: Number of most likely tokens to return log probabilities for at each output position.
        maxOutputTokens:
          type: number
          minimum: 100
          maximum: 128000
          description: Maximum number of tokens in the model's response. Unlike an AI agent import, a guardrail does not receive a server-written value when this is omitted.
        serviceTier:
          type: string
          enum: ["auto", "default", "priority"]
          x-enumDescriptions:
            auto: Let OpenAI automatically select the appropriate service tier.
            default: Standard service tier with normal rate limits and latency.
            priority: Premium tier with higher rate limits and lower latency at increased cost.
          description: |-
            OpenAI service tier. "priority" provides higher rate limits and
            lower latency at increased cost.
          x-celigo-ai-guidance:
            - |-
              BYOK only.
              Platform-managed credentials (no `_connectionId` on the parent import) always
              run at `default` regardless of what's set here.
        output:
          type: object
          description: |-
            Output format configuration. A guardrail stores `format` but doesn't use it: the
            request to the model always carries the guardrail's own `validation_result` JSON
            schema (`flagged`, `reasoning`, `confidence`), and the result returns `flagged` and
            `reasoning` whatever `format` holds.
          properties:
            format:
              type: object
              description: |
                Stored output structure. The request to the model uses the guardrail's own
                verdict schema instead (see `output`).
              properties:
                type:
                  type: string
                  enum: ["text", "json_schema", "blob"]
                  x-enumDescriptions:
                    text: Stored format type; the model request still uses the guardrail's verdict schema.
                    json_schema: A stored JSON schema (`jsonSchema`); the model request still uses the guardrail's verdict schema.
                    blob: Stored format type; the model request still uses the guardrail's verdict schema.
                  description: Output format type, as stored.
                schemaMode:
                  type: string
                  enum: ["manual", "json"]
                  x-enumDescriptions:
                    manual: The schema editor opens `jsonSchema` in the visual field-by-field view
                    json: The schema editor opens `jsonSchema` in the raw JSON view
                  description: |-
                    Which view a schema editor opens `jsonSchema` in. Stored and echoed on
                    guardrails for parity with the AI-agent format block — the guardrail form
                    does not set it today, and neither view changes the model request.
                  x-celigo-ai-guidance:
                    - |-
                      Resend the stored value on every update — a full PUT that omits the field
                      clears it — and never invent one: a value outside the enum fails the save with
                      422 `enum` on `guardrail.aiAgent.openai.output.format.schemaMode`.
                name:
                  type: string
                  description: Name for the output format (used with json_schema)
                  x-celigo-ui-override: >-
                    Required by the AI agent form when output format type is json_schema. Encoded
                    here to mirror the form so builders produce connectable configurations.
                strict:
                  type: boolean
                  description: Stored strict-validation flag for `jsonSchema`. A guardrail's model request uses its own verdict schema, so this doesn't apply there.
                  x-celigo-ai-guidance:
                    - Stored only on a guardrail; it doesn't change the guardrail's verdict.
                jsonSchema:
                  type: object
                  description: |
                    Stored JSON Schema. Required when `format.type` is "json_schema". A guardrail
                    doesn't send it to the model; the request carries the `validation_result`
                    verdict schema instead.
                  x-celigo-ui-override: >-
                    Required by the AI agent form when output format type is json_schema. Encoded
                    here to mirror the form so builders produce connectable configurations.
                  properties:
                    type:
                      type: string
                      description: Root type of the stored JSON Schema.
                      enum: ["object", "array", "string", "number", "integer", "boolean"]
                      x-enumDescriptions:
                        object: JSON object with named properties.
                        array: Ordered list of values.
                        string: Text string value.
                        number: Numeric value including decimals.
                        integer: Whole number value without decimals.
                        boolean: True or false value.
                    properties:
                      type: object
                      additionalProperties: true
                      description: Field definitions in the stored JSON Schema.
                    required:
                      type: array
                      description: Property names the stored JSON Schema marks as required.
                      items:
                        type: string
                    additionalproperties:
                      type: boolean
                      description: Whether the stored JSON Schema allows properties beyond those in `properties`.
                schema:
                  type: object
                  readOnly: true
                  additionalProperties: true
                  description: |-
                    Server-written copy of `jsonSchema`, present in responses once `jsonSchema`
                    is set. Send `jsonSchema`, not this field.
              if:
                properties:
                  type:
                    const: json_schema
                required: [type]
              then:
                required: [name, jsonSchema]
            verbose:
              type: string
              enum: ["low", "medium", "high"]
              x-enumDescriptions:
                low: Minimal detail in the model's response.
                medium: Moderate detail in the model's response, the default level.
                high: Maximum detail and verbosity in the model's response.
              description: Level of detail in the model's response
              x-celigo-ai-guidance:
                - |-
                  Supported on the GPT-5 family only. Other OpenAI models (e.g.
                  `gpt-4.1`, `gpt-4.1-mini`,
                  `gpt-4.1-nano`) accept only `medium` (the no-op default) — `low` and `high` are
                  rejected by the provider at runtime.
                  Omit the field entirely on non-GPT-5 models rather than relying on the default.
        tools:
          type: array
          deprecated: true
          description: |-
            Always an empty array on guardrails saved today: the server writes `[]` and
            rejects a non-empty array with 422 `guardrail_tools_not_allowed`. Guardrails
            saved before the restriction may still return their stored entries.
          items:
            type: object
            additionalProperties: true
        prompts:
          type: array
          description: |-
            MCP prompt entries saved with the guardrail. Each item references one
            MCP connection and the prompt names allowed from it.
          items:
            type: object
            properties:
              type:
                type: string
                enum: ["mcp"]
                x-enumDescriptions:
                  mcp: Connect to an MCP server to use its exposed prompts.
                description: Type of prompt entry. Always "mcp".
              mcp:
                type: object
                description: MCP server prompt configuration.
                properties:
                  _mcpConnectionId:
                    type: string
                    format: objectId
                    x-celigo-refModel: connections
                    description: Connection to the MCP server.
                  allowedPrompts:
                    type: array
                    description: Prompt names to allow from the MCP server.
                    items:
                      type: string
        resources:
          $ref: '../schemas/aiagent.yml#/McpResources'
    litellm:
      type: object
      description: |
        LiteLLM proxy configuration. Used when `provider` is "gemini" or "anthropic".

        LiteLLM provides a unified interface to multiple AI providers. Gemini-specific
        settings are in `_overrides.gemini`; Claude-specific settings are in
        `_overrides.anthropic`.

        `model` is required when litellm is the active provider path.
      properties:
        model:
          type: string
          description: |-
            LiteLLM model identifier. For Gemini, models are stored without the `gemini/`
            prefix; for Anthropic, use the Claude model id (e.g. `claude-sonnet-4-6`).
          examples: ["gemini-2.5-flash", "gemini-2.5-pro", "gemini-2.5-flash-lite", "claude-sonnet-4-6", "claude-opus-4-7"]
          x-celigo-ui-override: >-
            Required by the AI agent configuration form. Encoded here to mirror the form so
            builders produce connectable configurations.
          x-celigo-ai-guidance:
            - |-
              With platform-managed credentials (no `_connectionId` on the parent
              import), the model must be one the platform hosts for the provider —
              Gemini and Anthropic Claude both have a hosted list. The save does not
              check this — an unlisted model saves, and the guardrail's first run fails
              with 422 `invalid_model`, whose message lists the hosted models.
        temperature:
          type: number
          minimum: 0
          maximum: 2
          description: Sampling temperature
          x-celigo-ai-guidance:
            - |-
              When `provider` is "anthropic", the value must be between 0 and 1 — a higher value
              fails the save with 422 `invalid_field_value`. Gemini accepts the full 0-2 range.
        maxCompletionTokens:
          type: number
          minimum: 100
          maximum: 128000
          description: Maximum number of tokens in the response
        topP:
          type: number
          minimum: 0.1
          maximum: 1
          description: Nucleus sampling parameter
        seed:
          type: number
          description: Random seed for reproducible outputs
        responseFormat:
          type: object
          description: Output format configuration
          x-celigo-ai-guidance:
            - |-
              When `provider` is "anthropic", `type` must be "text" or "json_schema" — "blob" is
              rejected with 422 `invalid_response_format`. As with the other providers, "json_schema"
              requires `name` and `jsonSchema`.
          properties:
            type:
              type: string
              description: Output format type.
              enum: ["text", "json_schema", "blob"]
              x-enumDescriptions:
                text: Free-form text response from the model.
                json_schema: Structured JSON output conforming to a defined schema.
                blob: Binary data output for non-text content.
            schemaMode:
              type: string
              enum: ["manual", "json"]
              x-enumDescriptions:
                manual: The schema editor opens `jsonSchema` in the visual field-by-field view
                json: The schema editor opens `jsonSchema` in the raw JSON view
              description: |-
                Which view a schema editor opens `jsonSchema` in; the schema sent to the provider
                is the same either way. Stored and echoed on guardrails for parity with the
                AI-agent format block — the guardrail form does not set it today.
              x-celigo-ai-guidance:
                - |-
                  Resend the stored value on every update — a full PUT that omits the field clears
                  it — and never invent one: a value outside the enum fails the save with 422 `enum`
                  on `guardrail.aiAgent.litellm.responseFormat.schemaMode`.
            name:
              type: string
              description: Name for the output format (used with json_schema).
              x-celigo-ui-override: >-
                Required by the AI agent form when output format type is json_schema. Encoded
                here to mirror the form so builders produce connectable configurations.
            strict:
              type: boolean
              description: When true, enforces strict schema validation on output.
            jsonSchema:
              type: object
              description: JSON Schema for structured output. Required when `responseFormat.type` is "json_schema".
              x-celigo-ui-override: >-
                Required by the AI agent form when output format type is json_schema. Encoded
                here to mirror the form so builders produce connectable configurations.
              properties:
                type:
                  type: string
                  description: Root JSON Schema type of the structured output; use "object" for record-shaped results.
                  enum: ["object", "array", "string", "number", "integer", "boolean"]
                  x-enumDescriptions:
                    object: JSON object with named properties.
                    array: Ordered list of values.
                    string: Text string value.
                    number: Numeric value including decimals.
                    integer: Whole number value without decimals.
                    boolean: True or false value.
                properties:
                  type: object
                  additionalProperties: true
                  description: JSON Schema definitions for each field the structured output may contain.
                required:
                  type: array
                  description: Property names the model must include in the structured output.
                  items:
                    type: string
                additionalProperties:
                  type: boolean
                  description: When true, the structured output may include properties beyond those defined in `properties`.
          if:
            properties:
              type:
                const: json_schema
            required: [type]
          then:
            required: [name, jsonSchema]
        _overrides:
          type: object
          description: Provider-specific overrides
          properties:
            gemini:
              type: object
              description: |
                Gemini-specific configuration overrides.
              required: [systemInstruction]
              properties:
                systemInstruction:
                  type: string
                  maxLength: 1000000
                  description: |
                    System instruction for Gemini models. Equivalent to OpenAI's `instructions`.
                    Maximum 1,000,000 characters.
                  x-celigo-ui-override: >-
                    Required by the AI agent configuration form (the model's system prompt, the
                    Gemini equivalent of `instructions`). Encoded here to mirror the form so
                    builders produce connectable configurations.
                tools:
                  type: array
                  deprecated: true
                  description: |-
                    Not available on guardrails: a non-empty array fails the save with 422
                    `guardrail_tools_not_allowed`.
                  items:
                    type: object
                    additionalProperties: true
                prompts:
                  type: array
                  description: |-
                    MCP prompt entries saved with a Gemini guardrail. Each item references one
                    MCP connection and the prompt names allowed from it.
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        enum: ["mcp"]
                        x-enumDescriptions:
                          mcp: Connect to an MCP server to use its exposed prompts.
                        description: Type of prompt entry. Always "mcp".
                      mcp:
                        type: object
                        description: MCP server prompt configuration.
                        properties:
                          _mcpConnectionId:
                            type: string
                            format: objectId
                            x-celigo-refModel: connections
                            description: Connection to the MCP server.
                          allowedPrompts:
                            type: array
                            description: Prompt names to allow from the MCP server.
                            items:
                              type: string
                resources:
                  $ref: '../schemas/aiagent.yml#/McpResources'
                responseModalities:
                  type: array
                  description: Response output modalities
                  x-celigo-ai-guidance:
                    - |-
                      `["image"]` requires an image-capable Gemini model (currently `gemini-2.5-flash-image`).
                      Selecting it on a text-only model is rejected by the provider — pair image
                      output with the right model or omit.
                  items:
                    type: string
                    enum: ["text", "image"]
                    x-enumDescriptions:
                      text: Generate text content in the response.
                      image: Generate image content in the response.
                topK:
                  type: number
                  description: Top-K sampling parameter for Gemini
                thinkingConfig:
                  type: object
                  description: Controls Gemini's extended thinking capabilities
                  x-celigo-ai-guidance:
                    - |-
                      Supported on reasoning-capable Gemini models only (currently `gemini-2.5-pro`
                      and `gemini-2.5-flash`).
                      Setting `thinkingConfig` on a non-thinking model (e.g.
                      `gemini-2.5-flash-lite`,
                      `gemini-2.5-flash-image`) is rejected by the provider at runtime — omit the
                      field on those models.
                  properties:
                    includeThoughts:
                      type: boolean
                      description: When true, includes the model's thinking steps in the response.
                      x-celigo-ai-guidance:
                        - Whether to include thinking steps in the response
                    thinkingBudget:
                      type: number
                      minimum: 100
                      maximum: 4000
                      description: Maximum tokens allocated for thinking
                    thinkingLevel:
                      type: string
                      description: Controls how much thinking effort the model applies; use higher levels for complex, multi-step tasks at the cost of latency and tokens.
                      enum: ["minimal", "low", "medium", "high"]
                      x-enumDescriptions:
                        minimal: Least thinking effort for simple tasks.
                        low: Light thinking for moderately simple tasks.
                        medium: Balanced thinking effort for typical tasks.
                        high: Maximum thinking effort for complex, multi-step tasks.
                imageConfig:
                  type: object
                  description: Gemini image generation configuration
                  properties:
                    aspectRatio:
                      type: string
                      description: Aspect ratio of generated images; choose a ratio matching the intended display format.
                      enum: ["1:1", "2:3", "3:2", "3:4", "4:3", "4:5", "5:4", "9:16", "16:9", "21:9"]
                      x-enumDescriptions:
                        "1:1": Square aspect ratio.
                        "2:3": Portrait aspect ratio (2 wide by 3 tall).
                        "3:2": Landscape aspect ratio (3 wide by 2 tall).
                        "3:4": Portrait aspect ratio (3 wide by 4 tall).
                        "4:3": Standard landscape aspect ratio (4 wide by 3 tall).
                        "4:5": Portrait aspect ratio (4 wide by 5 tall).
                        "5:4": Landscape aspect ratio (5 wide by 4 tall).
                        "9:16": Tall portrait aspect ratio for mobile screens.
                        "16:9": Widescreen landscape aspect ratio.
                        "21:9": Ultra-widescreen cinematic aspect ratio.
                    imageSize:
                      type: string
                      description: Output resolution of generated images; higher resolutions increase detail and file size.
                      enum: ["1K", "2K", "4K"]
                      x-enumDescriptions:
                        "1K": Standard resolution output around 1024 pixels.
                        "2K": High resolution output around 2048 pixels.
                        "4K": Ultra-high resolution output around 4096 pixels.
                mediaResolution:
                  type: string
                  enum: ["low", "medium", "high"]
                  x-enumDescriptions:
                    low: Low resolution for faster processing and reduced token usage.
                    medium: Balanced resolution for typical media processing.
                    high: High resolution for maximum detail in media inputs.
                  description: Resolution for media inputs (images, video)
            anthropic:
              type: object
              description: |
                Claude-specific configuration overrides. Used when `provider` is "anthropic".
              required: [systemInstruction]
              properties:
                systemInstruction:
                  type: string
                  maxLength: 1000000
                  description: |
                    System instruction for Claude models. Equivalent to OpenAI's `instructions`.
                    Maximum 1,000,000 characters.
                  x-celigo-ui-override: >-
                    Required by the AI agent configuration form (the model's system prompt, the
                    Claude equivalent of `instructions`). Encoded here to mirror the form so
                    builders produce connectable configurations.
                topK:
                  type: number
                  minimum: 0
                  description: |-
                    Top-K sampling parameter. Deprecated on Claude models released after Claude Opus
                    4.6, which reject any value at runtime; set it only on older models.
                thinkingConfig:
                  type: object
                  description: Controls Claude's extended thinking capabilities.
                  properties:
                    type:
                      type: string
                      enum: ["enabled", "disabled", "adaptive"]
                      x-enumDescriptions:
                        enabled: Turn on extended thinking with an explicit token budget.
                        disabled: Turn off extended thinking.
                        adaptive: Let the model decide how much to think based on task complexity.
                      description: Extended thinking mode.
                    budgetTokens:
                      type: number
                      minimum: 1024
                      description: |-
                        Maximum tokens allocated for thinking. Required when `type` is "enabled" —
                        omitting it fails the save with 422 `invalid_thinking_config`.
                      x-celigo-ui-override: >-
                        Required by the AI agent form when thinkingConfig.type is "enabled". Encoded
                        here to mirror the form so builders produce connectable configurations.
                    display:
                      type: string
                      enum: ["summarized", "omitted"]
                      x-enumDescriptions:
                        summarized: Include a summarized view of the model's thinking in the response.
                        omitted: Exclude the model's thinking from the response.
                      description: How thinking output is surfaced in the response.
                    effort:
                      type: string
                      enum: ["low", "medium", "high", "xhigh", "max"]
                      x-enumDescriptions:
                        low: Light thinking effort for moderately simple tasks.
                        medium: Balanced thinking effort for typical tasks.
                        high: Maximum standard thinking effort for complex tasks.
                        xhigh: Extended thinking effort beyond high for demanding tasks.
                        max: Highest available thinking effort.
                      description: |-
                        How much thinking effort the model applies; use with `type` "adaptive". Higher
                        values (`xhigh`, `max`) may be gated to specific Claude models by the provider.
                  if:
                    properties:
                      type:
                        const: enabled
                    required: [type]
                  then:
                    required: [budgetTokens]
                serviceTier:
                  type: string
                  enum: ["auto", "standard_only"]
                  x-enumDescriptions:
                    auto: Let Anthropic select the appropriate service tier.
                    standard_only: Restrict processing to the standard service tier.
                  description: Anthropic service tier for the request.
                tools:
                  type: array
                  deprecated: true
                  description: |-
                    Not available on guardrails: a non-empty array fails the save with 422
                    `guardrail_tools_not_allowed`.
                  items:
                    type: object
                    additionalProperties: true
                prompts:
                  type: array
                  description: |-
                    MCP prompt entries saved with a Claude guardrail. Each item references one
                    MCP connection and the prompt names allowed from it.
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        enum: ["mcp"]
                        x-enumDescriptions:
                          mcp: Connect to an MCP server to use its exposed prompts.
                        description: Type of prompt entry. Always "mcp".
                      mcp:
                        type: object
                        description: MCP server prompt configuration.
                        properties:
                          _mcpConnectionId:
                            type: string
                            format: objectId
                            x-celigo-refModel: connections
                            description: Connection to the MCP server.
                          allowedPrompts:
                            type: array
                            description: Prompt names to allow from the MCP server.
                            items:
                              type: string
                resources:
                  $ref: '../schemas/aiagent.yml#/McpResources'
  # Same provider→block chain as the AI agent import's AiAgentConfig: the instance-level
  # `required` is what forces the provider's block to exist.
  if:
    properties:
      provider:
        const: openai
    required: [provider]
  then:
    required: [openai]
    properties:
      openai:
        required: [model, instructions]
  else:
    if:
      properties:
        provider:
          enum: [gemini, anthropic]
      required: [provider]
    then:
      required: [litellm]
      properties:
        litellm:
          required: [model]
    else:
      if:
        properties:
          provider:
            enum: [mistral, xai, huggingface, deepseek, cohere, groq]
        required: [provider]
      then:
        required: [model]
