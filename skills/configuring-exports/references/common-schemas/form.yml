Form:
  type: object
  description: |
    Configuration for creating user-friendly settings forms that make it easier for less technical users
    to configure integration resources.

    **Settings form builder**

    The Settings Form Builder allows you to create or edit user-friendly fields that prompt for text entry
    or selections that will be returned as settings applied to this resource. Your forms can include any
    field types that you see elsewhere in integrator.io, such as:

    - Text fields
    - Dropdown selections
    - Checkboxes
    - Radio buttons
    - Date pickers
    - Multi-select fields
    - Search fields

    Form fields make it much easier for less technical users to work with your integration settings by:

    - Providing clear labels and help text
    - Enforcing validation rules
    - Offering pre-defined selection options
    - Grouping related settings logically
    - Supporting conditional visibility
    - Creating a consistent user experience
  properties:
    form:
      type: object
      description: |
        Configuration that defines the structure, fields, and behavior of the settings form.

        This object contains the complete definition of the form's layout, fields, validation rules,
        and interactive behaviors. The specific structure depends on the form complexity and can include
        field definitions, sections, conditional display logic, and default values.

        The form configuration is typically created and managed through the visual Form Builder interface
        rather than edited directly as JSON.
      properties:
        fieldMap:
          type: object
          description: |
            A mapping of field identifiers to their configuration objects.
            Each key in this object represents a unique field ID, and the value contains
            all the configuration settings for that specific form field.
          additionalProperties:
            type: object
            description: |
              Configuration for an individual form field.
            properties:
              id:
                type: string
                description: |
                  Unique identifier for this field within the form: layout containers and conditions
                  refer to the field by it. Use the same string as the field's fieldMap key and its `name`.
                examples: ["url", "mode", "body", "keyValue", "text", "multiline"]
              name:
                type: string
                description: |
                  Key the field's value is saved under: one top-level key of the resource's `settings`,
                  which the form also reads the value back from when it opens. Nested objects inside
                  `settings` are written to it directly, not through a form field's `name`.
                examples: ["url", "mode", "body", "keyValue", "text", "multiline"]
              type:
                type: string
                description: |
                  The type of form control to render for this field.
                enum: [
                  "text", "checkbox", "radiogroup", "relativeuri", "editor", "keyvalue",
                  "select", "multiselect", "toggle", "datetime", "date",
                  "exportSelect", "staticMap"
                  ]
                x-enumDescriptions:
                  text: Single-line or multi-line text input field.
                  checkbox: Boolean checkbox control for true/false values.
                  radiogroup: Group of mutually exclusive radio button options.
                  relativeuri: Text input for entering a relative URI path.
                  editor: Code or content editor with syntax highlighting.
                  keyvalue: Dynamic list of key-value pair inputs.
                  select: Dropdown menu for selecting a single option.
                  multiselect: Dropdown menu that allows selecting multiple options.
                  toggle: On/off toggle switch control.
                  datetime: Date and time picker control.
                  date: Date-only picker control without a time component.
                  exportSelect: Dropdown whose options are records returned by an export.
                  staticMap: Static two-column mapping table for pairing source and destination values.
                examples: ["text", "checkbox", "radiogroup", "editor", "keyvalue", "select", "multiselect"]
              label:
                type: string
                description: |
                  Display label shown next to the field in the form.
                examples: ["Some url with handlebars support.", "Mode of operation", "Key-value pairs", "Text"]
              description:
                type: string
                description: |
                  Detailed explanation text that appears below the field, providing more context
                  than the label or helpText.
                examples: ["This input is used to collect a set of key-value pairs. The item delete action is optional and set using th showDelete prop. Also note that he key and value names can be configured as well."]
              helpText:
                type: string
                description: |
                  Explanatory text that appears when hovering over the help icon next to the field.
                  Used to provide additional guidance on how to use the field.
                examples: ["example of a custom input.", "This is the most basic input. It models an http form input"]
              required:
                type: boolean
                description: |
                  When true, the field must have a value before the form can be submitted. Only the form
                  enforces it: an API write of `settings` is stored without the value.
                default: false
                examples: [true, false]
              defaultValue:
                description: |
                  Value the form shows while the resource's `settings` holds no value under the field's
                  `name`.
                examples: ["us", true]
              multiline:
                type: boolean
                description: |
                  For text fields, determines whether the input should be a multi-line text area
                  instead of a single-line input.
                default: false
                examples: [true, false]
              rowsMax:
                type: integer
                description: |
                  For multiline text fields, specifies the maximum number of visible rows.
                examples: [5]
              inputType:
                type: string
                description: |
                  For text fields, specifies the HTML input type attribute to apply additional
                  validation or specialized input behavior.
                enum: ["text", "number", "email", "password", "tel", "url"]
                x-enumDescriptions:
                  text: Standard text input with no special validation.
                  number: Numeric input that restricts entry to numbers.
                  email: Email address input with email format validation.
                  password: Masked text input that hides the entered characters.
                  tel: Telephone number input optimized for phone number entry.
                  url: URL input with web address format validation.
                examples: ["number"]
              delimiter:
                type: string
                description: |
                  For text fields, specifies a character to use for splitting the input into an array.
                  Used for collecting multiple values in a single text field.
                examples: [","]
              mode:
                type: string
                description: |
                  For editor fields, specifies the type of content being edited for syntax highlighting.
                enum: ["json", "xml", "csv", "text"]
                x-enumDescriptions:
                  json: JSON syntax highlighting and validation.
                  xml: XML syntax highlighting and validation.
                  csv: CSV format highlighting for comma-separated data.
                  text: Plain text mode with no syntax highlighting.
                examples: ["json"]
              keyName:
                type: string
                description: |
                  For keyvalue and staticMap fields, names the first column: each saved row holds that
                  column's value under this key. A keyvalue field without it uses `key`.
                examples: ["theKey", "source"]
              valueName:
                type: string
                description: |
                  For keyvalue and staticMap fields, names the second column: each saved row holds that
                  column's value under this key. A keyvalue field without it uses `value`.
                examples: ["theValue", "target"]
              keyLabel:
                type: string
                description: |
                  For staticMap fields, heading of the first column.
                examples: ["Source status"]
              valueLabel:
                type: string
                description: |
                  For staticMap fields, heading of the second column.
                examples: ["Destination status"]
              keyOptions:
                type: array
                description: |
                  For staticMap fields, suggestions offered in the first column's cells. A cell still
                  accepts a typed value.
                items:
                  type: object
                  properties:
                    label:
                      type: string
                      description: |
                        Display text for the suggestion.
                    value:
                      type: string
                      description: |
                        Value saved when the suggestion is chosen.
                examples: [[{"label": "Pending", "value": "pending"}, {"label": "Shipped", "value": "shipped"}]]
              valueOptions:
                type: array
                description: |
                  For staticMap fields, suggestions offered in the second column's cells. A cell still
                  accepts a typed value.
                items:
                  type: object
                  properties:
                    label:
                      type: string
                      description: |
                        Display text for the suggestion.
                    value:
                      type: string
                      description: |
                        Value saved when the suggestion is chosen.
                examples: [[{"label": "Open", "value": "open"}, {"label": "Closed", "value": "closed"}]]
              keyResource:
                type: object
                description: |
                  For staticMap fields, fills the first column's suggestions from an export the form
                  carries inline in `virtual`, run the way an exportSelect's `resource` is. With
                  `keyResource` or `valueResource` set, the form requires both columns in every row
                  unless `keyValueRequired` is false.
                properties:
                  virtual:
                    type: object
                    description: |
                      Export document to run, inline, shaped like an exportSelect's `resource.virtual`.
                    additionalProperties: true
              valueResource:
                type: object
                description: |
                  For staticMap fields, fills the second column's suggestions from an export the form
                  carries inline in `virtual`, run the way an exportSelect's `resource` is.
                properties:
                  virtual:
                    type: object
                    description: |
                      Export document to run, inline, shaped like an exportSelect's `resource.virtual`.
                    additionalProperties: true
              keyValueRequired:
                type: boolean
                description: |
                  For staticMap fields with `keyResource` or `valueResource`, when false, saves rows
                  that fill only one column; by default the form drops them.
                default: true
                examples: [false]
              resource:
                type: object
                description: |
                  For exportSelect fields, the export whose records become the options. When the form
                  opens, the UI previews the export in `virtual` (with `test.limit` 100 unless the export
                  sets its own) and lists the preview's `data`: each record needs a `label` and a `value`
                  (a string or number serves as both), so shape them with the export's `transform`. A
                  saved export can't be referenced, and an HTTP export that finds no records leaves the
                  field showing an error instead of options.
                properties:
                  virtual:
                    type: object
                    description: |
                      Export document to run, inline: `adaptorType`, its adaptor block, and an optional
                      `transform`. `_connectionId` defaults to the connection of the export or import the
                      form belongs to; set it on any other resource's form.
                    additionalProperties: true
                examples:
                  - virtual:
                      adaptorType: HTTPExport
                      http:
                        relativeURI: /v1/warehouses
                        method: GET
                        formType: http
                        response:
                          resourcePath: warehouses
                      transform:
                        type: expression
                        expression:
                          version: "2"
                          rulesTwoDotZero:
                            mode: create
                            mappings:
                              - generate: label
                                extract: $.name
                                dataType: string
                                status: Active
                              - generate: value
                                extract: $.code
                                dataType: string
                                status: Active
              multiselect:
                type: boolean
                description: |
                  For exportSelect fields, when true, the user can choose several options and the value
                  is saved as an array.
                default: false
                examples: [true]
              supportHandlebars:
                type: boolean
                description: |
                  For exportSelect fields, when true, renders the `resource.virtual` export as a Handlebars
                  template before each preview (all but its `transform`, `hooks`, and `filter`). On an
                  integration, flow group, flow, export, or import form, the form's current values are
                  under that form's scope name (`integration`, `flowGrouping`, `flow`, `export`, or
                  `import`), beside the saved settings of the scopes above it, with no `settings.`
                  prefix; on a connection or iClient form the template has no context. The options then
                  load through `refreshOptionsOnChangesTo` or `typeAheadSearch`, or when the user
                  refreshes the field.
                default: false
                examples: [true]
              refreshOptionsOnChangesTo:
                type: array
                items:
                  type: string
                description: |
                  For exportSelect fields with `supportHandlebars`, ids of the fields whose values the
                  templated export uses: the options load once one of them has a value and reload whenever
                  one changes.
                examples: [["region"]]
              typeAheadSearch:
                type: boolean
                description: |
                  For exportSelect fields, when true, re-runs the templated export as the user types, with
                  the typed text as this field's own value; an empty box clears the options, and typed
                  text is accepted as the value.
                default: false
                examples: [true]
              showDelete:
                type: boolean
                description: |
                  For keyvalue fields, determines whether to show a delete button for each key-value pair.
                examples: [true, false]
              doNotAllowFutureDates:
                type: boolean
                description: |
                  For date and datetime fields, restricts selection to dates not in the future.
                examples: [true, false]
              skipTimezoneConversion:
                type: boolean
                description: |
                  For datetime fields, prevents automatic timezone conversion of the date value.
                examples: [true, false]
              options:
                type: array
                description: |
                  For fields that present choices (select, multiselect, radiogroup, toggle), defines
                  the available options.
                items:
                  anyOf:
                    - title: Option group
                      type: object
                      required: [items]
                      properties:
                        items:
                          type: array
                          items:
                            oneOf:
                              - title: String value
                                type: string
                              - title: Label-value pair
                                type: object
                                properties:
                                  label:
                                    type: string
                                    description: |
                                      Display text for the option.
                                    examples: ["United States", "Canada", "India"]
                                  value:
                                    type: string
                                    description: |
                                      Value to store when this option is selected.
                                    examples: ["us", "cdn", "in"]
                          description: |
                            Array of option values/labels to display in the selection control.
                          examples: [
                            ["Create", "Update", "Delete"],
                            [{"label": "United States", "value": "us"}, {"label": "Canada", "value": "cdn"}]
                            ]
                    - title: Label-value pair
                      type: object
                      required: [label]
                      properties:
                        label:
                          type: string
                          description: |
                            Display text for the option.
                          examples: ["US", "Canada", "India"]
                        value:
                          type: string
                          description: |
                            Value to store when this option is selected.
                          examples: ["us", "cdn", "in"]
              visibleWhen:
                type: array
                description: |
                  Conditional display rules that determine when this field should be visible.
                  If empty or not provided, the field is always visible.
                items:
                  type: object
                  properties:
                    field:
                      type: string
                      description: |
                        The ID of another field whose value controls the visibility of this field. The
                        save doesn't check it: a rule naming an ID that isn't in the form counts as met,
                        so the field stays visible.
                      examples: ["mode"]
                    is:
                      type: array
                      items:
                        type: [string, boolean, number, 'null']
                      description: |
                        Array of values - if the referenced field has any of these values,
                        this field will be visible. Values may be strings, booleans (for
                        checkbox/toggle fields), numbers (for numeric inputs), or null.
                      examples: [["Update"], [true]]
        layout:
          type: object
          description: |
            Defines how the form fields are arranged and grouped in the UI.
            The layout can organize fields into columns, sections, or other visual groupings.
          properties:
            type:
              type: string
              description: |
                The type of layout to use for the form.
              enum: ["column", "collapse", "box", "indent", "tabWithoutSave", "verticalTabWithoutSave"]
              x-enumDescriptions:
                column: Places the containers side by side, one column each.
                collapse: Groups fields into collapsible/expandable sections.
                box: Wraps field groups in bordered boxes with headings.
                indent: Indents field groups to show hierarchy.
                tabWithoutSave: Organizes field groups into horizontal tabs (no per-tab save).
                verticalTabWithoutSave: Organizes field groups into vertical tabs (no per-tab save).
              examples: ["column", "collapse"]
            fields:
              type: array
              items:
                type: string
              description: |
                Field IDs shown above the containers, without a heading.
              examples: [["region", "vatNumber"]]
            containers:
              type: array
              description: |
                Array of container objects that group fields or contain nested containers.
                Each container can represent a column, box, indented section, or collapsible section.
              items:
                type: object
                properties:
                  type:
                    type: string
                    description: |
                      The visual style of the container.
                    enum: ["indent", "box", "collapse"]
                    x-enumDescriptions:
                      indent: Indents the contained fields to show hierarchy.
                      box: Wraps the contained fields in a bordered box with a heading.
                      collapse: Wraps the contained fields in a collapsible/expandable section.
                    examples: ["indent", "box", "collapse"]
                  label:
                    type: string
                    description: |
                      The heading text displayed for this container.
                    examples: ["Basic fields", "Advanced fields", "Indented fields", "Boxed fields"]
                  fields:
                    type: array
                    items:
                      type: string
                    description: |
                      Array of field IDs that should be displayed in this container.
                      Each ID must correspond to a key in the fieldMap object: the save doesn't check it,
                      and an ID that doesn't renders nothing. A field the layout doesn't list isn't shown.
                    examples: [["A", "url"], ["mode", "body"], ["keyValue", "checkbox"]]
                  containers:
                    type: array
                    description: |
                      Nested containers within this container. Allows for hierarchical organization
                      of fields with different visual styles.
                    items:
                      type: object
                      properties:
                        label:
                          type: string
                          description: |
                            The heading text displayed for this nested container.
                          examples: ["Indented fields", "Boxed fields", "Collapsed fields"]
                        fields:
                          type: array
                          items:
                            type: string
                          description: |
                            Array of field IDs that should be displayed in this nested container.
                          examples: [["keyValue", "checkbox"]]
      additionalProperties: true
    init:
      type: object
      description: |
        Configuration for custom JavaScript initialization that executes when the form is first loaded.

        This object defines a JavaScript hook that prepares the form for use, sets initial field values,
        performs validation, or otherwise customizes the form behavior before it is displayed to the user.

        **Function signature**

        The initialization function is invoked with a single 'options' argument containing contextual information:
        ```javascript
        function formInit(options) {
          // Process options and return the form object
          return options.resource.settingsForm.form;
        }
        ```

        **Available context**

        The 'options' argument provides access to:
        - `options.resource` - The current resource being configured
        - `options.parentResource` - The parent of the current resource
        - `options.grandparentResource` - The grandparent of the current resource
        - `options.license` - For integration apps, the license provisioned to the integration
        - `options.parentLicense` - For integration apps, the parent of the license
        - `options.sandbox` - Boolean flag indicating whether the script is running in a sandbox environment


        **Common uses**

        - Dynamically generate field options based on resource configuration
        - Pre-populate default values from related resources
        - Apply conditional logic that depends on resource properties
        - Add, remove, or modify form fields based on user permissions or account settings
        - Fetch external data to populate selection options
        - Implement complex validation rules that depend on resource context
        - Create branching form experiences based on user selections

        **Return value**

        The function must return a valid form object that the UI can render.
        Throwing an exception will signal an error to the user.

        The UI runs the function each time it opens the form and renders the returned form instead of
        `form`, then fills in the values from `settings`; a thrown error's message replaces the form.
      properties:
        function:
          type: string
          description: |
            The name of the function to execute within the referenced script.

            This property specifies which function to invoke from the script
            referenced by _scriptId. The function will be called when the form
            is initialized and should handle any custom setup logic.

            The function must follow the expected signature and return a valid form object.
          examples: ["initializeForm", "setupFormState", "prepareFormData"]
        _scriptId:
          type: string
          format: objectId
          x-celigo-refModel: scripts
          description: |
            Reference to a predefined script resource containing the initialization function.

            The referenced script should contain the function specified in the
            'function' property. On an integration, a flow group, a flow, an export, an import, or a
            connection, an id that isn't a script in the same account (or, on an Integration App's
            resources, one the app shares) is refused with 422 `invalid_ref`. An iClient save
            stores the id without that check.
          examples: ["60a2c4e6f321d800129a1a3c", "5f8d43a1b9e5a80011a35f2c"]