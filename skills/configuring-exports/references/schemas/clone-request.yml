CloneRequest:
  type: object
  description: Request body for cloning an export.
  properties:
    name:
      type: string
      description: Optional name for the cloned resource. If omitted, the server may generate a default clone name.
      examples: ["Clone - Get Accounts"]
    connectionMap:
      type: object
      description: |
        Mapping of original connection ids to replacement connection ids.
        Keys are source connection ids on the original resource; values are target connection ids.
        For an export that uses a connection, omitting the map or sending an empty one fails
        with 400 `invalid_connectionMap`; map the connection to itself to reuse it in the clone.
      additionalProperties:
        type: string
      example:
        5f7c579b6411271af4e7cefa: 64a1234567890abcdef12345
        5f7c579b6411271af4e7cefb: 64a1234567890abcdef12346
    _stackId:
      type: string
      format: objectId
      x-celigo-refModel: stacks
      description: |-
        Stack that every stack reference in the cloned resources (hooks and wrapper
        connections running on a stack) points at. Required when the clone preview reports
        `stackRequired: true`: without it the clone fails with 400 `stack_not_found`. The
        stack must belong to the target environment or be shared with it (404
        `stack_not_found` for an unknown id, 400 `invalid_stack` otherwise).
      examples: ["5f8d43a1b9e5a80011a35f2c"]
    sandbox:
      type: boolean
      deprecated: true
      description: Optional flag copied from the original resource when applicable.
  additionalProperties: true
