GroupBy:
  type: array
  description: |
    Specifies which fields to use for grouping records in the export results. When configured, records with
    the same values in these fields will be grouped together and treated as a single record by downstream
    steps in your flow.

    For example:
    - Group sales orders by customer ID to process all orders for each customer together
    - Group journal entries by accounting period to consolidate related transactions
    - Group inventory items by location to process inventory by warehouse

    When grouping is used, the export's page size determines the maximum number of groups per page, not individual
    records. Note that effective grouping typically requires that records with the same group field values appear
    together in the export data.

    Not a webhook listener feature: on a `webhook` export the platform applies it only within each page, after
    the request has been paged, and only to adjacent rows — the field is not offered for listeners in the UI.
  x-celigo-ai-guidance:
    - |-
      Never set this on a webhook listener to keep a request's rows together —
      the listener pages the request's records at ``pageSize`` FIRST and then
      merges only adjacent same-key rows inside each page, so rows that cross a
      page boundary still arrive as separate records and unsorted rows are not
      grouped at all. Keep a listener's request together by having the sender
      post an object (one record) or by raising the listener's ``pageSize``.
    - |-
      A grouped record's wire shape is a BARE ARRAY of the grouped rows
      (``[{row}, {row}]``) — there is no ``rows`` key on the record
      itself. ``rows`` is the NAME Handlebars and editor contexts bind
      array-records to (templates reference ``{{rows.0.<field>}}`` /
      iterate ``{{#each rows}}``); hook code sees the array as the
      record element and must not assume object shape.
    - |-
      A grouped record is ONE record: Mapper 2.0 and Transform 2.0 root
      JSONPath at the array (``$[0].<field>`` / ``$[*].<field>``;
      ``$.<field>`` resolves nothing), and a Transform 2.0 in ``mode:
      "create"`` reshapes it in place — header fields from ``$[0]``, a
      lines array from a ``buildArrayHelper`` over ``$[*]`` (``mode:
      "modify"`` has no object to overlay and passes the array through
      untouched). Changing how many records the page carries — each
      row becoming its own record for every downstream step — is the
      ``preSavePage`` hook's job alone.
  items:
    type: string
  examples: [["customerId", "orderId"], ["accountId", "locationId"], ["journalId"], ["department", "class"]]