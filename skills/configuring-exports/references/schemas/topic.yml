Topic:
  type: object
  description: |-
    Subscription settings for an Event Streams listener (`adaptorType: TopicExport`). The
    listener consumes messages published to the topic and hands them to the flow in batches;
    the platform delivers them internally, so the export carries no `_connectionId`. Present
    when `adaptorType` is `TopicExport`; the server fills `startPosition` and `maxWaitTimeMs`
    with their defaults when they are omitted.
  x-celigo-ai-guidance:
    - |-
      Send `type: "stream"` together with this object, as the listener form always does. The
      save also succeeds without `type`, and the listener then runs as a batch export: its flow
      never starts when a message is published, a manual run re-reads every retained message
      without committing a position, and `GET /v1/topics/{_id}/exports/{_exportId}/offsets`
      reports `hasCursor: false`. `PATCH` cannot add the type afterwards (`/type` is not a
      whitelisted property): `PUT` the full document with `type: "stream"`, then disable and
      enable the flow. Sending this object without `adaptorType` is enough for the server to
      infer `TopicExport`.
    - |-
      The subscription is created when the listener's flow goes from disabled to enabled (a
      `PATCH` or `PUT` that changes `disabled`); the first run after a publish follows within
      about a minute. A flow created with `disabled: false` in one request has not subscribed,
      and a save that leaves `disabled` unchanged (a rename) does not subscribe it — toggle the
      flow. Under `startPosition: latest`, messages published before the subscription exists
      are skipped. A disabled flow keeps its position and resumes from it when enabled again.
    - |-
      A topic listener cannot be a lookup: `isLookup: true` with `type: "stream"` fails the save
      with 422 `not_supported` ("Lookup functionality is not available for Stream Export"), and a
      lookup-shaped TopicExport saved without `type` never runs.
    - |-
      Never add a `_connectionId`: the server then validates the document as that connection's
      adaptor instead (an http connection fails with 422 missing_required_field "http subschema
      not defined"). A TopicExport carries no `cdc` object either — sending `cdc.snapshotMode`
      fails with 422 `not_allowed` ("CDC snapshotMode can only be used with stream export type").
  properties:
    _topicId:
      type: string
      format: objectId
      x-celigo-refModel: topics
      x-celigo-ui-override: >-
        Required by the Event Streams listener form (fieldDefinitions/resources/exports/export.js:
        'topic._topicId' is required:true, validWhen isNot ''). The API saves a TopicExport
        without it, so the requirement is encoded on the request schema to mirror the form and
        keep listeners bound to a topic.
      description: |-
        Topic this listener subscribes to. Create or look it up with `GET /v1/topics`; the
        topic must belong to the same account. Pointing an existing listener at a different
        topic starts a new subscription, read from `startPosition`. A clone made in the same
        environment — of this export, or of a flow that contains it — keeps `_topicId`, so the
        copy becomes another listener on the topic once its flow is enabled.
      x-celigo-ai-guidance:
        - |-
          An id that is not a topic in the account fails the save with 422 `invalid_ref`
          ("<id> is not a valid topic._topicId"); a malformed id fails with 422 `invalid_field`.
      examples: ["6ab1f48d38d7733b4599875c"]
    startPosition:
      type: string
      enum: [latest, earliest]
      default: latest
      x-enumDescriptions:
        latest: Deliver only messages published after the listener subscribes
        earliest: Replay every retained message on the topic before delivering new ones
      description: |-
        Where the listener starts reading when it first subscribes to `_topicId`. Use `earliest`
        to backfill retained history, `latest` (the default) to process only new messages. Read
        on create and whenever `_topicId` changes; on other updates the stored value is kept even
        if a different value is sent.
      examples: ["latest", "earliest"]
    maxWaitTimeMs:
      type: integer
      minimum: 1000
      default: 30000
      description: |-
        Longest time, in milliseconds, the listener waits to fill a batch before delivering
        whatever it has collected. Lower values reduce latency for sparse topics; the default
        of 30 seconds favors fuller batches. The batch record cap is the export's `pageSize`.
      x-celigo-ai-guidance:
        - |-
          Values below 1000 (including 0 and negatives) fail the save with 422 `min`
          ("Path `topic.maxWaitTimeMs` (0) is less than minimum allowed value (1000)"). The form
          edits this as whole seconds and saves seconds × 1000.
      examples: [30000, 5000]
