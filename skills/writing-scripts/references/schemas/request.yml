Request:
  type: object
  description: Fields for creating or updating a script.
  x-celigo-ai-guidance:
    - Fields that can be sent when creating or updating a script
  # content is deliberately NOT required: this Request shape serves PUT too, and a
  # PUT without content preserves the stored source — requiring it would force every
  # metadata-only update (rename, description) to resend the full script. Send
  # content explicitly when creating; an omitted-on-create script is empty.
  required:
    - name
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 100
      description: Display name for the script.
      examples: ["Order Transform Hook"]
      x-celigo-canon:
        decision: verified-exact
        reason: >-
          Server requires a non-empty name and rejects values longer than the declared
          maxLength. Bounds mirror live server enforcement.
        method: live-probe
        verified: '2026-07-05'
    description:
      type: string
      maxLength: 1024
      description: Free-text explanation of what the script does.
      examples: ["Adds discount line items to each order before import"]
      x-celigo-canon:
        decision: no-enum
        reason: >-
          Freeform user text — low sample cardinality is a population artifact; no enum or
          pattern to encode.
        method: full-population
        verified: '2026-07-03'
    content:
      type: string
      x-celigo-canon:
        decision: no-max-length
        reason: >-
          Left unconstrained — source content is not persisted in the warehouse, so no
          population evidence exists and the server cap is unknown.
        method: documented-contract
        verified: '2026-07-03'
      description: |-
        JavaScript source code. Optional on create — the server initializes
        omitted content to an empty string. Omitting it on update leaves the
        stored source unchanged (it is not cleared).
      x-celigo-ai-guidance:
        - JavaScript source code content of the script.
        - Optional. Omitted on create = empty script; omitted on update = existing content preserved.
      examples: ["function preSavePage(options) {\n  return { data: options.data, errors: options.errors };\n}"]
    sandbox:
      type: boolean
      deprecated: true
      description: When true, the script runs in an isolated sandbox environment. Deprecated — all scripts now run in sandboxed mode by default.
    postResponseHookToProcessOnChildRecord:
      type: boolean
      default: false
      description: When true, postResponseMap hooks run once per child record in a one-to-many mapping instead of once per parent.
      x-celigo-ai-guidance:
        - Whether to process hooks on child records.
    _templateId:
      type: string
      format: objectId
      x-celigo-refModel: templates
      description: Optional template identifier used to generate or structure script content.
