Router:
  type: object
  description: |
    Configuration for conditional routing within a tool.

    Routers evaluate input data and direct it to different processing branches
    based on criteria. This enables complex business logic and conditional
    processing within the tool.

    Unlike flows, tools only support "first_matching_branch" routing strategy.
    Branches can chain to other routers or use the special "outputRouter"
    terminal sink to exit the tool and return results.

    A router comes in two shapes, told apart by whether `routeRecordsTo` and
    `routeRecordsUsing` are set: a **branching router** sets both and has two or
    more branches, each taking the inputs its `inputFilter` (or the router's
    `script`) matches — the node you see in the Tool builder; a **pass-through
    router** sets neither and has exactly one branch that every input goes
    straight through — not drawn, it holds the steps before the first branching
    router and merges branches back into shared steps (branches rejoin only by
    pointing `nextRouterId` at the same router).
  x-celigo-ai-guidance:
    - |-
      Set `routeRecordsTo` and `routeRecordsUsing` together or omit both — a router with
      only one of them fails the save with 422 `invalid_flow_router_config`.
    - |-
      Every branch needs at least one entry in `pageProcessors` before the tool can run:
      `POST /v1/tools/{_id}/invoke` on a tool whose branches are empty returns 400
      `tool_empty_router`.
  properties:
    id:
      type: string
      description: |
        Unique identifier for this router within the tool.

        Used to reference this router from other routers' branch `nextRouterId`.
      examples: ["router_001", "validation_router"]
    name:
      type: string
      maxLength: 300
      description: |
        Human-readable name for the router.
      examples: ["Customer Type Router", "Validation Router"]
    routeRecordsTo:
      type: string
      enum: ["first_matching_branch"]
      x-enumDescriptions:
        first_matching_branch: Routes the input to the first branch whose criteria match.
      description: |
        Routing strategy. Tools only support "first_matching_branch",
        which routes to the first branch whose criteria match the input.
        Set together with `routeRecordsUsing` on a branching router; leave
        both unset on a one-branch pass-through router.
      examples: ["first_matching_branch"]
      x-celigo-ai-guidance:
        - Set this and `routeRecordsUsing` together on every router that decides between branches; setting only one of the two is rejected with 422 `invalid_flow_router_config`.
        - Leave both unset on a one-branch pass-through router (the steps before the first branching router, or a merge point). Setting them there still runs, but the builder shows a router node with one branch and no rules. A router with neither field and more than one branch is rejected with 422 `invalid_flow_router_branch`.
    routeRecordsUsing:
      type: string
      enum: ["input_filters", "script"]
      x-enumDescriptions:
        input_filters: Evaluate routing criteria using declarative filter expressions.
        script: Evaluate routing criteria using a custom JavaScript function.
      description: |
        How a branching router decides which branch an input matches. Set together
        with `routeRecordsTo`; leave both unset on a one-branch pass-through router.
      examples: ["input_filters"]
      x-celigo-ai-guidance:
        - Set this and `routeRecordsTo` together on every router that decides between branches, and leave both unset on a one-branch pass-through router; the rejections for a half-set pair or a multi-branch pass-through are listed on `routeRecordsTo`.
    script:
      type: object
      description: |
        Script configuration when routeRecordsUsing is "script".

        The function should return the name of the branch to route to.
      properties:
        _scriptId:
          type: string
          format: objectId
          x-celigo-refModel: scripts
          description: Reference to the script resource
          examples: ["60a2c4e6f321d800129a1a3c"]
        function:
          type: string
          description: Function name that returns the branch name
          examples: ["routeInput", "determineBranch"]
          x-celigo-canon:
            decision: no-enum
            reason: >-
              Uniform production usage is a builder default, not a contract — wrong names
              error loudly at runtime and users may rename freely.
            method: full-population
            verified: '2026-07-03'
    branches:
      type: array
      description: |
        List of branches defining different processing paths.

        Each branch has optional filter criteria and a set of processing steps.
        Records are evaluated against branch criteria in order; the first
        matching branch is selected.
      items:
        type: object
        properties:
          name:
            type: string
            maxLength: 300
            description: |
              Name of this branch.
            examples: ["Premium Customers", "Default Processing"]
          description:
            type: string
            maxLength: 10240
            description: |
              Description of when and why this branch is selected.
            examples: ["Selected when the customer is a premium account."]
          branchId:
            type: string
            description: |
              Stable identifier for this branch within the tool, generated by
              the builder. Used to reference the branch independently of its
              position in the branches array (e.g., from step requests).
            examples: ["VD0S9xQPLAH"]
            x-celigo-canon:
              decision: no-pattern
              reason: >-
                Token format is not contracted — observed lengths vary and the builder may
                change its generator; modeled as a plain string.
              method: full-population
              verified: '2026-07-03'
          inputFilter:
            type: object
            description: |
              Filter criteria to determine if this branch should be selected.

              Uses Celigo's expression-based filter format.
            properties:
              version:
                type: string
                enum: ["1"]
                x-enumDescriptions:
                  "1": Version 1 of the Celigo expression-based filter format.
                description: Filter version
              rules:
                type: array
                description: |
                  Filter rules in Celigo expression-based filter format.

                  Array-based DSL where the first element is an operator (e.g., "equals", "and", "or"),
                  followed by operands which can be nested expressions.
                items: {}
                examples:
                  - ["equals", ["get", "customerType"], "premium"]
                  - ["and", ["exists", ["get", "orderId"]], ["greaterThan", ["get", "amount"], 1000]]
          nextRouterId:
            type: string
            description: |
              Identifier of the next router to chain to after this branch completes.

              Use "outputRouter" as a special terminal value to exit the tool
              and return the processing results.
            examples: ["router_002", "outputRouter"]
            x-celigo-canon:
              decision: no-enum
              reason: >-
                Free-form user-assigned router ids of varying shapes and lengths — only the
                outputRouter terminal value is conventional; no enum or pattern.
              method: full-population
              verified: '2026-07-03'
          pageProcessors:
            type: array
            description: |
              Processing steps to execute in this branch.

              Each processor references an export (lookup) or import resource
              for data retrieval or submission.
            items:
              type: object
              properties:
                type:
                  type: string
                  enum: ["export", "import"]
                  x-enumDescriptions:
                    export: Retrieves data from an external system (lookup).
                    import: Sends data to an external system.
                  description: |
                    Type of processor.

                    - **export**: Retrieves data from an external system (lookup)
                    - **import**: Sends data to an external system
                _exportId:
                  type: string
                  format: objectId
                  x-celigo-refModel: exports
                  description: Export resource reference (when type is "export")
                  examples: ["60a2c4e6f321d800129a1a3c"]
                _importId:
                  type: string
                  format: objectId
                  x-celigo-refModel: imports
                  description: Import resource reference (when type is "import")
                  examples: ["60a2c4e6f321d800129a1a3c"]
                proceedOnFailure:
                  type: boolean
                  description: |
                    Whether to continue processing subsequent steps if this
                    processor fails.
                setupInProgress:
                  type: boolean
                  description: |
                    When true, the processor's configuration is still being
                    set up in the UI and the step is not yet runnable.
                responseMapping:
                  type: object
                  description: |
                    Merges fields from this processor's response back onto the
                    in-flight record so later processors and the tool's output
                    can read them. Extracts do NOT read the raw application
                    response — they evaluate against the platform's canonical
                    per-record envelope: for lookups (`type: "export"`) that is
                    `{"statusCode", "data": [<result records>], "errors"}`
                    where `data` holds the records AFTER the export's own
                    `transform` and output `filter`, so paths must start from
                    `data` and name transformed fields by their transformed
                    name (e.g. `data[0].name`) — a lookup result field
                    written without the `data` prefix resolves to nothing;
                    for imports it is `{"id", "statusCode", "ignored",
                    "_json", ...<body fields flattened>}`, so use `id`,
                    `_json.<path>`, or the body field itself at the root
                    (`orderNumber` and `_json.orderNumber` read the same
                    value). An extract may be a Handlebars expression over
                    the same envelope (`{{data.0.name}}`,
                    `{{#if data.length}}found{{/if}}`; dot indexes only; a
                    string result); there is no `record` object in this
                    context, so `{{record.…}}` renders nothing.
                  properties:
                    fields:
                      type: array
                      description: Simple field-level mappings
                      items:
                        type: object
                        properties:
                          extract:
                            type: string
                            x-celigo-agent:
                              - handlebars
                            description: |
                              Path within the canonical response envelope to
                              copy the value from (`data[0].x` / `data.0.x`
                              for lookups; `id`, `_json.<path>` or the
                              flattened body field `<path>` for imports), or
                              a Handlebars expression over that envelope (dot
                              indexes inside `{{ }}`, never a `record.` root).
                            examples: ["data[0].customer.name", "data.0.fields.Product Name", "id", "{{#if data.length}}found{{else}}missing{{/if}}"]
                          generate:
                            type: string
                            description: |
                              Field path on the in-flight record where the
                              extracted value is stored (dot notation for
                              nesting).
                            examples: ["orderId", "supplierDetails.supplierName"]
                    lists:
                      type: array
                      description: List-level mappings for array data
                      items:
                        type: object
                        properties:
                          generate:
                            type: string
                            description: Target list path
                            examples: ["lineItems"]
                          fields:
                            type: array
                            description: Field-level mappings applied to each item in the list.
                            items:
                              type: object
                              properties:
                                extract:
                                  type: string
                                  description: Source field path
                                  examples: ["sku"]
                                generate:
                                  type: string
                                  description: Target field path
                                  examples: ["itemCode"]
                hooks:
                  type: object
                  description: Custom scripts for processing
                  properties:
                    postResponseMap:
                      type: object
                      description: Script to run after response mapping
                      properties:
                        _scriptId:
                          type: string
                          format: objectId
                          x-celigo-refModel: scripts
                          description: Reference to the script resource
                          examples: ["60a2c4e6f321d800129a1a3c"]
                        function:
                          type: string
                          description: Function name to execute
                          examples: ["postProcessResponse"]
                          x-celigo-canon:
                            decision: no-enum
                            reason: User-defined script function names — no vocabulary to encode.
                            method: full-population
                            verified: '2026-07-03'
