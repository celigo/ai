Input:
  type: object
  description: |
    Configuration for the tool's input processing.

    Defines the expected input structure, optional transformations to apply
    before routing, and mock data for testing.
  properties:
    name:
      type: string
      maxLength: 200
      description: |
        Display name for the input configuration.
      examples: ["Customer Record", "Order Payload"]
    description:
      type: string
      maxLength: 10240
      description: |
        Description of the expected input data and its purpose.
      examples: ["Incoming customer record from the CRM system"]
    schema:
      type: object
      x-celigo-canon:
        decision: no-constraint
        reason: >-
          User-authored JSON Schema payload — interiors are freeform by design; do not
          model keys.
        method: documented-contract
        verified: '2026-07-03'
      description: |
        JSON Schema describing the expected input data structure.

        Used for validation, documentation, and AI-assisted tooling.
        Must be a valid JSON Schema document.
      additionalProperties: true
      examples:
        - type: object
          properties:
            customerId:
              type: string
            name:
              type: string
            email:
              type: string
              format: email
    schemaMode:
      type: string
      enum: [manual, json]
      x-enumDescriptions:
        manual: The UI opens `schema` in the visual field-by-field editor
        json: The UI opens `schema` in the raw JSON editor
      description: |-
        Which editor the UI opens `schema` in; invocation input validates the same either way.
        Unset opens the visual editor, and an edit there rebuilds `schema` from the field list,
        keeping only `type`, `properties`, `required`, `items`, `description`, `enum`, `pattern`,
        `minLength`/`maxLength`, `minimum`/`maximum`, `exclusiveMinimum`/`exclusiveMaximum`,
        `multipleOf`, `minItems`/`maxItems` and a `"null"` type — `format`, `const`, `default`,
        `additionalProperties`, `$ref` and `allOf`/`anyOf`/`oneOf`/`if` are dropped without a
        prompt, and `integer` becomes `number`.
      x-celigo-ai-guidance:
        - |-
          Set `json` on any schema written as raw JSON so the UI opens the JSON editor and warns
          before a switch to the visual editor can drop keywords; keep `manual` on a schema a
          user built in the visual editor and stay inside the keywords it keeps.
        - |-
          A full PUT that omits this field clears it — resend the stored value on every update.
          PATCH rejects the path ("/input/schemaMode is not a whitelisted property"), and a value
          outside the enum fails the save with 422 `enum` on `input.schemaMode`.
      examples: [json]
    transform:
      $ref: "../../../common/schemas/transform.yml#/Transform"
    traceKeyTemplate:
      type: string
      maxLength: 1024
      x-celigo-agent:
        - handlebars
      x-celigo-handlebars-context: record
      x-celigo-canon:
        decision: verified-exact
        reason: >-
          The length cap is the server's own — a template one character over it fails the
          save with size_limit_exceeded naming input.traceKeyTemplate, while one exactly at
          the cap saves.
        method: live-probe
        verified: '2026-09-21'
      description: |-
        Handlebars template evaluated against the invocation input (`record`) to produce
        the `traceKey` stored on each run-history entry, so an invocation can be found again
        with the `traceKeyPrefix` filter on `GET /v1/tools/{_id}/invocations`. Omit it and
        entries carry an empty `traceKey`.
      examples: ["order-{{record.orderId}}", "{{record.customerId}}-{{record.requestId}}"]
      x-celigo-ai-guidance:
        - |-
          The template must contain at least one `{{…}}` expression and must compile: a
          literal such as `order-static` fails the save with 422 on `input.traceKeyTemplate`
          ("requires at least one double stash expression"), and an unbalanced `{{record.id`
          fails with 422 "Failed to compile handlebars template". An empty string clears the
          field.
    debugUntil:
      type: string
      format: date-time
      deprecated: true
      description: |-
        Step debug-capture expiry for the input stage. Not yet accepted on this route:
        the value is dropped on PUT and `PATCH /input/debugUntil` is rejected as a
        non-whitelisted path.
      examples: ["2026-08-25T12:30:00.000Z"]
    mockInput:
      type: object
      x-celigo-canon:
        decision: no-constraint
        reason: User-payload sample data — interiors are freeform by design.
        method: documented-contract
        verified: '2026-07-03'
      description: |
        Mock data for testing the tool's input processing.

        Provides sample input to test transformation logic and routing
        without requiring live data. Maximum size: 1MB.
      additionalProperties: true
