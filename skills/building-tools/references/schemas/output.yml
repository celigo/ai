Output:
  type: object
  description: |
    Configuration for the tool's output processing.

    Defines how the tool's results are mapped, transformed, and enriched
    before being returned. Supports field mappings, lookups for data
    enrichment, and custom script hooks for pre/post-mapping processing.
  properties:
    name:
      type: string
      maxLength: 200
      description: |
        Display name for the output configuration.
      examples: ["Transformed Customer", "Order Response"]
    description:
      type: string
      maxLength: 10240
      description: |
        Description of the output data and its purpose.
      examples: ["Mapped and enriched customer record ready for the destination system"]
    schema:
      type: object
      description: |
        JSON Schema describing the output data structure.

        Used for documentation and validation of the tool's output.
        Must be a valid JSON Schema document.
      additionalProperties: true
      examples:
        - type: object
          properties:
            id:
              type: string
            fullName:
              type: string
            status:
              type: string
    schemaMode:
      type: string
      enum: [manual, json]
      x-enumDescriptions:
        manual: The UI opens `schema` in the visual field-by-field editor
        json: The UI opens `schema` in the raw JSON editor
      description: |-
        Which editor the UI opens `schema` in; the output validates the same either way. Unset
        opens the visual editor, and an edit there rebuilds `schema` from the field list, keeping
        only `type`, `properties`, `required`, `items`, `description`, `enum`, `pattern`,
        `minLength`/`maxLength`, `minimum`/`maximum`, `exclusiveMinimum`/`exclusiveMaximum`,
        `multipleOf`, `minItems`/`maxItems` and a `"null"` type — `format`, `const`, `default`,
        `additionalProperties`, `$ref` and `allOf`/`anyOf`/`oneOf`/`if` are dropped without a
        prompt, and `integer` becomes `number`.
      x-celigo-ai-guidance:
        - |-
          Set `json` on any schema written as raw JSON so the UI opens the JSON editor and warns
          before a switch to the visual editor can drop keywords; keep `manual` on a schema a
          user built in the visual editor and stay inside the keywords it keeps.
        - |-
          A full PUT that omits this field clears it — resend the stored value on every update.
          PATCH rejects the path ("/output/schemaMode is not a whitelisted property"), and a
          value outside the enum fails the save with 422 `enum` on `output.schemaMode`.
      examples: [manual]
    mappings:
      description: |
        Field mappings to transform data into the output format.

        Maps data from processing results to the output structure.
        Uses Celigo's standard mapping format with extract/generate field paths —
        a flat array of mapping entries (each entry may recurse via its own
        nested ``mappings`` for object/array structures).
      allOf:
        - $ref: "../common-schemas/mappings.yml#/Mappings"
    lookups:
      type: array
      description: |
        Lookup tables for data enrichment during output processing.

        Static key-value mappings used to translate values (e.g., status codes,
        category names) during output generation.
      items:
        type: object
        properties:
          name:
            type: string
            description: |
              Name of the lookup, used to reference it from mappings.
            examples: ["statusMapping", "regionLookup"]
          map:
            type: object
            description: |
              Key-value mapping object. Keys are the input values and
              values are the corresponding output values.
            additionalProperties: true
            examples:
              - A: Active
                I: Inactive
                P: Pending
          default:
            type: string
            description: |
              Default value returned when the input key is not found in the map.
            examples: ["Unknown"]
          allowFailures:
            type: boolean
            description: |
              Whether to continue processing if the lookup fails to find a match
              and no default is provided.
    hooks:
      type: object
      description: |
        Custom script hooks for pre- and post-mapping processing.

        Allows running custom JavaScript functions before and after
        output mappings are applied.
      properties:
        preMap:
          type: object
          description: |
            Script to run before applying output mappings.

            Can modify the data before it is mapped to the output structure.
          properties:
            _scriptId:
              type: string
              format: objectId
              x-celigo-refModel: scripts
              description: Reference to the script resource
              examples: ["60a2c4e6f321d800129a1a3c"]
            function:
              type: string
              description: Function name to execute within the script
              examples: ["preProcessOutput", "enrichData"]
        postMap:
          type: object
          description: |
            Script to run after applying output mappings.

            Can modify the final output data after mappings are applied.
          properties:
            _scriptId:
              type: string
              format: objectId
              x-celigo-refModel: scripts
              description: Reference to the script resource
              examples: ["60a2c4e6f321d800129a1a3c"]
            function:
              type: string
              description: Function name to execute within the script
              examples: ["postProcessOutput", "validateOutput"]
    debugUntil:
      type: string
      format: date-time
      description: |-
        Turns on debug capture for the Tool Output stage until this time: while it lies in
        the future, every post-mapped record is written to
        `GET /v1/tools/{_id}/tool_output/requests` with its output-schema outcome, in every
        execution context (standalone invoke, AI agent or MCP caller, flow or API). At
        most 3600 seconds ahead — a later value is rejected with `422` `update_not_allowed`
        and nothing is saved. Written by PUT or by `PATCH /v1/tools/{_id}` on
        `/output/debugUntil`; `remove` (or a past time) stops capture. Capture is not
        retroactive and does not change record retention.
      examples: ["2026-08-25T12:30:00.000Z"]
    mockInput:
      type: object
      description: |
        Mock data for testing the tool's output processing.

        Provides sample data that would arrive from the routing/processing
        stage, used to test mapping and lookup logic. Maximum size: 1MB.
      additionalProperties: true
