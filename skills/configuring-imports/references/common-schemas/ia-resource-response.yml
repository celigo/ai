IAResourceResponse:
  type: object
  description: Integration app response fields for resources that are part of integration apps
  properties:
    _integrationId:
      type: string
      format: objectId
      x-celigo-refModel: integrations
      readOnly: true
      description: |
        Reference to the specific integration instance that contains this resource.

        This field is only populated for resources that are part of an integration app
        installation. It contains the unique identifier (_id) of the integration
        resource that was installed in the account.

        The integration instance represents a specific installed instance of an
        integration app, with its own configuration, settings, and runtime environment.

        This reference enables:
        - Tracing the resource back to its parent integration instance
        - Permission and access control based on integration ownership
        - Lifecycle management (enabling/disabling, updating, or uninstalling)
      examples: ["5f9a7b2c3d4e5f6a7b8c9d0e"]
    _connectorId:
      type: string
      format: objectId
      x-celigo-refModel: connectors
      readOnly: true
      description: |-
        Integration App (connector) whose tile this resource lives in. Set on every resource
        inside the tile — the app's own flows, steps and the connections its install created,
        and also a connection a user added inside the tile. The app locks parts of
        these documents: a PUT that changes a locked field answers 200 but keeps the stored
        value, so read the document back to confirm a change, while a PATCH to a locked field
        (a connection's `name`) answers 422 `field_locked_by_integration_app`. A DELETE answers
        403 `delete_not_allowed` for every resource carrying this field except a connection
        with neither `externalId` nor `_sourceId` — one a user added inside the tile; the app's
        own resources go away with the uninstall of the store, account or app they belong to.
      examples: ["5e8d43a1b9e5a80011a35f1b"]
      x-celigo-ai-guidance:
        - |-
          Read-only connector (Integration App template) reference, stamped by the platform on
          every resource in the app's tile. Never set or modify it when authoring resources.
        - |-
          Never stage a DELETE of a resource carrying this field unless it is a connection with
          neither `externalId` nor `_sourceId` (one a user added inside the tile, which deletes
          normally): the platform refuses every other DELETE with 403 `delete_not_allowed` —
          "Cannot delete a resource that belongs to an Integration App." Hand over the Admin →
          Uninstall page of the store, account or app the resource belongs to instead.
        - |-
          Never stage a rename of a connection carrying this field — a user-added one included:
          `PATCH /name` answers 422 `field_locked_by_integration_app` — "Field: /name belongs to
          an Integration App and is locked."
