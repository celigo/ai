File:
  type: object
  description: |-
    **CRITICAL: This object is REQUIRED for all file-based import adaptor types.**

    **When to include this object**

    ✅ **MUST SET** when `adaptorType` is one of:
    - `S3Import`
    - `FTPImport`
    - `AS2Import`
    - `HTTPImport` in file mode (`http.type: "file"` — the folder mode of the cloud file
      providers such as Google Drive, Box, Dropbox, Azure Blob, Google Cloud Storage and Celigo
      Storage); the same `file` object, including `type: filedefinition` with `_ediProfileId`
      for EDI, applies as on S3 / FTP

    ❌ **DO NOT SET** for non-file-based imports like:
    - `SalesforceImport`
    - `NetSuiteImport`
    - `HTTPImport` in records mode (`http.type` unset — a REST endpoint receiving records)
    - `MongodbImport`
    - `RDBMSImport`

    **Minimum required fields**

    For most file imports, you need at minimum:
    - `fileName`: The output file name (supports Handlebars like `{{timestamp}}`)
    - `type`: The file format (json, csv, xml, xlsx)
    - `aggregation.type`: How the run's records are batched into files (`all` for one file per run)

    **Example (S3 Import)**

    ```json
    {
      "file": {
        "fileName": "customers-{{timestamp}}.json",
        "aggregation": { "type": "all" },
        "type": "json"
      },
      "s3": {
        "region": "us-east-1",
        "bucket": "my-bucket",
        "fileKey": "customers-{{timestamp}}.json"
      },
      "adaptorType": "S3Import"
    }
    ```
  properties:
    fileName:
      type: string
      description: |-
        **REQUIRED for file-based imports.**

        The name of the file to be created/written. Supports Handlebars expressions for dynamic naming.

        **Default behavior**
        - When the user does not specify a file naming convention, **always default to timestamped filenames** using `{{timestamp}}` (e.g., `"items-{{timestamp}}.csv"`). This ensures each run produces a unique file and avoids overwriting previous exports.
        - Only use a fixed filename (without timestamp) if the user explicitly requests overwriting or a fixed name.

        **Common patterns**
        - `"data-{{timestamp}}.json"` - Timestamped JSON file (DEFAULT — use this pattern when not specified)
        - `"export-{{date}}.csv"` - Date-stamped CSV file
        - `"{{recordType}}-backup.xml"` - Dynamic record type naming

        **Examples**
        - `"customers-{{timestamp}}.json"`
        - `"orders-export.csv"`
        - `"inventory-{{date}}.xlsx"`

        **Important**
        - For S3 imports, this should typically match the `s3.fileKey` value
        - For FTP imports, this should typically match the `ftp.fileName` value
      examples: ["customers-{{timestamp}}.json", "orders-export.csv"]
    skipAggregation:
      type: boolean
      description: |-
        Legacy companion of `aggregation.type`: `true` when the run's records are written one
        file per page, `false` when they are combined across the run or grouped by key.
        Validation reads the value sent — an EDI file definition needs `true` unless
        `aggregation.type` is `key`, and `batchSize` needs `true` — then the save rewrites it
        from `aggregation.type`, so send the two as a consistent pair.
      default: false
      x-celigo-canon:
        decision: verified-exact
        reason: >-
          Validation reads the sent value — an EDI file-definition import needs true unless
          aggregation.type is key, and batchSize needs true — then the save rewrites the flag from
          aggregation.type (page saves true, otherwise false); a payload carrying only this flag is
          translated the other way (true saves aggregation.type page, false saves all).
        method: live-probe
        verified: '2026-09-16'
      x-celigo-ai-guidance:
        - |-
          Send `skipAggregation` and `aggregation.type` as a consistent pair, exactly as the UI
          does: `page` with `true`; `all` or `key` with `false`. Validation reads the SENT flag —
          a `file.type: filedefinition` import saved with `page` and no `skipAggregation: true`
          fails with 422 `not_supported` ("Aggregation is not supported for EDI files, please set
          skipAggregation to true in Imports"), and `batchSize` fails with 422 `not_supported`
          ("File imports do not support batching with aggregation") unless the sent flag is
          `true`. The SAVED flag is then derived from `aggregation.type`, so this flag alone never
          says which mode is active — read `aggregation.type`. It does not mean one file per record.
    type:
      type: string
      enum:
        - json
        - csv
        - xml
        - xlsx
        - filedefinition
      x-enumDescriptions:
        json: JSON format, best for structured or nested data and API payloads; most common for API data
        csv: Comma-separated values format for flat tabular data.
        xml: XML format for XML-based integrations and SOAP services.
        xlsx: Microsoft Excel spreadsheet format.
        filedefinition: Custom file definition format for complex, proprietary, or EDI file structures.
      description: |-
        **REQUIRED for file-based imports.**

        The format of the output file.

        Select the format that matches the target system's requirements.
      x-celigo-ai-guidance:
        - |-
          ## SELECTION GUIDANCE:
          - Use `"json"` for structured/nested data, API payloads
          - Use `"csv"` for flat tabular data, spreadsheet-like records
          - Use `"xml"` for XML-based integrations, SOAP services
          - Use `"xlsx"` for Excel-compatible outputs
    encoding:
      type: string
      enum:
        - utf8
        - win1252
        - utf-16le
        - gb18030
        - macroman
        - iso88591
        - shiftjis
      x-enumDescriptions:
        utf8: UTF-8 Unicode encoding, the universal default for most systems.
        win1252: Windows-1252 Western European encoding for legacy Windows systems.
        "utf-16le": UTF-16 Little Endian encoding with byte order mark support.
        gb18030: Chinese National Standard encoding for Chinese character sets.
        macroman: Mac OS Roman encoding for legacy Macintosh systems.
        iso88591: ISO 8859-1 Latin-1 encoding for Western European languages.
        shiftjis: Shift JIS encoding for Japanese character sets.
      description: |-
        Character encoding for the output file.

        **Default:** `"utf8"`

        Change from the default only when the target system requires a specific encoding.
      default: utf8
    delete:
      type: boolean
      description: |-
        Whether to delete the source file after successful import.

        **Values**
        - `true`: Delete source file after processing
        - `false`: Keep source file

        **Default:** `false`
      default: false
    compressionFormat:
      type: string
      enum:
        - gzip
        - zip
      x-enumDescriptions:
        gzip: GZIP compression producing a single compressed .gz file.
        zip: ZIP compression producing a .zip archive that can contain multiple files.
      description: |-
        Compression format for the output file.

        **When to use**
        - Large files that benefit from compression
        - When target system expects compressed files
    backupPath:
      type: string
      description: |-
        Path where backup copies of files should be stored.

        **Examples**
        - `"backup/"` - Relative backup folder
        - `"/archive/2024/"` - Absolute backup path
      examples: ["backup/", "/archive/2024/"]
    purgeInternalBackup:
      type: boolean
      description: |-
        Whether to purge internal backup copies after successful processing.

        **Default:** `false`
      default: false
    batchSize:
      type: integer
      description: |-
        Number of records to include per batch/file when processing large datasets.

        **When to use**
        - Large imports that need to be split into multiple files
        - When target system has file size limitations

        **Note**
        - Offered when records are written one file per page (`aggregation.type: page` with
          `skipAggregation: true`)
      x-celigo-ai-guidance:
        - |-
          Probed for `all` and `page`: the save rejects `batchSize` with 422 `not_supported`
          ("File imports do not support batching with aggregation") when the sent
          `skipAggregation` is not `true`, and accepts it with `page` + `skipAggregation: true`.
          The `key` + `batchSize` combination has not been probed (it needs a B2B Manager
          account) — treat it as unverified, neither allowed nor forbidden.
    encrypt:
      type: boolean
      description: |-
        Whether to encrypt the output file.

        **Values**
        - `true`: Encrypt the file (requires PGP configuration)
        - `false`: No encryption

        **Default:** `false`
      default: false
    csv:
      type: object
      description: |-
        CSV-specific configuration. Only used when `type` is `"csv"`.
      properties:
        rowDelimiter:
          type: string
          description: Character(s) used to separate rows. Default is newline.
          default: "\n"
        columnDelimiter:
          type: string
          description: Character(s) used to separate columns. Default is comma.
          default: ","
          x-celigo-canon:
            decision: no-enum
            reason: >-
              Freeform by design — production carries arbitrary delimiter strings, including
              multi-character, unicode, and sentinel values.
            method: full-population
            verified: '2026-07-03'
        includeHeader:
          type: boolean
          description: When true, includes a header row with column names in the output.
          default: true
        wrapWithQuotes:
          type: boolean
          description: When true, wraps field values in quotes.
          x-celigo-ai-guidance:
            - Whether to wrap field values in quotes.
          default: false
        replaceTabWithSpace:
          type: boolean
          description: Replace tab characters with spaces.
          default: false
        replaceNewlineWithSpace:
          type: boolean
          description: Replace newline characters with spaces within fields.
          default: false
        truncateLastRowDelimiter:
          type: boolean
          description: Remove trailing row delimiter from the file.
          default: false
    json:
      type: object
      description: |-
        JSON-specific configuration. Only used when `type` is `"json"`.
      properties:
        resourcePath:
          type: string
          description: JSONPath expression to locate records within the JSON structure.
    xml:
      type: object
      description: |-
        XML-specific configuration. Only used when `type` is `"xml"`.
      properties:
        resourcePath:
          type: string
          description: XPath expression to locate records within the XML structure.
    fileDefinition:
      type: object
      description: |
        Configuration settings for parsing files using a predefined file definition. This object enables processing of complex, non-standard, or proprietary file formats that require specialized parsing logic beyond what the standard parsers (CSV, JSON, XML, etc.) can handle.

        **When to use**

        Configure this object when the `type` field is set to "filedefinition". This approach is required for properly handling:
        - Legacy or proprietary file formats with complex structures
        - Fixed-width text files where field positions are defined by character positions
        - Electronic Data Interchange (EDI) documents (X12, EDIFACT, etc.)
        - Multi-record type files where different lines have different formats
        - Files requiring complex preprocessing or custom parsing logic

        **File definition characteristics**

        - **Custom Parsing Rules**: Applies predefined parsing logic to complex file formats
        - **Reusable Configurations**: References externally defined parsing rules that can be reused
        - **Complex Format Support**: Handles formats that standard parsers cannot process
        - **Specialized Processing**: Often used for industry-specific or legacy formats

        **Implementation strategy for ai agents**

        1. **Format Analysis**:
            - Determine if the file format is standard (CSV, JSON, XML) or requires custom parsing
            - Check if the format follows industry standards like EDI, SWIFT, or fixed-width
            - Assess if there are multiple record types within the same file
            - Identify if specialized logic is needed to interpret the file structure

        2. **File Definition Selection**:
            - Verify that a suitable file definition has already been created in the system
            - Check if existing file definitions match the format requirements
            - Confirm the file definition ID from system administrators if needed
            - Ensure the file definition is compatible with the export's needs
      properties:
        _fileDefinitionId:
          type: string
          format: objectId
          x-celigo-refModel: filedefinitions
          description: Reference to the file definition resource.
          examples: ["66a1f2c3b4d5e6f7a8b9c0d1"]
    aggregation:
      type: object
      description: |-
        Controls how a flow run's records are batched into output files — the transfer form's
        "How many files would you like to generate?" setting. The legacy `skipAggregation` flag
        mirrors `type` and is maintained by the platform.
      properties:
        type:
          type: string
          enum: ["all", "page", "key"]
          x-enumDescriptions:
            all: One file per flow run — every record from the run (per export, or per request on real-time flows) in a single file
            page: One file per page of records
            key: One file per aggregation key — EDI file definitions only; records sharing the key derived from the file definition's document type are combined into one document
          description: |-
            Which batches of a run's records become separate output files. EDI file definitions
            (`file.type: filedefinition`) are written per page or per key, never per run; `key`
            is accepted only for them and only when the account has B2B Manager. The grouping
            key and the line-item loop it merges come from the EDI file definition's document
            type, so there is no separate key field to configure.
          examples: ["all", "page", "key"]
          x-celigo-canon:
            decision: verified-exact
            reason: >-
              The save validates the value against this enum and rejects key unless file.type is
              filedefinition and the account holds a B2B Manager license (not_supported); an EDI
              import is also rejected unless the sent skipAggregation is true or the type is key.
            method: live-probe
            verified: '2026-09-16'
          x-celigo-ai-guidance:
            - |-
              Validated on save: an unknown value fails with 422 `enum`; `key` fails with 422
              `not_supported` unless `file.type` is `filedefinition` ("Aggregation type key is
              only supported for file type filedefinition") and the account has B2B Manager
              ("Aggregation type key is only supported for B2B Manager").
            - |-
              For `file.type: filedefinition` send `page` (with `skipAggregation: true`) or `key`
              (with `false`); `all` is not an EDI option — the validator enforces this through the
              `skipAggregation` rule (see that field). For every other file type the choices are
              `all` and `page`. The UI offers exactly these splits.
            - |-
              A user asking where the "aggregation key" is configured is asking about this
              field: the key itself is derived from the file definition's document type, never
              entered.
    lookups:
      type: array
      description: |-
        Named value-substitution maps available to this import's field mappings; each lookup
        translates source values to target values, with an optional default for unmatched values.
        Referenced by name from mapping rules.
      items:
        type: object
        properties:
          name:
            type: string
            description: Identifier used to reference this lookup from mapping rules.
            examples: ["status_Lookup"]
          map:
            type: object
            description: Source-value to target-value pairs applied during mapping.
            additionalProperties:
              type: string
          default:
            type: [string, 'null']
            description: Value substituted when a source value is not found in map; empty string
              when omitted. May be stored as null (no default).
          allowFailures:
            type: boolean
            description: When true, a value missing from map does not fail the record and the default (or original value) is used.
            examples: [true, false]
    pgp:
      type: object
      description: |-
        PGP encryption settings applied when encrypt is true; selects the symmetric cipher and the
        signing hash. The connection must hold the recipient's public key.
      properties:
        symmetricKeyAlgorithm:
          type: string
          enum: ["twofish", "cast5", "3des", "aes128", "aes192", "aes256"]
          x-enumDescriptions:
            twofish: Twofish block cipher.
            cast5: CAST5 (CAST-128) block cipher.
            3des: Triple DES block cipher (legacy).
            aes128: AES with a 128-bit key.
            aes192: AES with a 192-bit key.
            aes256: AES with a 256-bit key (default, recommended).
          default: aes256
          description: Symmetric cipher used to encrypt the file body; aes256 unless the recipient requires another.
          examples: ["aes256", "3des"]
        hashAlgorithm:
          type: string
          enum: ["sha256", "sha384", "sha512", "sha224"]
          x-enumDescriptions:
            sha256: SHA-256 signing hash.
            sha384: SHA-384 signing hash.
            sha512: SHA-512 signing hash.
            sha224: SHA-224 signing hash.
          description: Hash algorithm used when signing the encrypted file; set only when the recipient requires a specific one.
          examples: ["sha256", "sha512"]
    skipRename:
      type: boolean
      description: |-
        When true, the import writes directly to the final file name instead of writing to a
        temporary name and renaming on completion. Use only when the destination does not support
        atomic rename; the default (false) uses the safe write-then-rename behavior.
      examples: [true, false]
    appendToExistingFile:
      type: boolean
      default: false
      x-celigo-ui-override: >-
        Defaulted by the Azure Data Lake Storage Gen2 import form
        (fieldDefinitions/resources/imports/azuredatalakestoragegen2.js: 'file.appendToExistingFile'
        defaultValue r?.file?.appendToExistingFile === true, shown only for file.type csv in
        records mode). When it is on, preSave clears file.compressionFormat, file.encrypt,
        file.pgp and the Content-Type header — append mode and compress/encrypt are exclusive
        on the form. The API stores the flag on any file import.
      description: |-
        When true, an Azure Data Lake Storage Gen2 import (`assistant: azuredatalakestoragegen2`)
        appends each run's CSV output to the file named by `file.fileName` instead of replacing
        it. Appended content cannot be compressed or encrypted, so leave `compressionFormat`,
        `encrypt` and `pgp` unset when this is on.
      examples: [true, false]
    contentType:
      type: string
      x-celigo-agent:
        - handlebars
      description: |-
        MIME type recorded on the file written to a cloud file provider such as Azure Data Lake
        Storage Gen2. Accepts a Handlebars expression so the type can follow the record (e.g.
        `{{record.mimeType}}`). Omit to let the destination assign its default.
      examples: ["text/csv", "application/json", "{{record.mimeType}}"]
    directory:
      type: object
      required:
        - pathMode
      x-celigo-canon:
        decision: stricter-than-server
        reason: >-
          The validator rejects an id-addressed directory saved without pathMode directoryId
          (missing_required_field) but saves a directory sent with only name or only storageRootId
          with pathMode defaulted to relativePath, so every stored directory carries the field;
          requiring it on write keeps authored documents identical to what the server returns.
        method: live-probe
        verified: '2026-09-21'
      description: |-
        Structured destination location for cloud file-provider imports (Google Drive shared
        drives, Box, Dropbox, Google Cloud Storage, Azure Data Lake Storage Gen2), replacing the
        flat path used by classic FTP/S3 destinations. Select the location by folder ID or by a
        path relative to a configured storage root via pathMode. For the drive-style providers,
        directoryId mode addresses the folder by id alone — the flat destination-path field is
        not consulted at runtime. Google Cloud Storage puts the bucket in `storageRootId`;
        Azure Data Lake Storage Gen2 puts the container in `name` and the directory prefix of the
        file path in `http.relativeURI`.
      x-celigo-ai-guidance:
        - >-
          Save-time validation accepts any string for id without checking it against the
          provider — set it only from a folder ID the user supplied or the UI folder browser
          stored; never fabricate one. To address a folder by path instead, set pathMode to
          relativePath and put the path in the adaptor's flat path field.
      properties:
        pathMode:
          type: string
          enum: ["relativePath", "directoryId"]
          x-enumDescriptions:
            relativePath: Address the location by a path relative to the storage root identified by storageRootId.
            directoryId: Address the location directly by the provider's folder ID set in id.
          description: How the directory is addressed — by provider folder ID, or by a path relative to a configured storage root.
          examples: ["relativePath", "directoryId"]
        id:
          type: string
          description: |-
            Provider-native folder ID of the destination directory (e.g. a Google Drive folder ID);
            set when pathMode is directoryId. This is the file provider's own ID, not a Celigo resource ID.
          examples: ["1KppvTTr4jKhJqwPAhGWN6SRwk5m45DL2"]
        name:
          type: string
          description: |-
            Display name of the folder identified by id, kept for readability in the UI; the
            folder browser fills it when the location is picked visually. For Azure Data Lake
            Storage Gen2 it is the authoritative container name instead — the form saves the
            container here and no id.
          examples: ["Invoices - Outbound", "invoices-outbound"]
        storageRootId:
          type: string
          description: |-
            Provider-native ID of the storage root the relative path resolves against; set when
            pathMode is relativePath. The provider's own ID, not a Celigo resource ID. For Google
            Cloud Storage it is the bucket name.
          examples: ["1qU1hvFarBFMb4-twqKm1rR5o_6j9vs9g", "erp-exports"]
        storageRootName:
          type: string
          description: Display name of the storage root identified by storageRootId, retained for reference in the UI.
          examples: ["Shared drive - Finance"]
    backupDirectory:
      type: object
      required:
        - pathMode
      description: |-
        Structured location for backup copies on cloud file providers — the file-provider
        counterpart to backupPath. Addressed the same way as directory.
      properties:
        pathMode:
          type: string
          enum: ["relativePath", "directoryId"]
          x-enumDescriptions:
            relativePath: Address the backup location by a path relative to the storage root identified by storageRootId.
            directoryId: Address the backup location directly by the provider's folder ID set in id.
          description: How the backup location is addressed — by provider folder ID, or by a path relative to a configured storage root.
          examples: ["relativePath", "directoryId"]
        id:
          type: string
          description: Provider-native folder ID of the backup directory; set when pathMode is directoryId.
          examples: ["1KppvTTr4jKhJqwPAhGWN6SRwk5m45DL2"]
        name:
          type: string
          description: |-
            Display name of the backup folder identified by id, kept for readability in the UI;
            the folder browser fills it when the location is picked visually.
          examples: ["Processed archive"]
        storageRootId:
          type: string
          description: Provider-native ID of the storage root the backup relative path resolves against; set when pathMode is relativePath.
          examples: ["1qU1hvFarBFMb4-twqKm1rR5o_6j9vs9g"]

