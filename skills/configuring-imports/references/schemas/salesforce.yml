Salesforce:
  type: object
  x-celigo-canon:
    decision: looser-than-observed
    reason: >-
      Inner requireds are stub-gated — the server writes bookkeeping salesforce stubs (empty
      object or bare lookups) onto imports of other adaptorTypes, and blob configs
      (attachment/contentVersion) legitimately carry no api, idLookup, or upsert.
    method: full-population
    verified: '2026-07-03'
  description: |-
    Salesforce-specific configuration for the import: the operation to perform, the API to use, and object-level settings such as `sObjectType`, `idLookup`, and `upsert`. Properties like `ignoreExisting`, `ignoreMissing`, `name`, and `description` are not part of this object — they belong at the import level.
  x-celigo-ai-guidance:
    - |-
      Configuration for Salesforce imports containing operation type, API selection,
      and object-specific settings.
    - |-
      When asked to generate this configuration, return an object with these properties:
      - `operation` (REQUIRED): The Salesforce operation type (insert, update, upsert, etc.)
      - `api` (REQUIRED): The Salesforce API to use (default: "soap")
      - `sObjectType`: The Salesforce object type (e.g., "Account", "Contact", "Vendor__c")
      - `idLookup`: Configuration for looking up existing records
      - `upsert`: Configuration for upsert operations (when operation is "upsert")
      - And other operation-specific properties as needed
  # Requireds are conditional (see the if/then chain at the end of this schema):
  # blob configs (attachment / contentVersion) carry operation but no api and skip the
  # operation→idLookup/upsert rules; server bookkeeping also writes stub `salesforce`
  # objects ({lookups:[]} / {}) onto imports of every adaptorType.
  properties:
    lookups:
      description: |
        Lookup definitions used to resolve Salesforce record references or
        static value mappings. Each lookup has a unique ``name`` that mapping
        fields reference via ``lookupName`` and that Handlebars expressions
        reference via ``{{lookup "name" value}}``.

        **Mirror invariant**
        The Celigo platform stores lookups in TWO locations on a Salesforce
        import resource: top-level ``lookups`` and ``salesforce.lookups``.
        Both arrays must hold byte-for-byte identical content — the
        MappingsAgent writes both on every save.

        **Static vs dynamic lookups**
        - **Static** — only ``map`` + optional ``default``. No Salesforce
          query runs. Use for small controlled vocabularies (country codes,
          status labels, etc.).
        - **Dynamic** — ``sObjectType`` + ``resultField`` + ``whereClause``.
          Issues a SOQL query at runtime. Use ``map`` alongside the query to
          short-circuit known values before hitting Salesforce.
      items:
        type: object
        properties:
          name:
            type: string
            description: |
              Unique identifier for this lookup entry. Mapping fields reference
              it via ``lookupName``, and Handlebars expressions reference it
              via ``{{lookup "name" value}}``. Must be unique within this
              resource's ``lookups`` array. Conventionally a short slug or a
              generated hash — the value is only meaningful as a reference
              token.
          sObjectType:
            type: string
            description: |
              Salesforce sObject API name to query (e.g. ``Account``,
              ``Contact``, ``Solution__c``). For custom objects include the
              ``__c`` suffix. Case-sensitive — must match exactly as declared
              in the target Salesforce org.
          resultField:
            type: string
            description: |
              sObject field whose value is returned when the SOQL ``whereClause``
              matches a record. Typically ``Id`` when the lookup resolves to a
              Salesforce record reference, but any queryable field is valid.
          whereClause:
            type: string
            x-celigo-agent:
              - handlebars
            description: |
              SOQL ``WHERE`` clause that identifies the matching Salesforce
              record. Use Handlebars expressions (triple braces recommended:
              ``{{{field}}}``) to inject values from the incoming source record.
              Wrap the whole expression in parentheses.

              Examples:
              - ``(Id = {{{id [Customer SFDC ID]}}})``
              - ``(Email = '{{{email}}}')``
              - ``(External_Id__c = {{{string externalId}}} AND IsActive = true)``

              Celigo's Handlebars helpers (``string``, ``id``, ``double``,
              ``bool``, ``date``) produce correctly-typed SOQL literals —
              prefer them over manual quoting. String values wrap in single
              quotes; numeric/id values do not.
          map:
            type: [object, 'null']
            description: |
              Optional static key→value map evaluated BEFORE the SOQL query.
              When the incoming field value matches a key, the mapped value
              is returned without hitting Salesforce. Useful for small
              controlled enumerations where a full query would be overkill.
          default:
            type: [string, 'null']
            description: |
              Value returned when the SOQL query matches no records. When
              omitted and ``allowFailures`` is false, an unmatched lookup
              fails the record.
          allowFailures:
            type: boolean
            description: |
              When true, a lookup miss (no matching record and no ``default``)
              is tolerated — the mapped field resolves to ``null`` and the
              import continues. When false (default), a miss halts processing
              for the record.
          useDefaultOnMultipleMatches:
            type: boolean
            description: |
              Controls behaviour when the SOQL query matches more than one
              record. When true, the ``default`` value is returned instead of
              raising an ambiguous-match error. When false (default), multiple
              matches are treated as a failure.
      type: array
      x-celigo-agent:
        - lookup
    operation:
      type: string
      enum:
        - insert
        - update
        - upsert
        - upsertpicklistvalues
        - delete
        - addupdate
      x-lowercase: true
      x-enumDescriptions:
        insert: Create new records in Salesforce.
        update: Modify existing records in Salesforce, identified by record ID.
        upsert: Create or update records based on an External ID field match.
        upsertpicklistvalues: Create or update picklist values on a Salesforce field.
        delete: Remove records from Salesforce, moving them to the recycle bin.
        addupdate: Create new or update existing records using Celigo-specific matching logic.
      x-celigo-ui-override: >-
        Required by the Salesforce import form (operation is required:true). Encoded to mirror the
        form so builders produce connectable configurations.
      description: |-
        Controls how records are written to Salesforce. Each value pairs with a lookup strategy: `upsert` requires `upsert.externalIdField` plus `idLookup.extract`, while `update`, `delete`, `addupdate`, and `insert` with `ignoreExisting` require `idLookup.whereClause`. Values are converted to lowercase automatically.
      x-celigo-ai-guidance:
        - |-
          Specifies the type of Salesforce operation to perform on records.
          This determines how data is created, modified, or removed in Salesforce.
        - |-
          ## FIELD BEHAVIOR:
          - Defines the specific Salesforce action to execute (insert, update, upsert, etc.)
          - Dictates required fields and validation rules for the operation
          - Determines API endpoint and request structure
          - Automatically converted to lowercase before processing
          - Influences response format and error handling
        - |-
          ## OPERATION TYPES:

          ### **insert**
          - **Purpose:** Create new records in Salesforce
          - **Behavior:** Creates new records
          - **Use when:** Creating brand new records
          - **With ignoreExisting: true:** Checks for existing records and skips them (requires idLookup.whereClause)
          - **Without ignoreExisting:** Creates all records without checking for duplicates
          - **Example:** "Insert new leads from marketing campaign"
          - **Example with ignoreExisting:** "Create vendors while ignoring existing vendors" → operation: "insert" + ignoreExisting: true

          ### **update**
          - **Purpose:** Modify existing records in Salesforce
          - **Behavior:** Requires record ID; fails if record doesn't exist
          - **Use when:** Updating known existing records
          - **Example:** "Update customer status based on order completion"

          ### **upsert**
          - **Purpose:** Create or update records based on external ID
          - **Behavior:** Updates if external ID matches, creates if not found
          - **Use when:** Syncing data from external systems with external ID field
          - **Example:** "Upsert customers by External_ID__c field"
          - **REQUIRES:**
            - `idLookup.extract` field (maps incoming field to External ID)
            - `upsert.externalIdField` field (specifies Salesforce External ID field)
            - Both fields MUST be set for upsert to work

          ### **upsertpicklistvalues**
          - **Purpose:** Create or update picklist values dynamically
          - **Behavior:** Manages picklist value creation/updates
          - **Use when:** Maintaining picklist values from external data
          - **Example:** "Sync product categories to Salesforce picklist"

          ### **delete**
          - **Purpose:** Remove records from Salesforce
          - **Behavior:** Requires record ID; records moved to recycle bin
          - **Use when:** Removing obsolete or invalid records
          - **Example:** "Delete expired opportunities"

          ### **addupdate**
          - **Purpose:** Create new or update existing records (Celigo-specific)
          - **Behavior:** Similar to upsert but uses different matching logic
          - **Use when:** Upserting without requiring external ID field
          - **Example:** "Sync contacts, create new or update existing by email"
        - |-
          ## IMPLEMENTATION GUIDANCE:
          - Choose operation based on whether records are new, existing, or unknown
          - For **insert**: Ensure records are truly new to avoid errors
          - For **insert with ignoreExisting: true**: MUST set `idLookup.whereClause` to check for existing records
          - For **update/delete**: MUST set `idLookup.whereClause` to identify records
          - For **upsert**: MUST also include the `upsert` object with `externalIdField` property
          - For **upsert**: MUST also set `idLookup.extract` to map incoming field
          - For **addupdate**: MUST set `idLookup.whereClause` to define matching criteria
          - Use **upsertpicklistvalues** only for picklist management scenarios
        - |-
          ## COMMON PATTERNS:
          - **"Create X while ignoring existing X"** → operation: "insert" + api: "soap" + idLookup.whereClause
          - **"Create or update X"** → operation: "upsert" + api: "soap" + upsert.externalIdField + idLookup.extract
          - **"Update X"** → operation: "update" + api: "soap" + idLookup.whereClause
          - **"Sync X"** → operation: "addupdate" + api: "soap" + idLookup.whereClause
          - **ALWAYS include** api field (default to "soap" if not specified in prompt)
        - |-
          ## EXAMPLES:

          ### Insert new records:
          ```json
          {
            "operation": "insert",
            "api": "soap",
            "sObjectType": "Lead"
          }
          ```
          Prompt: "Create new leads in Salesforce"

          ### Insert with ignore existing:
          ```json
          {
            "operation": "insert",
            "api": "soap",
            "sObjectType": "Vendor__c",
            "idLookup": {
              "whereClause": "Name = '{{{VendorName}}}'"
            }
          }
          ```
          Prompt: "Create vendor records while ignoring existing vendors"

          **NOTE:** For "ignore existing" prompts, also remember that `ignoreExisting: true` belongs at a different level (not part of this salesforce configuration).

          ### Update existing records:
          ```json
          {
            "operation": "update",
            "api": "soap",
            "sObjectType": "Account",
            "idLookup": {
              "whereClause": "Id = '{{{AccountId}}}'"
            }
          }
          ```
          Prompt: "Update existing accounts in Salesforce"

          ### Upsert by external ID:
          ```json
          {
            "operation": "upsert",
            "api": "soap",
            "sObjectType": "Contact",
            "idLookup": {
              "extract": "ExternalId"
            },
            "upsert": {
              "externalIdField": "External_ID__c"
            }
          }
          ```
          Prompt: "Create or update contacts by External_ID__c"

          ### Addupdate (create or update):
          ```json
          {
            "operation": "addupdate",
            "api": "soap",
            "sObjectType": "Customer__c",
            "idLookup": {
              "whereClause": "Name = '{{{CustomerName}}}'"
            }
          }
          ```
          Prompt: "Sync customers, create new or update existing"
        - |-
          ## IMPORTANT NOTES:
          - Operation value is case-insensitive (automatically converted to lowercase)
          - Invalid operation values will cause API validation errors
          - Each operation has different requirements for record identification
          - **CRITICAL for upsert**: MUST include the `upsert` object with `externalIdField` property
          - **CRITICAL for upsert**: MUST set `idLookup.extract` to map incoming field to External ID
          - **upsert** requires external ID field to be configured in Salesforce
          - **addupdate** is Celigo-specific and may not work with all Salesforce APIs
          - Operations must align with user's Salesforce permissions
          - Some operations support bulk processing more efficiently than others
    api:
      type: string
      enum:
        - soap
        - rest
        - metadata
        - compositerecord
      x-lowercase: true
      x-enumDescriptions:
        soap: Salesforce SOAP API for transactional or legacy imports; supports AllOrNone transaction control and XML-based requests, with more overhead than REST
        rest: Standard Salesforce REST API for real-time single-record and small-batch imports; supports CRUD, flexible querying, rich error messages, and up to 2,000 records per API call
        metadata: Salesforce Metadata API for deploying configuration and setup data between orgs, such as custom objects, fields, and workflows; not for data records
        compositerecord: Salesforce Composite Graph API for creating hierarchical related record trees, such as parent-child relationships, atomically in one request
      x-celigo-ui-override: >-
        Required by the Salesforce import form (api is required:true, default soap). Encoded to
        mirror the form so builders produce connectable configurations.
      x-celigo-canon:
        decision: not-required
        reason: >-
          Presence in stored docs is not user config — the server defaults api into
          bookkeeping stubs, so api belongs to the stub key-set and is only conditionally
          required on real record configs.
        method: full-population
        verified: '2026-07-03'
      description: |-
        Selects the Salesforce API used to execute the import. Use `soap` for most imports and another API only when its specific capability is needed; default to `soap` when no API is specified. Values are converted to lowercase automatically.
      x-celigo-ai-guidance:
        - |-
          ## FIELD BEHAVIOR:
          - Required by the import form for record imports; legacy attachment
            imports are stored without it and the platform falls back to soap
          - Determines the protocol and endpoint used for Salesforce communication
          - Influences request format, batch sizes, and response handling
          - Automatically converted to lowercase before processing
          - Affects available features and operation types
          - Impacts performance and error handling behavior
        - |-
          ## IMPLEMENTATION GUIDANCE:
          - **MUST ALWAYS SET THIS FIELD** - Never leave it undefined
          - If prompt doesn't specify API type, use **"soap"**
          - Use **"soap"** only when AllOrNone transaction control is explicitly required
          - Use **"metadata"** only for configuration deployment, never for data
          - Use **"compositerecord"** for complex parent-child relationship imports
          - Consider API limits and performance characteristics for your data volume
          - Ensure the Salesforce connection supports the chosen API type
        - |-
          ## EXAMPLES:

          ### REST API:
          ```json
          {
            "operation": "insert",
            "api": "rest",
            "sObjectType": "Lead"
          }
          ```
          Prompt: "Import leads into Salesforce"

          ### SOAP API with transaction control:
          ```json
          {
            "operation": "insert",
            "api": "soap",
            "sObjectType": "Invoice__c",
            "soap": {
              "headers": {
                "allOrNone": true
              }
            }
          }
          ```
          Prompt: "Import invoices with all-or-none guarantee"

          ### Composite Record API:
          ```json
          {
            "operation": "insert",
            "api": "compositerecord",
            "sObjectType": "Account"
          }
          ```
          Prompt: "Import accounts with related contacts and opportunities"
        - |-
          ## IMPORTANT NOTES:
          - API value is case-insensitive (automatically converted to lowercase)
          - SOAP API has slightly more overhead but provides transaction guarantees
          - Metadata API is for configuration only, not data records
          - Composite Record API requires careful relationship mapping
          - Each API has different rate limits and performance characteristics
          - Ensure your Salesforce connection and permissions support the chosen API
        - |-
          **REQUIRED FIELD:** Specifies which Salesforce API to use for the import operation.
          Different APIs have different capabilities, performance characteristics,
          and use cases.
        - |-
          **CRITICAL:** This field MUST ALWAYS be set.
          If no specific API is mentioned in the prompt, **DEFAULT to "soap"**.
        - |-
          ## DEFAULT CHOICE:
          When in doubt or when no API is mentioned in the prompt → **USE "soap"**
    soap:
      type: object
      properties:
        headers:
          type: object
          properties:
            allOrNone:
              type: boolean
              description: |-
                When true, the batch is processed atomically: if any record fails, the entire transaction is rolled back and nothing is committed. When false or omitted, records that succeed are committed even if others in the batch fail.
              x-celigo-ai-guidance:
                - |-
                  ## FIELD BEHAVIOR:
                  - When true, enforces atomicity: all records in the batch must succeed or the entire operation is rolled back with no changes applied.
                  - When false, permits partial success: successfully processed records are committed even if some records fail.
                  - Applies mainly to batch DML operations including create, update, delete, and upsert.
                  - Helps maintain data consistency by preventing partial updates when strict transactional integrity is required.
                  - Influences how errors are reported and handled in the API response.
                  - Affects transaction commit behavior and rollback mechanisms within the Salesforce platform.
                - |-
                  ## IMPLEMENTATION GUIDANCE:
                  - Set to true to guarantee strict data consistency and avoid partial data changes that could lead to inconsistent states.
                  - Set to false to allow higher throughput and partial processing when some failures are acceptable or expected.
                  - Default value is false if the property is omitted, allowing partial success by default.
                  - When false, implement robust error handling to process partial success responses and handle individual record errors appropriately.
                  - Verify that the target Salesforce API operation supports the allOrNone header before use.
                  - Consider the impact on transaction duration and system resources when enabling atomic operations.
                  - Use in scenarios where data integrity is paramount, such as financial or compliance-related data updates.
                - |-
                  ## EXAMPLES:
                  - allOrNone = true: Attempting to update 10 records where one record fails validation results in no records being updated, preserving atomicity.
                  - allOrNone = false: Attempting to update 10 records where one record fails validation results in 9 records updated successfully and one failure reported.
                  - allOrNone = true: Deleting multiple records in a batch will either delete all specified records or none if any deletion fails.
                - |-
                  allOrNone specifies whether the Salesforce API operation should be executed atomically,
                  ensuring that either all parts of the operation succeed or none do.
                  When set to true, if any record in a batch operation fails,
                  the entire transaction is rolled back and no changes are committed,
                  preserving data integrity across the dataset.
                  When set to false, the operation allows partial success,
                  meaning some records may be processed and committed even if others fail,
                  which can improve performance but requires careful error handling to manage partial failures.
                  This property is primarily applicable to data manipulation operations such as create,
                  update, delete, and upsert,
                  and is critical for maintaining consistent and reliable data states in
                  multi-record transactions.
          description: SOAP headers included in requests sent to Salesforce, such as the `allOrNone` transaction-control header.
        batchSize:
          type: number
          description: |-
            Number of records sent to Salesforce in each SOAP API batch. Larger batches reduce the number of API calls; smaller batches reduce per-call load and the chance of timeouts.
          x-celigo-ai-guidance:
            - |-
              ## FIELD BEHAVIOR:
              - Determines the count of records included in each batch request to the Salesforce SOAP API.
              - Directly influences the total number of API calls required when handling large datasets.
              - Affects processing throughput, latency, and memory usage during data operations.
              - Can be dynamically adjusted to optimize performance based on system capabilities and network conditions.
              - Impacts error handling and retry mechanisms by controlling batch granularity.
              - Influences network load and the likelihood of encountering API limits or timeouts.
            - |-
              ## IMPLEMENTATION GUIDANCE:
              - Choose a batch size that adheres to Salesforce API limits and recommended best practices.
              - Balance between larger batch sizes (which reduce API calls but increase memory and processing load) and smaller batch sizes (which increase API calls but reduce resource consumption).
              - Ensure the batchSize value is a positive integer within the allowed range for the specific Salesforce operation.
              - Continuously monitor API response times, error rates, and resource utilization to fine-tune the batch size for optimal performance.
              - Default to Salesforce-recommended batch sizes when uncertain or when starting configuration.
              - Consider network stability and latency when selecting batch size to minimize timeouts and failures.
              - Validate batch size compatibility with other integration components and middleware.
              - Test batch size settings in a staging environment before deploying to production to avoid unexpected failures.
            - |-
              ## EXAMPLES:
              - `batchSize: 200` — Processes 200 records per batch, a common default for many Salesforce operations.
              - `batchSize: 500` — Processes 500 records per batch, often the maximum allowed for certain Salesforce SOAP API calls.
              - `batchSize: 50` — Processes smaller batches suitable for environments with limited memory or network bandwidth.
              - `batchSize: 100` — A moderate batch size balancing throughput and resource usage in typical scenarios.
            - |-
              The number of records to be processed in each batch during Salesforce SOAP API operations.
              This property controls the size of data chunks sent or retrieved in a single API call,
              optimizing performance and resource utilization by balancing throughput and
              system resource consumption.
              Adjusting the batch size directly impacts the number of API calls made,
              the processing speed, memory usage, and network load,
              enabling fine-tuning of data operations to suit specific environment constraints
              and performance goals.
              Proper configuration of batchSize helps prevent API throttling,
              reduces the risk of timeouts,
              and ensures efficient handling of large datasets by segmenting data into manageable portions.
      description: Settings that apply when `api` is `soap`, including SOAP request headers and batch size.
      x-celigo-ai-guidance:
        - |-
          ## FIELD BEHAVIOR:
          - Defines all connection, authentication, and operational parameters necessary for Salesforce SOAP API interactions.
          - Facilitates the construction and transmission of properly structured SOAP requests and the parsing of SOAP responses.
          - Manages the session lifecycle, including token acquisition, refresh, and timeout handling to maintain persistent connectivity.
          - Supports comprehensive error detection and handling of SOAP faults, API exceptions, and network issues to maintain integration stability.
          - Enables customization of SOAP headers, namespaces, and envelope structures as required by specific Salesforce API calls.
          - Allows configuration of retry policies and backoff strategies in response to transient errors or rate limiting.
          - Supports environment-specific configurations, such as production, sandbox, or custom Salesforce domains.
        - |-
          ## IMPLEMENTATION GUIDANCE:
          - Configure endpoint URLs and authentication credentials accurately based on the Salesforce environment (production, sandbox, or custom domains).
          - Validate SOAP envelope structure, namespaces, and compliance with the latest Salesforce WSDL specifications to prevent communication errors.
          - Implement robust error handling to capture, log, and respond appropriately to SOAP faults, API limit exceptions, and network failures.
          - Securely store and transmit sensitive information such as session IDs, OAuth tokens, passwords, and certificates, following best security practices.
          - Monitor Salesforce API usage limits and implement throttling or queuing mechanisms to avoid exceeding quotas and service disruptions.
          - Set timeout values thoughtfully to balance between preventing hanging requests and allowing sufficient time for valid operations to complete.
          - Regularly update the SOAP configuration to align with Salesforce API version changes, WSDL updates, and evolving security requirements.
          - Incorporate logging and monitoring to track SOAP request and response cycles for troubleshooting and performance optimization.
          - Ensure compatibility with Salesforce security protocols, including TLS versions and encryption standards.
        - |-
          Specifies the comprehensive configuration settings required for integrating with
          the Salesforce SOAP API.
          This property includes all essential parameters to establish, authenticate,
          and manage SOAP-based communication with Salesforce services,
          enabling a wide range of operations such as creating, updating, deleting,
          querying, and executing actions on Salesforce objects.
          It encompasses detailed configurations for endpoint URLs,
          authentication credentials (such as session IDs or OAuth tokens), SOAP headers,
          session management details, timeout settings,
          and error handling mechanisms to ensure reliable, secure,
          and efficient interactions.
          The configuration must strictly adhere to Salesforce's WSDL definitions and security standards,
          supporting robust SOAP API usage within the application environment.
    sObjectType:
      type: string
      description: |-
        Salesforce object the import writes to, such as `Account`, `Contact`, or a custom object like `Vendor__c`. Must exactly match the object's case-sensitive API name; custom objects include the `__c` suffix.
      x-celigo-ai-guidance:
        - |-
          sObjectType specifies the exact Salesforce object type that the API operation will target,
          such as standard objects like Account, Contact, Opportunity,
          or custom objects like CustomObject__c.
          This property is essential for defining the schema context of the API request,
          determining which fields are relevant,
          and directing the operation to the correct Salesforce data entity.
          It plays a critical role in data validation, processing logic,
          and endpoint routing within the Salesforce environment,
          ensuring that operations such as create, update, delete,
          or query are executed against the intended object type with precision.
          Accurate specification of sObjectType enables dynamic adjustment of request
          payloads and response handling based on the object’s schema and enforces
          compliance with Salesforce’s API naming conventions and permissions model.
        - |-
          ## FIELD BEHAVIOR:
          - Identifies the specific Salesforce object (sObject) type targeted by the API operation.
          - Determines the applicable schema, field availability, and validation rules based on the selected object.
          - Must exactly match a valid Salesforce object API name recognized by the connected Salesforce instance, including case sensitivity.
          - Routes the API request to the appropriate Salesforce object endpoint for the intended operation.
          - Influences dynamic field mapping, data transformation, and response parsing processes.
          - Supports both standard and custom Salesforce objects, with custom objects requiring the “__c” suffix.
        - |-
          ## IMPLEMENTATION GUIDANCE:
          - Validate sObjectType values against the current Salesforce object metadata in the target environment to prevent invalid requests.
          - Enforce exact case-sensitive matching with Salesforce API object names (e.g., "Account" not "account").
          - Support and recognize both standard objects and custom objects, ensuring custom objects include the “__c” suffix.
          - Implement robust error handling for invalid, unsupported, or deprecated sObjectType values to provide clear feedback.
          - Regularly update the list of allowed sObjectType values to reflect changes in the Salesforce schema or environment.
          - Use sObjectType to dynamically tailor API request payloads, field selections, and response parsing logic.
          - Consider object-level permissions and authentication scopes when processing requests involving specific sObjectTypes.
        - |-
          ## EXAMPLES:
          - "Account"
          - "Contact"
          - "Opportunity"
          - "Lead"
          - "CustomObject__c"
          - "Case"
          - "Campaign"
        - |-
          ## IMPORTANT NOTES:
          - Custom Salesforce objects must be referenced using their exact API names, including the “__c” suffix.
      examples: ["Account", "Contact", "Vendor__c"]
    idLookup:
      type: object
      properties:
        extract:
          type: string
          description: |-
            Field in the incoming data whose value is matched against the Salesforce External ID field named in `upsert.externalIdField`. Set only when `operation` is `upsert`; all other operations use `whereClause` instead. Choose a field that is unique and always populated — missing or null values cause the upsert to fail. If both `extract` and `whereClause` are set, `extract` takes precedence for upsert.
          x-celigo-ai-guidance:
            - |-
              ## FIELD BEHAVIOR:
              - Specifies which field from the incoming data contains the External ID value
              - **Used for upsert operations ONLY**
              - Maps the incoming data field to the Salesforce External ID field specified in `upsert.externalIdField`
              - Must reference a field that exists in the incoming data payload
              - The field value must be unique and always populated to ensure reliable matching
              - Generates field mapping at runtime to match incoming records with Salesforce records
            - |-
              ## IMPLEMENTATION GUIDANCE:
              - Choose a field from incoming data that contains unique, non-null values
              - Ensure the field is always populated in the incoming records to prevent operation failures
              - This field's value will be matched against the Salesforce External ID field specified in `upsert.externalIdField`
              - Use the exact field name as it appears in the incoming data (case-sensitive)
              - If sample data is available, validate that the field exists and has appropriate values
              - Test with sample data to ensure matching works correctly before production deployment
