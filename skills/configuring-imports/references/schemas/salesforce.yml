          - Encode the document content in base64 format when transmitting via API to ensure data integrity and compatibility.
          - Validate file size and type against Salesforce platform limits and organizational policies before upload to prevent errors.
          - Provide comprehensive metadata including file name, description, content type (MIME type), file extension, and relevant tags or categories to facilitate search, classification, and governance.
          - Manage user permissions and access controls in accordance with Salesforce security and sharing settings to safeguard sensitive data.
          - Use appropriate Salesforce API endpoints (e.g., /sobjects/Document, Attachment, ContentVersion) and HTTP methods aligned with the document type and intended operation.
          - Implement robust error handling to manage responses related to file size limits, unsupported formats, permission denials, or network issues.
        - |-
          The 'document' property represents a digital file or record associated with a Salesforce entity,
          encompassing a wide range of file types such as attachments, reports, images,
          contracts, spreadsheets, and other files stored within the Salesforce platform.
          It acts as a comprehensive container that includes both the file's binary
          content—typically encoded in base64—and its associated metadata,
          such as file name, description, MIME type, and tags.
          This property enables seamless integration, retrieval, upload, update,
          and management of files within Salesforce-related workflows and processes.
          By linking relevant documents directly to Salesforce records,
          it enhances data organization, accessibility, collaboration,
          and compliance across various business functions.
          Additionally, it supports versioning, audit trails,
          and can trigger automation processes like workflows, validation rules,
          and triggers,
          ensuring robust document lifecycle management within the Salesforce ecosystem.
    attachment:
      type: object
      properties:
        id:
          type: string
          description: |-
            Salesforce-assigned ID of the Attachment record. Prefer the 18-character case-insensitive form over the 15-character case-sensitive form in integrations.
          x-celigo-ai-guidance:
            - |-
              ## FIELD BEHAVIOR:
              - Acts as the unique and immutable primary key for the attachment record.
              - Required for all API operations involving the attachment, including retrieval, updates, and deletions.
              - Ensures consistent and precise identification of the attachment in all Salesforce API interactions.
              - Remains constant and unchangeable throughout the lifecycle of the attachment once created.
            - |-
              ## IMPLEMENTATION GUIDANCE:
              - Must strictly adhere to Salesforce ID formats: either 15-character case-sensitive or 18-character case-insensitive alphanumeric strings.
              - Should be dynamically obtained from Salesforce API responses when creating or querying attachments to ensure accuracy.
              - Avoid hardcoding or manually entering IDs to prevent data integrity issues and API errors.
              - Validate the ID format programmatically before use to ensure compatibility with Salesforce API requirements.
              - Prefer using the 18-character ID in integration scenarios to minimize case sensitivity issues.
            - |-
              ## EXAMPLES:
              - "00P1t00000XyzAbCDE"
              - "00P1t00000XyzAbCDEAAA"
              - "00P3t00000LmNOpQR1"
            - |-
              ## IMPORTANT NOTES:
              - The 15-character ID is case-sensitive, whereas the 18-character ID is case-insensitive and recommended for integration scenarios.
              - Using an incorrect, malformed, or outdated ID will result in API errors or failed operations.
              - The ID does not convey any descriptive information about the attachment’s content or metadata.
              - Always retrieve and use the ID directly from Salesforce API responses to ensure validity and prevent errors.
              - The ID is unique within the Salesforce org and cannot be reused or duplicated.
            - |-
              ## DEPENDENCY CHAIN:
              - Generated automatically by Salesforce upon creation of the attachment record.
              - Utilized by other API calls and properties that require precise attachment identification.
            - |-
              Unique identifier for the attachment within the Salesforce system,
              serving as the immutable primary key for the attachment object.
              This ID is essential for accurately referencing, retrieving, updating,
              or deleting the specific attachment record through API calls.
              It must conform to Salesforce's standardized ID format,
              which can be either a 15-character case-sensitive or an 18-character
              case-insensitive alphanumeric string,
              with the 18-character version preferred for integrations due to its case
              insensitivity and reduced risk of errors.
              While the ID itself does not contain metadata about the attachment's content,
              it is crucial for linking the attachment to related Salesforce records and
              ensuring precise operations on the attachment resource across the platform.
        name:
          type: string
          description: Filename of the attachment, including the file extension (for example, `contract_agreement.pdf`).
          x-celigo-ai-guidance:
            - |-
              ## FIELD BEHAVIOR:
              - Stores the filename of the attachment as a string value.
              - Acts as the key identifier for the attachment within the Salesforce environment.
              - Displayed prominently in the Salesforce UI and API responses when viewing or managing attachments.
              - Should be unique within the context of the parent record to avoid confusion.
              - Includes file extensions (e.g., .pdf, .jpg, .docx) to denote the file type and facilitate correct processing.
              - Case sensitivity may apply depending on the context, affecting retrieval and display.
              - Used in URL generation and API endpoints, impacting accessibility and referencing.
            - |-
              ## IMPLEMENTATION GUIDANCE:
              - Validate filenames to exclude prohibited characters (such as \ / : * ? " < > |) and other special characters that could cause errors or security vulnerabilities.
              - Ensure the filename length does not exceed Salesforce’s maximum limit, typically 255 characters.
              - Always include the appropriate and accurate file extension to enable correct file type recognition.
              - Use clear, descriptive, and consistent naming conventions that reflect the content or purpose of the attachment.
              - Perform validation checks before upload to prevent failures or inconsistencies.
              - Avoid renaming attachments post-upload to maintain integrity of references and links.
              - Consider localization and encoding standards to support international characters where applicable.
            - |-
              ## EXAMPLES:
              - "contract_agreement.pdf"
              - "profile_picture.jpg"
              - "sales_report_q1_2024.xlsx"
              - "meeting_notes.txt"
              - "project_plan_v2.docx"
            - |-
              ## IMPORTANT NOTES:
              - Filenames are case-sensitive in certain contexts, which can impact retrieval and display.
              - Avoid special characters that may interfere with URLs, file systems, or API processing.
              - Renaming an attachment after upload can disrupt existing references or links to the file.
            - |-
              The name property represents the filename of the attachment within Salesforce
              and serves as the primary identifier for the attachment.
              It is crucial for enabling easy recognition, retrieval,
              and management of attachments both in the user interface and through API operations.
              This property typically includes the file extension,
              which specifies the file type and ensures proper handling, display,
              and processing of the file across different systems and platforms.
              The filename should be meaningful, descriptive,
              and concise to provide clarity and ease of use,
              especially when managing multiple attachments linked to a single parent record.
              Adhering to proper naming conventions helps maintain organization,
              improves searchability,
              and prevents conflicts or ambiguities that could arise from duplicate or unclear filenames.
        parentId:
          type: string
          description: |-
            Salesforce record the attachment is linked to, such as an Account, Contact, or Opportunity. Required when creating an attachment; access to the attachment follows the parent record's permissions.
          x-celigo-ai-guidance:
            - |-
              ## FIELD BEHAVIOR:
              - Represents the Salesforce record ID that the attachment is associated with.
              - Mandatory when creating or updating an attachment to specify its parent record.
              - Must correspond to an existing Salesforce record ID of a valid object type that supports attachments.
              - Enables querying, filtering, and reporting of attachments based on their parent record.
              - Enforces referential integrity between attachments and parent records.
              - Changes to the parent record, including deletion or modification, can affect the visibility, accessibility, and lifecycle of the attachment.
              - Access to the attachment is governed by the permissions and sharing settings of the parent record.
            - |-
              ## IMPLEMENTATION GUIDANCE:
              - Ensure the parentId is a valid 15- or 18-character Salesforce record ID, with preference for 18-character IDs to avoid case sensitivity issues.
              - Verify the existence and active status of the parent record before assigning the parentId.
              - Confirm that the parent object type supports attachments to prevent errors during attachment operations.
              - Handle user permissions and sharing settings to ensure appropriate access rights to the parent record and its attachments.
              - Use Salesforce APIs or metadata services to validate the parentId format, object type, and existence.
              - Implement robust error handling for invalid, non-existent, or unauthorized parentId values during attachment creation or updates.
              - Consider the impact of parent record lifecycle events (such as deletion or archiving) on associated attachments.
            - |-
              ## EXAMPLES:
              - "0011a000003XYZ123" (Account record ID)
              - "0031a000004ABC456" (Contact record ID)
              - "0061a000005DEF789" (Opportunity record ID)
            - |-
              The unique identifier of the parent Salesforce record to which the attachment is linked.
              This field establishes a direct and essential relationship between the
              attachment and its parent object,
              such as an Account, Contact, Opportunity,
              or any other Salesforce record type that supports attachments.
              It ensures that attachments are correctly associated within the Salesforce data model,
              enabling accurate retrieval, management,
              and organization of attachments in relation to their parent records.
              By linking attachments to their parent records,
              this field facilitates data integrity, efficient querying,
              and seamless navigation between related records.
              It is a mandatory field when creating or updating attachments and must reference a valid,
              existing Salesforce record ID.
              Proper use of this field guarantees referential integrity,
              enforces access controls based on parent record permissions,
              and impacts the visibility and lifecycle of the attachment within the Salesforce environment.
        contentType:
          type: string
          description: MIME type of the attachment content, such as `application/pdf` or `image/png`.
          x-celigo-ai-guidance:
            - |-
              ## FIELD BEHAVIOR:
              - Defines the media type of the attachment to guide processing, rendering, and handling decisions.
