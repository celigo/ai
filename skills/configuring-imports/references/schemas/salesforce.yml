      description: |-
        Salesforce Attachment record written by the import — a file linked to a parent record via `parentId`, with metadata such as name and content type.
      x-celigo-ai-guidance:
        - |-
          ## FIELD BEHAVIOR:
          - Stores the binary content or a reference to a file linked to a specific Salesforce record.
          - Supports multiple file formats including but not limited to documents, images, PDFs, spreadsheets, and email files.
          - Enables attaching additional context, documentation, or evidence to Salesforce objects.
          - Allows full lifecycle management: create, read, update, and delete operations on attachments.
          - Contains metadata such as file name, MIME content type, file size, and the ID of the parent Salesforce record.
          - Reflects changes immediately in the associated Salesforce record’s file attachments.
          - Maintains a direct association with the parent record through the ParentId field to ensure accurate linkage.
          - Supports integration with Salesforce Files (ContentVersion and ContentDocument) for advanced file management features.
        - |-
          ## IMPLEMENTATION GUIDANCE:
          - Encode file content using Base64 encoding when transmitting via Salesforce APIs to ensure data integrity.
          - Validate file size against Salesforce limits (commonly up to 25 MB per attachment) and confirm supported file types before upload.
          - Use the ParentId field to correctly associate the attachment with the intended Salesforce record.
          - Implement robust permission checks to ensure only authorized users can upload, view, or modify attachments.
          - Consider leveraging Salesforce Files (ContentVersion and ContentDocument objects) for enhanced file management capabilities, versioning, and sharing features, especially for new implementations.
          - Handle error responses gracefully, including those related to file size limits, unsupported formats, or permission issues.
          - Ensure metadata fields such as file name and content type are accurately populated to facilitate proper handling and display.
          - When updating attachments, confirm that the new content or metadata aligns with organizational policies and compliance requirements.
        - |-
          The attachment property represents a file or document linked to a Salesforce record,
          encompassing both the binary content of the file and its associated metadata.
          It serves as a versatile container for a wide variety of file types—including documents,
          images, PDFs, spreadsheets,
          and emails—allowing users to enrich Salesforce records such as emails, cases,
          opportunities,
          or any standard or custom objects with supplementary information or evidence.
          This property supports comprehensive lifecycle management,
          enabling operations such as uploading new files,
          retrieving existing attachments, updating file details,
          and deleting attachments as needed.
          By maintaining a direct association with the parent Salesforce record through
          identifiers like ParentId,
          it ensures accurate linkage and seamless integration within the Salesforce ecosystem.
          The attachment property facilitates enhanced collaboration, documentation,
          and data completeness by providing a centralized and manageable way to handle
          files related to Salesforce data.
    contentVersion:
      type: object
      properties:
        contentDocumentId:
          type: string
          description: |-
            ContentDocument this version belongs to; all versions of the same document share this ID. Assigned by Salesforce when the content version is created and immutable afterward.
          x-celigo-ai-guidance:
            - |-
              ## FIELD BEHAVIOR:
              - Represents the unique ID of the parent Content Document to which the Content Version belongs.
              - Acts as the primary link connecting multiple versions of the same document.
              - Immutable after the Content Version record is created, preserving data integrity.
              - Enables navigation from a specific Content Version to its parent Content Document.
              - Automatically assigned and managed by Salesforce during Content Version creation.
              - Essential for maintaining consistent version histories and document relationships.
            - |-
              ## IMPLEMENTATION GUIDANCE:
              - Use this ID to reference or retrieve the entire document across all its versions.
              - Verify that the ID corresponds to an existing Content Document before usage.
              - Utilize in SOQL queries and API calls to associate Content Versions with their parent document.
              - Avoid modifying this field directly; it is managed internally by Salesforce.
              - Employ this ID to support document lifecycle management, version tracking, and collaboration features.
              - Leverage this field to ensure accurate linkage in integrations and custom development.
            - |-
              ## EXAMPLES:
              - "0691t00000XXXXXXAAA"
              - "0692a00000YYYYYYBBB"
              - "0693b00000ZZZZZZCCC"
            - |-
              ## IMPORTANT NOTES:
              - Distinct from the Content Version ID, which identifies a specific version rather than the entire document.
              - Mandatory for any valid Content Version record to ensure proper document association.
              - Cannot be null or empty for Content Version records.
              - Critical for preserving document integrity, version tracking, and enabling collaborative document management.
              - Changes to this ID are not permitted post-creation to avoid breaking version linkages.
              - Plays a key role in Salesforce’s document sharing, access control, and audit capabilities.
            - |-
              ## DEPENDENCY CHAIN:
              - Requires the existence of a valid Content Document record in Salesforce.
              - Directly related to Content Version records representing different iterations of the same document.
            - |-
              contentDocumentId is the unique identifier for the parent Content Document
              associated with a specific Content Version in Salesforce.
              It serves as the fundamental reference that links all versions of the same document,
              enabling comprehensive version control and efficient document management within
              the Salesforce ecosystem.
              This ID is immutable once the Content Version is created,
              ensuring a stable and consistent connection across all iterations of the document.
              By maintaining this linkage,
              Salesforce facilitates seamless navigation between individual document versions
              and their overarching document entity,
              supporting streamlined retrieval, updates, collaboration,
              and organizational workflows.
              This field is automatically assigned by Salesforce during the creation of a
              Content Version and is critical for maintaining the integrity and traceability
              of document versions throughout their lifecycle.
        title:
          type: string
          description: Display title of this content version, shown in content libraries, search results, and version history.
          x-celigo-ai-guidance:
            - |-
              ## FIELD BEHAVIOR:
              - Functions as the main identifier or label for the content version in user interfaces, listings, and reports.
              - Enables users to distinguish between different versions of the same content efficiently.
              - Reflects the content’s subject, purpose, key attributes, or version status.
              - Should be concise but informative to facilitate quick recognition and comprehension.
              - Commonly displayed in search results, filters, version histories, and content libraries.
              - Supports sorting and filtering operations to streamline content management.
            - |-
              ## IMPLEMENTATION GUIDANCE:
              - Use clear, descriptive titles that accurately represent the content version’s focus or changes.
              - Avoid special characters or formatting that could cause display, parsing, or processing issues.
              - Keep titles within a reasonable length (typically up to 255 characters) to ensure readability across various UI components and devices.
              - Update the title appropriately when creating new versions to reflect significant updates or revisions.
              - Consider including version numbers, dates, or status indicators to enhance clarity and version tracking.
              - Follow organizational naming conventions and standards to maintain consistency.
            - |-
              ## EXAMPLES:
              - "Q2 Financial Report 2024"
              - "Product Launch Presentation v3"
              - "Employee Handbook - Updated March 2024"
              - "Marketing Strategy Overview"
              - "Website Redesign Proposal - Final Draft"
            - |-
              ## IMPORTANT NOTES:
              - Titles do not need to be globally unique but should be meaningful and contextually relevant.
              - Changing the title does not modify the underlying content data or its integrity.
              - Titles are frequently used in search, filtering, sorting, and reporting operations within Salesforce.
              - Consistent naming conventions and formatting improve content management efficiency and user experience.
              - Consider organizational standards or guidelines when defining title formats.
              - Titles should avoid ambiguity to prevent confusion between similar content versions.
            - |-
              ## DEPENDENCY CHAIN:
              - Part of the ContentVersion object within Salesforce’s content management framework.
              - Often associated with other metadata fields such as description
            - |-
              The title of the content version serves as the primary name or label assigned to
              this specific iteration of content within Salesforce.
              It acts as a key identifier that enables users to quickly recognize,
              differentiate, and manage various versions of content.
              The title typically summarizes the subject matter, purpose,
              or significant details about the content,
              making it easier to locate and understand at a glance.
              It should be concise yet sufficiently descriptive to effectively convey the
              essence and context of the content version.
              Well-crafted titles improve navigation, searchability,
              and version tracking within content management workflows,
              enhancing overall user experience and operational efficiency.
        pathOnClient:
          type: string
          description: |-
            Original file path on the client machine before upload. Used for reference and display only; it does not affect how the file is stored or accessed in Salesforce.
          x-celigo-ai-guidance:
            - |-
              ## FIELD BEHAVIOR:
              - Represents the full absolute or relative file path on the client device where the file was stored prior to upload.
              - Automatically populated during file upload processes when the client environment provides this information.
              - Used mainly for reference, auditing, and user interface display to provide context about the file’s origin.
              - May be empty, null, or omitted if the file was not uploaded from a client device or if the path information is unavailable or restricted.
              - Does not influence file storage, retrieval, or access permissions within Salesforce.
              - Retains the original formatting and syntax as provided by the client system at upload time.
            - |-
              ## IMPLEMENTATION GUIDANCE:
              - Capture the file path exactly as provided by the client system at the time of upload, preserving the original format and case sensitivity.
              - Handle differences in file path syntax across operating systems (e.g., backslashes for Windows, forward slashes for Unix/Linux/macOS).
              - Treat this property strictly as metadata for informational purposes; avoid using it for security, access control, or file retrieval logic.
              - Sanitize or mask sensitive directory or user information when displaying or logging this path to protect user privacy and comply with data protection regulations.
              - Ensure compliance with relevant privacy laws and organizational policies when storing or exposing client file paths.
              - Consider truncating, normalizing, or encoding paths if necessary to conform to platform length limits, display constraints, or to prevent injection vulnerabilities.
              - Provide clear documentation to users and administrators about the non-security nature of this property to prevent misuse.
            - |-
              ## EXAMPLES:
              - "C:\\Users\\JohnDoe\\Documents\\Report.pdf"
              - "/home/janedoe/projects/presentation.pptx"
              - "Documents/Invoices/Invoice123.pdf"
              - "Desktop/Project Files/DesignMockup.png"
              - "../relative/path/to/file.txt"
            - |-
              The pathOnClient property specifies the original file path of the content as it
              exists on the client machine before being uploaded to Salesforce.
              This path serves as a precise reference to the source location of the file on
              the user's local system,
              facilitating identification, auditing, and tracking of the file's origin.
              It captures either the full absolute path or a relative path depending on the
              client environment and upload context,
              accurately reflecting the exact location from which the file was sourced.
              This information is primarily used for informational, diagnostic,
              and user interface purposes within Salesforce and does not influence how the file is stored,
              accessed, or secured in the system.
        tagCsv:
          type: string
          description: |-
            Comma-separated tags applied to the content version for categorization and search. Updating this field replaces the entire tag set, so include every tag the version should keep.
          x-celigo-ai-guidance:
            - |-
              ## FIELD BEHAVIOR:
              - Accepts multiple tags separated by commas, typically without spaces, though trimming whitespace is recommended.
              - Tags are used to categorize, organize, and improve the discoverability of content versions.
              - Tags can be added, updated, or removed by modifying the entire string value.
              - Duplicate tags within the string should be avoided to maintain clarity and effectiveness.
              - Tags are generally treated as case-insensitive for search purposes but stored exactly as entered.
              - Changes to this field immediately affect how content versions are indexed and retrieved in search operations.
            - |-
              ## IMPLEMENTATION GUIDANCE:
              - Ensure individual tags do not contain commas to prevent parsing errors.
              - Validate the tagCsv string for invalid characters, excessive length, and proper formatting.
              - When updating tags, replace the entire string to accurately reflect the current tag set.
              - Trim leading and trailing whitespace from each tag before processing or storage.
              - Utilize this field to enhance search filters, categorization, and content management workflows.
              - Implement application-level checks to prevent duplicate or meaningless tags.
              - Consider standardizing tag formats (e.g., lowercase) to maintain consistency across records.
            - |-
              ## EXAMPLES:
              - "marketing,Q2,presentation"
              - "urgent,clientA,confidential"
              - "releaseNotes,v1.2,approved"
              - "finance,yearEnd,reviewed"
            - |-
              ## IMPORTANT NOTES:
              - The maximum length of the tagCsv string is subject to Salesforce field size limitations.
              - Tags should be meaningful, consistent, and standardized to maximize their utility.
              - Modifications to tags can impact content visibility and access if used in filtering or permission logic.
              - This field does not enforce uniqueness of tags; application-level logic should handle duplicate prevention.
              - Tags are stored as-is; any normalization or case conversion must be handled externally.
              - Improper formatting or invalid characters may cause errors or unexpected behavior in search and filtering.
            - |-
              ## DEPENDENCY CHAIN:
              - Closely related to contentVersion metadata and search/filtering functionality.
            - |-
              A comma-separated string representing the tags associated with the content
              version in Salesforce.
              This field enables the assignment of multiple descriptive tags within a single string,
              facilitating efficient categorization, organization,
              and enhanced searchability of the content.
              Tags serve as metadata labels that help users filter, locate,
              and manage content versions effectively across the platform by grouping related
              items and supporting advanced search and filtering capabilities.
              Proper use of this field improves content discoverability,
              streamlines content management workflows,
              and supports dynamic content classification.
        contentLocation:
          type: string
          description: Specifies where the content file for this ContentVersion record is stored — "S" for Salesforce internal storage or "E" for an external system (the two values the import form offers). Salesforce also defines "L" for content shared via a link, but the form does not set it. Typically assigned automatically based on the upload method.
          x-celigo-ai-guidance:
            - |-
              ## FIELD BEHAVIOR:
              - Determines the origin and storage context of the content file linked to the ContentVersion record.
              - Influences the mechanisms and protocols used for accessing, retrieving, and managing the content.
              - Typically assigned automatically by Salesforce based on the upload method or integration configuration.
              - Common values include 'S' for Salesforce internal storage, 'E' for external storage systems, and 'L' for linked external locations.
              - Often read-only to preserve data integrity and prevent unauthorized or unintended modifications.
              - Alterations to this field can impact content visibility, sharing settings, and delivery workflows.
            - |-
              ## IMPLEMENTATION GUIDANCE:
              - Utilize this field to programmatically distinguish between internally stored content and externally managed files.
              - When integrating with external repositories, ensure contentLocation accurately reflects the external storage to enable correct content handling and retrieval.
              - Avoid manual updates unless supported by Salesforce documentation and accompanied by a comprehensive understanding of the consequences.
              - Validate the contentLocation value prior to processing or delivering content to guarantee proper routing and access control.
              - Confirm that external storage systems are correctly configured, authenticated, and authorized to maintain uninterrupted access.
              - Monitor this field closely during content migration or integration activities to prevent data inconsistencies or access disruptions.
            - |-
              ## EXAMPLES:
              - 'S' — Content physically stored within Salesforce’s internal storage infrastructure.
              - 'E' — Content residing in an external system integrated with Salesforce, such as a third-party content repository.
              - 'L' — Content located in a linked external location, representing specialized or less common storage configurations.
            - |-
              ## IMPORTANT NOTES:
              - Manual modifications to contentLocation can lead to broken links, access failures, or data inconsistencies.
              - Salesforce generally manages this field automatically to uphold consistency and reliability.
              - The contentLocation value directly influences content delivery methods and access control policies.
              - External content locations require proper configuration, authentication, and permissions to function correctly
            - |-
              contentLocation specifies the precise storage location of the content file
              associated with the Salesforce ContentVersion record.
              It identifies where the actual file data resides—whether within Salesforce's
              internal storage infrastructure,
              an external content management system,
              or a linked external repository—and governs how the content is accessed,
              retrieved, and managed throughout its lifecycle.
              This field plays a crucial role in content delivery, access permissions,
              and integration workflows by clearly indicating the source location of the file data.
              Properly setting and interpreting contentLocation ensures that content is
              handled correctly according to its storage context,
              enabling seamless access when stored internally or facilitating robust
              integration and synchronization with third-party external systems.
      description: |-
        Salesforce ContentVersion record written by the import — a specific version of a content item in Salesforce Files. Each modification produces a new version, and all versions of a document are linked through `contentDocumentId`.
  # Shape → requireds. Nested if/else-if (no allOf), stack-style.
  # Branch 1: blob configs (attachment / contentVersion) — operation only; no api, and
  #   the operation→idLookup/upsert rules do not apply (the blob record carries its own
  #   identifiers; the current server accepts blob upserts without them).
  # Branch 2: server-written bookkeeping stubs — no requireds. Stub keys are {lookups}
  #   plus `api`, which the server defaults to "rest" on some stubs, so its presence
  #   alone does not indicate a user-authored config.
  # Branch 3: real record configs — operation + api, then operation → matching config
  #   (update/delete/addupdate share one branch because their requirements are identical).
  if:
    anyOf:
      - required: [attachment]
      - required: [contentVersion]
  then:
    required:
      - operation
  else:
    if:
      not:
        propertyNames:
          enum: [lookups, api]
    then:
      required:
        - operation
        - api
      if:
        properties:
          operation:
            const: upsert
        required:
          - operation
      then:
        required:
          - idLookup
          - upsert
        properties:
          idLookup:
            required:
              - extract
          upsert:
            required:
              - externalIdField
      else:
        if:
          properties:
            operation:
              enum: [update, delete, addupdate]
          required:
            - operation
        then:
          required:
            - idLookup
          properties:
            idLookup:
              required:
                - whereClause
        else:
          if:
            properties:
              operation:
                const: upsertpicklistvalues
            required:
              - operation
          then:
            required:
              - upsertpicklistvalues
            properties:
              upsertpicklistvalues:
                required:
                  - fullName
