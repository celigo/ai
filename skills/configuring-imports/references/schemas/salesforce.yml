              - May be used in logging, auditing, and analytics to track content types handled by the system.
            - |-
              ## IMPLEMENTATION GUIDANCE:
              - Must strictly adhere to the standard MIME type format as defined by IANA (e.g., "type/subtype").
              - Should accurately reflect the actual content format to prevent misinterpretation or processing errors.
              - Use generic types such as "application/octet-stream" only when the specific type cannot be determined.
              - Include optional parameters (e.g., charset, boundary) when relevant to fully describe the content.
              - Ensure the contentType is set or updated whenever the attachment content changes to maintain consistency.
              - Validate the contentType against the file extension and actual content where feasible to enhance reliability.
              - Consider normalizing the contentType to lowercase to maintain consistency across systems.
              - Avoid relying solely on contentType for security decisions; combine with other metadata and content inspection.
            - |-
              ## EXAMPLES:
              - "image/jpeg"
              - "application/pdf"
              - "text/plain; charset=utf-8"
              - "application/vnd.ms-excel"
              - "audio/mpeg"
              - "video/mp4"
              - "application/json"
              - "multipart/form-data; boundary=something"
              - "application/zip"
            - |-
              The MIME type of the attachment content,
              specifying the exact format and nature of the file (e.g., "image/png",
              "application/pdf", "text/plain").
              This information is critical for correctly interpreting, processing,
              and displaying the attachment across different systems and platforms.
              It enables clients and servers to determine how to handle the file,
              whether to render it inline, prompt for download,
              or apply specific processing rules.
              Accurate contentType values facilitate validation, security scanning,
              and compatibility checks,
              ensuring that the attachment is managed appropriately throughout its lifecycle.
              Properly defined contentType values improve interoperability, user experience,
              and system security by enabling precise content handling and reducing the risk
              of errors or vulnerabilities.
        isPrivate:
          type: boolean
          description: |-
            When true, the attachment is visible only to users explicitly authorized to access it; when false or omitted, it inherits the visibility of its parent record. This setting only restricts access further — it never grants access beyond the parent record's permissions.
          x-celigo-ai-guidance:
            - |-
              ## FIELD BEHAVIOR:
              - When set to true, the attachment is accessible only to users with explicit authorization, effectively hiding it from unauthorized users.
              - When set to false or omitted, the attachment inherits the visibility of its parent record and is accessible to all users who have access to that record.
              - Directly affects the attachment’s visibility scope and access control within Salesforce.
              - Changes to this field immediately impact user access permissions for the attachment.
              - Does not override broader organizational sharing settings but further restricts access.
              - The privacy setting applies in conjunction with existing record-level and object-level security controls.
            - |-
              ## IMPLEMENTATION GUIDANCE:
              - Use this field to enforce strict data privacy and protect sensitive attachments in compliance with organizational policies and regulatory requirements.
              - Ensure that user roles, profiles, and sharing rules are properly configured to respect this privacy setting.
              - Validate that the value is a boolean (true or false) to prevent data inconsistencies.
              - Evaluate the implications on existing sharing rules and record-level security before modifying this field.
              - Consider implementing audit logging to track changes to this privacy setting for security and compliance purposes.
              - Test changes in a sandbox environment to understand the impact on user access before deploying to production.
              - Communicate changes to relevant stakeholders to avoid confusion or unintended access issues.
            - |-
              ## EXAMPLES:
              - `true` — The attachment is private and visible only to users explicitly authorized to access it.
              - `false` — The attachment is public within the context of the parent record and visible to all users who have access to that record.
            - |-
              ## IMPORTANT NOTES:
