              - Implement validation to prevent use of reserved words or prohibited characters.
            - |-
              ## EXAMPLES:
              - "Quarterly Sales Report Q1 2024"
              - "Employee Handbook"
              - "Project Plan - Alpha Release"
              - "Marketing Strategy Overview"
              - "Client Contract - Acme Corp"
            - |-
              ## IMPORTANT NOTES:
              - The maximum length of the name may be limited (commonly up to 255 characters), depending on Salesforce configuration.
              - Renaming a document can affect external references, hyperlinks, or integrations relying on the original name.
              - Case sensitivity in name comparisons may vary based on Salesforce settings and should be considered when implementing logic.
              - Special characters and whitespace handling should align with Salesforce’s accepted standards to avoid errors.
            - |-
              The name of the document as stored in Salesforce,
              serving as a unique and human-readable identifier within the Salesforce environment.
              This string value represents the document's title or label,
              enabling users and systems to easily recognize, retrieve,
              and manage the document across user interfaces, search functionalities,
              and API interactions.
              It is a critical attribute used to reference the document in various operations
              such as creation,
              updates, searches, display contexts, and integration workflows,
              ensuring clear identification and organization within folders or libraries.
              The name plays a pivotal role in document management by facilitating sorting,
              filtering, and categorization,
              and it must adhere to Salesforce’s naming conventions and constraints to
              maintain system integrity and usability.
        folderId:
          type: string
          description: |-
            Salesforce folder that stores the document. The document inherits the folder's sharing and visibility settings; changing this value moves the document to a different folder.
          x-celigo-ai-guidance:
            - |-
              ## FIELD BEHAVIOR:
              - Identifies the exact folder containing the document.
              - Associates the document with a designated folder for structured organization.
              - Must reference a valid, existing folder ID within Salesforce.
              - Typically represented as a string conforming to Salesforce ID formats (15- or 18-character).
              - Influences document visibility and access based on folder permissions.
              - Changing the folderId moves the document to a different folder, affecting its context and access.
              - Inherits folder-level sharing and security settings automatically.
            - |-
              ## IMPLEMENTATION GUIDANCE:
              - Verify that the folderId exists and is accessible in the Salesforce instance before assignment.
              - Validate the folderId format to ensure it matches Salesforce’s 15- or 18-character ID standards.
              - Use this field to filter, query, or categorize documents by their folder location in API operations.
              - When creating or updating documents, setting this field assigns or moves the document to the specified folder.
              - Handle permission checks to ensure the user or integration has rights to assign or access the folder.
              - Consider the impact on sharing rules, workflows, and automation triggered by folder changes.
              - Ensure case sensitivity is preserved when handling folder IDs.
            - |-
              ## EXAMPLES:
              - "00l1t000003XyzA" (example of a Salesforce folder ID)
              - "00l5g000004AbcD"
              - "00l9m00000FghIj"
            - |-
              ## IMPORTANT NOTES:
              - The folderId must be valid and the folder must be accessible by the user or integration performing the operation.
              - Using an incorrect or non-existent folderId will cause errors or result in improper document categorization.
              - Folder-level permissions in Salesforce can restrict the ability to assign documents or access folder contents.
              - Changes to folderId may affect document sharing, visibility settings, and trigger related workflows.
              - Folder IDs are case-sensitive and must be handled accordingly.
            - |-
              The unique identifier of the folder within Salesforce where the document is stored.
              This ID is essential for organizing, categorizing,
              and managing documents efficiently within the Salesforce environment.
              It enables precise association of documents to specific folders,
              facilitating streamlined retrieval, access control,
              and hierarchical organization of document assets.
              By linking a document to a folder,
              it inherits the folder’s permissions and visibility settings,
              ensuring consistent access management and supporting structured document workflows.
              Proper use of this identifier allows for effective filtering, querying,
              and management of documents based on their folder location,
              which is critical for maintaining an organized and secure document repository.
        contentType:
          type: string
          description: MIME type of the document content, such as `application/pdf` or `image/png`.
          x-celigo-ai-guidance:
            - |-
              ## FIELD BEHAVIOR:
              - Defines the media type of the document content to guide processing, rendering, and handling.
              - Identifies the specific file format (e.g., PDF, JPEG, DOCX) for compatibility and validation purposes.
              - Facilitates content negotiation and appropriate response handling between systems and applications.
              - Typically formatted as a standard MIME type string (type/subtype), optionally including parameters such as charset.
              - Influences document handling in workflows, security scans, user interfaces, and API interactions.
              - Serves as a key attribute for determining how the document is stored, transmitted, and displayed.
            - |-
              ## IMPLEMENTATION GUIDANCE:
              - Always use valid MIME types conforming to official standards (e.g., "application/pdf", "image/png") to ensure broad compatibility.
              - Verify that the contentType accurately reflects the actual file content to prevent processing errors or misinterpretation.
              - Update the contentType promptly if the document format changes to maintain consistency and reliability.
              - Utilize this field to enable correct content handling in APIs, integrations, client applications, and automated workflows.
              - Include relevant parameters (such as charset for text-based documents) when applicable to provide additional context.
              - Consider validating the contentType against the file extension and content during upload or processing to enhance data integrity.
            - |-
              ## EXAMPLES:
              - "application/pdf" for PDF documents.
              - "image/jpeg" for JPEG image files.
              - "application/vnd.openxmlformats-officedocument.wordprocessingml.document" for Microsoft Word DOCX files.
              - "text/plain; charset=utf-8" for plain text files with UTF-8 encoding.
              - "application/json" for JSON formatted documents.
              - "audio/mpeg" for MP3 audio files.
            - |-
              The MIME type of the document,
              specifying the exact format of the file content stored within the Salesforce document.
              This field enables systems and applications to accurately identify, process,
              render, or handle the document by indicating its media type, such as PDF, image,
              audio, or text formats.
              It adheres to standard MIME type conventions (type/subtype) and may include
              additional parameters like character encoding when necessary.
              Properly setting this field ensures seamless integration, correct display,
              appropriate application usage,
              and reliable content negotiation across diverse platforms and services.
              It plays a critical role in workflows, security scanning, compliance validation,
              and API interactions by guiding how the document is stored, transmitted,
              and interpreted.
        developerName:
          type: string
          description: |-
            Unique API name used to reference the document in code, metadata, and integrations. Distinct from the display name; uses only letters, numbers, and underscores with no spaces.
          x-celigo-ai-guidance:
            - |-
              ## FIELD BEHAVIOR:
              - Serves as a unique and immutable identifier for the document within the Salesforce org.
              - Widely used in code, APIs, metadata, deployment processes, and integrations to reference the document reliably.
              - Should remain stable and not be altered frequently to maintain integration and system stability.
              - Enforces naming conventions that disallow spaces and special characters, favoring camelCase or underscores.
              - Case-insensitive in many contexts but consistent casing is recommended for clarity and maintainability.
              - Acts as a key reference point in metadata relationships and dependency mappings.
            - |-
              ## IMPLEMENTATION GUIDANCE:
              - Ensure the developerName is unique within the Salesforce environment to prevent naming collisions.
              - Follow Salesforce naming rules: start with a letter, use only alphanumeric characters and underscores.
              - Avoid reserved keywords, spaces, special characters, and punctuation marks.
              - Keep the identifier concise yet descriptive enough to clearly convey the document’s purpose or function.
              - Validate the developerName against Salesforce’s character set, length restrictions, and naming policies before deployment.
              - Plan for the developerName to remain stable post-deployment to avoid breaking references and integrations.
              - Use consistent casing conventions (camelCase or underscores) to improve readability and reduce errors.
              - Incorporate meaningful terms that reflect the document’s role or content for easier identification.
            - |-
              ## EXAMPLES:
              - "InvoiceTemplate"
              - "CustomerAgreementDoc"
              - "SalesReport2024"
              - "ProductCatalog_v2"
              - "EmployeeOnboardingGuide"
            - |-
              ## IMPORTANT NOTES:
              - Changing the developerName after deployment can disrupt integrations, metadata references, and dependent components.
              - It is distinct from the document’s display name, which can include spaces and be more user-friendly.
              - While Salesforce treats developerName as case-insensitive in many scenarios, maintaining consistent casing improves readability and maintenance.
            - |-
              developerName is a unique,
              developer-friendly identifier assigned to the document within the Salesforce environment.
              It acts as a stable and consistent reference used primarily in programmatic
              contexts such as Apex code,
              API calls, metadata configurations, deployment scripts,
              and integration workflows.
              This identifier ensures reliable access, manipulation,
              and management of the document across various Salesforce components and external systems.
              The value should be concise, descriptive,
              and strictly adhere to Salesforce naming conventions to prevent conflicts and
              ensure maintainability.
              Typically, it employs camelCase or underscores,
              excludes spaces and special characters,
              and is designed to remain unchanged over time to avoid breaking dependencies or integrations.
        isInternalUseOnly:
          type: boolean
          description: When true, marks the document for internal use only — it must not be shared with parties outside the organization.
          x-celigo-ai-guidance:
            - |-
              ## FIELD BEHAVIOR:
              - When set to true, the document is strictly restricted to internal users and must not be accessible or shared with any external entities.
              - When false or omitted, the document may be accessible to external users, subject to other access control mechanisms.
              - Commonly used to flag documents containing sensitive business strategies, internal communications, proprietary data, or confidential policies.
              - Influences user interface elements and API responses to hide, restrict, or clearly label document visibility accordingly.
              - Changes to this flag can trigger notifications, workflow actions, or audit events to ensure proper handling and compliance.
              - May affect document indexing, search results, and export capabilities to prevent unauthorized dissemination.
            - |-
              ## IMPLEMENTATION GUIDANCE:
              - Always verify this flag before granting document access in both user interfaces and backend APIs to ensure compliance with internal use policies.
              - Use in conjunction with role-based access controls, group memberships, document classification labels, and data sensitivity tags to enforce comprehensive security.
              - Carefully manage updates to this flag to prevent inadvertent exposure of confidential information; consider implementing approval workflows and multi-level reviews for changes.
              - Implement audit logging for all changes to this flag to support compliance, traceability, and forensic investigations.
              - Ensure all integrated systems, third-party applications, and data export mechanisms respect this flag to maintain consistent access restrictions.
              - Provide clear UI indicators, warnings, or access restrictions to users when accessing documents marked as internal use only.
              - Regularly review and validate the accuracy of this flag to maintain up-to-date security postures.
            - |-
              ## EXAMPLES:
              - true: A confidential internal report on upcoming product launches accessible only to employees.
              - false: A publicly available user manual or product datasheet intended for customers and partners.
              - true: Internal HR policies and procedures documents restricted to company staff.
              - false: Press releases or marketing materials distributed externally.
              - true: Financial forecasts and budget plans shared exclusively within the finance department.
              - true: Internal audit findings and compliance reports
            - |-
              isInternalUseOnly indicates whether the document is intended exclusively for
              internal use within the organization and must not be shared with external
              parties.
              This flag is critical for protecting sensitive, proprietary,
              or confidential information by restricting access strictly to authorized internal users.
              It serves as a definitive marker within the document’s metadata to enforce
              internal visibility policies,
              prevent accidental or unauthorized external distribution,
              and support compliance with organizational security standards.
              Proper handling of this flag ensures that internal communications,
              strategic plans, financial data,
              and other sensitive materials remain protected from exposure outside the company.
        isPublic:
          type: boolean
          description: When true, the document is accessible to all users; when false, access is limited to authorized users by Salesforce permissions and sharing settings.
          x-celigo-ai-guidance:
            - |-
              ## FIELD BEHAVIOR:
              - When true, the document is accessible by anyone, including unauthenticated users.
              - When false, access is restricted to users with explicit permissions or roles.
              - Directly influences the document’s visibility in search results, sharing interfaces, and external indexing.
              - Changes to this property take immediate effect, altering who can view the document.
              - Modifications may trigger updates in access control enforcement mechanisms.
            - |-
              ## IMPLEMENTATION GUIDANCE:
              - Use this property to clearly define and enforce document sharing and visibility policies.
              - Always set to false for sensitive, confidential, or proprietary documents to prevent unauthorized access.
              - Implement strict validation to ensure only users with appropriate administrative rights can modify this property.
              - Consider organizational compliance requirements, privacy regulations, and data security standards before making documents public.
              - Regularly monitor and audit changes to this property to maintain security oversight and compliance.
              - Plan changes carefully, as toggling this setting can have immediate and broad impact on document accessibility.
            - |-
              ## EXAMPLES:
              - true: A publicly available product catalog, marketing brochure, or press release intended for external audiences.
              - false: Internal project plans, financial reports, HR documents, or any content restricted to company personnel.
            - |-
              ## IMPORTANT NOTES:
              - Making a document public may expose it to indexing by search engines if accessible via public URLs.
              - Changes to this property have immediate effect on document accessibility; ensure appropriate change management.
              - Ensure alignment with corporate governance, legal requirements, and data protection policies when toggling public access.
              - Public documents should be reviewed periodically to confirm that their visibility remains appropriate.
              - Unauthorized changes to this property can lead to data leaks or compliance violations.
            - |-
              ## DEPENDENCY CHAIN:
              - Access control depends on user roles, profiles, and permission sets configured within the system.
            - |-
              Indicates whether the document is publicly accessible to all users or restricted
              exclusively to authorized users within the system.
              This property governs the document's visibility and access permissions,
              determining if authentication is required to view its content.
              When set to true,
              the document becomes openly available without any access controls,
              allowing anyone—including unauthenticated users—to access it freely.
              Conversely,
              setting this flag to false enforces security measures that limit access based on user roles,
              permissions, and organizational sharing rules,
              ensuring that only authorized personnel can view the document.
              This setting directly impacts how the document appears in search results,
              sharing interfaces, and external indexing services,
              making it a critical factor in managing data privacy, compliance,
              and information governance.
      description: |-
        Salesforce Document record written by the import, combining the file content with metadata such as name, folder, and content type.
      x-celigo-ai-guidance:
        - |-
          ## FIELD BEHAVIOR:
          - Contains both the binary content (usually base64-encoded) and descriptive metadata of a file linked to a Salesforce record.
          - Supports a diverse array of file types including PDFs, images, reports, contracts, spreadsheets, and other common document formats.
          - Facilitates operations such as uploading new files, retrieving existing files, updating metadata, deleting documents, and managing versions within Salesforce.
          - May be required or optional depending on the specific API operation, object context, or organizational business rules.
          - Changes to the document content or metadata can trigger Salesforce workflows, triggers, validation rules, or automation processes.
