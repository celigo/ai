NetsuiteDistributed:
  type: object
  description: |-
    Configuration for NetSuite Distributed (SuiteApp 2.0) import operations — the primary sub-schema for the NetSuiteDistributedImport adaptorType. The API field name is "netsuite_da".
    operation and recordType are required. The server may attach empty bookkeeping stubs of
    this object (empty lookups/mapping, or missingOrCorruptedDAConfig) to imports of other
    adaptor types; stubs omit these fields. Set internalIdLookup so existing records
    can be found when operation is update, addupdate, or delete.
  x-celigo-ai-guidance:
    - |-
      ## KEY FIELDS
      - operation: REQUIRED — the NetSuite operation (add, update, addupdate, etc.)
      - recordType: REQUIRED — the NetSuite record type (e.g., "customer", "salesorder")
      - mapping: field mappings from source data to NetSuite fields
      - internalIdLookup: how to find existing records for update/addupdate/delete
      - restletVersion: defaults to "suiteapp2.0"; fixed once the step is created (recreate/clone to change)
  properties:
    operation:
      type: string
      enum:
        - add
        - update
        - addupdate
        - attach
        - detach
        - delete
      x-lowercase: true
      x-enumDescriptions:
        add: Create a new record in NetSuite.
        update: Update an existing record in NetSuite, requires internalIdLookup.
        addupdate: Upsert — update the record if found, otherwise create a new one.
        attach: Attach one NetSuite record to another record.
        detach: Detach a previously attached NetSuite record from another record.
        delete: Delete an existing record from NetSuite, requires internalIdLookup.
      x-celigo-ui-override: >-
        Required by the NetSuite import form (operation is required:true). Encoded to mirror the
        form so builders produce connectable configurations.
      description: |-
        Operation to perform on the target NetSuite record, as a plain string. Required.
        For `update`, `addupdate`, and `delete`, also set internalIdLookup so existing records can be found.
      x-celigo-ai-guidance:
        - |-
          ## GUIDANCE
          - Default to "addupdate" when user says "sync", "upsert", or "create or update".
          - Use "add" when user says "create" or "insert" without mentioning updates.
          - For "update", "addupdate", and "delete", you MUST also set internalIdLookup.
        - |-
          ## IMPORTANT
          This field is a string, NOT an object. Set it directly: "operation": "addupdate"
          Do NOT send {"type": "addupdate"} — that causes a Cast error.
    recordType:
      type: string
      x-celigo-ui-override: >-
        Required by the NetSuite import form (recordType is required:true). Encoded to mirror the
        form so builders produce connectable configurations.
      description: |-
        NetSuite record type to import into (e.g. "customer", "salesorder", "customrecord_myrecord" for custom record types). Required.
        Must match a valid NetSuite record type identifier.
      x-celigo-ai-guidance:
        - |-
          Use the NetSuite internal record-type id: lowercase, no spaces,
          no camelCase (e.g.
          `salesorder` — NOT `salesOrder` — and `itemfulfillment` — NOT `itemFulfillment`).
          Custom records use `customrecord_<id>`.
        - |-
          Common standard record types in active integrations (ordered most → least frequent):
          `salesorder`, `customer`, `invoice`, `itemfulfillment`,
          `customerrefund`, `returnauthorization`, `creditmemo`, `inventoryitem`,
          `customerpayment`, `customerdeposit`, `journalentry`, `itemreceipt`,
          `cashrefund`, `cashsale`, `purchaseorder`, `deposit`, `contact`,
          `transferorder`, `inventoryadjustment`, `vendorbill`, `vendor`, `job`,
          `noninventoryitem`, `employee`.
      examples: ["customer", "salesorder", "customrecord_user"]
    recordIdentifier:
      type: string
      description: |
        Custom record identifier, used to identify the specific record type when
        importing into custom record types.
    restletVersion:
      type: string
      enum:
        - suitebundle
        - suiteapp1.0
        - suiteapp2.0
      x-lowercase: true
      x-enumDescriptions:
        suitebundle: Legacy SuiteBundle RESTlet version; slated for deprecation — NetSuite no longer updates SuiteScript 1.0.
        suiteapp1.0: SuiteApp 1.0 RESTlet version using SuiteScript 1.0.
        suiteapp2.0: SuiteApp 2.0 RESTlet version using SuiteScript 2.0, the modern default.
      description: |-
        Version of the NetSuite RESTlet to use, as a plain string.
        Defaults to "suiteapp2.0" when useSS2Restlets is true, "suitebundle" otherwise; rarely needs to be set explicitly for modern integrations.
        The version is fixed when the step is created — the Advanced selector is disabled on existing steps, and migrating an existing step to a different version means recreating or cloning it.
      x-celigo-ai-guidance:
        - |-
          Do not wrap the value in an object like `{"type": "suiteapp2.0"}` — that causes a Cast error.
        - |-
          The NetSuite API version cannot be changed on an existing step — the UI
          disables the selector once the step is saved. When asked to migrate an
          existing step off the SuiteBundle (or between versions), do not update
          this field in place; the migration path is recreating or cloning the
          step with the new version.
        - |-
          SuiteScript hooks are a separate setting from the step's API version:
          hook code must be written for the same SuiteScript version as the step
          (1.0 and 2.x are not interchangeable), and migrating a hook is its own
          task — flag it whenever migrating a step that carries hooks.
        - |-
          Author new steps with suiteapp2.0 unless the user explicitly requires a
          legacy version — NetSuite no longer updates SuiteScript 1.0 and Celigo
          plans to deprecate the SuiteBundle option.
    useSS2Restlets:
      type: boolean
      description: |-
        When true, uses SuiteScript 2.0 RESTlets and restletVersion defaults to "suiteapp2.0".
        Defaults to true for modern integrations.
        Set at step creation together with restletVersion — the same creation-time-only constraint applies (see restletVersion).
    missingOrCorruptedDAConfig:
      type: boolean
      description: |-
        When true, the Distributed Adaptor configuration is missing or corrupted.
        Set by the system — do not set manually.
    batchSize:
      type: number
      description: |
        Number of records to process per batch. Controls how many records are sent
        to NetSuite in a single API call. Typical values: 50-200.
      x-celigo-ai-guidance:
        - |-
          Batching applies to the record writes. The `internalIdLookup` searches for a
          page of records are issued ahead of the writes and independently of `batchSize`,
          so `batchSize: 1` does not make the existing-record lookup run one record at a
          time.
    internalIdLookup:
      type: object
      description: |-
        Configuration for looking up existing NetSuite records to match against incoming data.
        Required when operation is "update", "addupdate", or "delete".
      x-celigo-ai-guidance:
        - |-
          Two ways to specify the lookup, picked per import:

          - **Expression form** — the default choice: set `expression` to a
            NetSuite search-expression literal (the canonical patterns are on
            the `expression` field — `["internalid","is","{{{id}}}"]` for a
            record that carries the internal id, `externalid` and `cust*_*`
            variants, `anyof` for multi-match, AND/OR compounds).  When
            `expression` is set, `searchField` / `operator` / `extract` are
            ignored.
          - **Simple form** — set `searchField` + `operator` (+ optional
            `extract`) for a single-criterion lookup against a built-in
            NetSuite field; the platform builds the equivalent search
            expression at runtime.  For the internal id itself the expression
            form above is the preferred path, and `anyof` is available only
            through `expression`.
        - |-
          The lookup result is what identifies the target record; on `update` a source
          field mapped to `internalid` is overridden by it. When the incoming record
          already carries the NetSuite internal ID, point the lookup at that field with
          the expression form — `["internalid","is","{{{id}}}"]` — rather than removing
          the lookup. Only when every record carries it: on `restletVersion:
          suiteapp2.0` a record whose field is empty does not fall through to
          "create" on `addupdate` — the empty value is searched as `isempty` and
          can match an existing record (see `expression`; SuiteBundle and SuiteApp
          1.0 create in that case).
      properties:
        extract:
          type: string
          description: Path in the source record to extract the lookup value from (e.g. "internalId" or "externalId").
          x-celigo-ai-guidance:
            - |-
              Path on the incoming source record (NOT the post-mapped record) whose value drives the lookup.
              Used with the simple form (`searchField` + `operator`).
              Common values: `"externalId"`, `"id"`.
              Ignored when `expression` is set.
          examples: ["externalId"]
        searchField:
          type: string
          description: NetSuite field to search against (e.g. "externalId", "email", "name", "tranId").
          x-celigo-ai-guidance:
            - |-
              NetSuite field the simple-form lookup queries against.
              Common values: `"externalId"`, `"email"`, `"tranId"`, `"name"`.
              Matching on the record's internal id is the expression form —
              `["internalid","is","{{{id}}}"]` — not a `searchField`.
              Ignored when `expression` is set.
          examples: ["externalId"]
        operator:
          type: string
          description: Comparison operator for the lookup (e.g. "is", "contains", "startswith").
          x-celigo-ai-guidance:
            - |-
              Comparison operator for the simple-form lookup.
              Common values: `"is"` (exact match), `"contains"`, `"startswith"`,
              `"equalto"`.  Multi-match (`anyof`) is available only through
              `expression` (`["internalid","anyof","{{{id}}}"]`).
              Ignored when `expression` is set.
        expression:
          type: string
          description: NetSuite search expression for complex lookup conditions, used for multi-field or conditional lookups.
          x-celigo-ai-guidance:
            - |-
              NetSuite search-expression literal as a JSON string.
              The expression is evaluated at runtime — Handlebars renders `{{...}}`
              substitutions FIRST against the incoming source record (pre-mapped),
              then the substituted expression is sent to NetSuite as a saved-search query.
            - |-
              ## Handlebars conventions

              - **No `record.` prefix** — substitutions reference top-level
                source-record fields directly.  `{{{id}}}` / `{{{Id}}}` /
                `{{{externalid}}}` / `{{{[Internal ID]}}}` — NOT
                `{{{record.id}}}`.  Top-level paths are the established
                convention.
              - **Triple braces `{{{...}}}`** are the preferred form;
                double-brace `{{...}}` also works for cases where you want
                the platform's default HTML-escape (rare in this field).
              - **Bracket notation for field names with spaces or special
                chars**: `{{{[Field With Spaces]}}}`, `{{{[Internal ID]}}}`.
            - |-
              ## Canonical patterns

              ### Simple lookup by internal ID (most common)

              `["internalid","is","{{{id}}}"]`

              Use when the source record carries the destination NetSuite
              internal-id directly (e.g., from a prior lookup, response
              mapping, or cross-reference field).

              ### Multi-match by internal ID

              `["internalid","anyof","{{{id}}}"]`

              Same as above but uses `anyof` to match an internal-id from a
              comma-separated list value.  `anyof` is only available via the
              expression form (the simple `operator` field doesn't carry it).

              ### Lookup by external ID

              `["externalid","is","{{{Id}}}"]` /
              `["externalid","is","{{{id}}}"]`

              Use when the source record's primary key is stored in NetSuite as
              an `externalid` (cross-reference scenarios — Shopify, SFCC,
              Amazon, etc., where the platform-specific id is the externalid).

              ### Lookup by custom-record field

              `["custbody_celigo_etail_order_id","is","{{{id}}}"]`
              `["custentity_celigo_sfio_sf_id","is","{{{Id}}}"]`
              `["custrecord_celigo_shopify_payout_id","is","{{{id}}}"]`

              Use when the destination NetSuite record carries a custom field
              holding the source-system id.  The `cust*_*` field id MUST
              match the script-id of an existing custom field on the target
              record type (e.g., `custbody_*` on transactions,
              `custentity_*` on entities, `custrecord_*` on custom records
              and lists).

              ### Compound AND lookup (multiple criteria)

              `[["custbody_celigo_amzio_settlement_id","is","{{{[Settlement Id]}}}"],"AND",["custbody_celigo_amzio_accounts","is","{{{[Amazon Account Internal Id]}}}"]]`

              Use when the destination record needs more than one field to
              uniquely identify it (composite-key scenarios — Amazon
              settlements, multi-store integrations).  Each criterion is a
              `[field, operator, value]` triple; the outer array alternates
              triples and operators (`"AND"` / `"OR"`).

              ### Compound with OR / nested grouping

              `[["custbody_celigo_etail_order_id","is","{{{order_id}}}"],"AND",["custbody_celigo_etail_order_fulfilled","is","T"],"AND",[["custbody_celigo_etail_fulfillment_id","is","{{{id}}}"],"OR",["custbody_celigo_etail_fulfillment_id","isempty",""]]]`

              `OR` works the same as `AND`; nesting groups via inner
              arrays.  Use `"isempty"` (with empty-string value) to match
              unset fields.
            - |-
              ## Anti-patterns

              - DO NOT prefix substitutions with `record.` — top-level paths
                are the convention.
              - DO NOT use `jsonSerialize` here — search expressions take
                scalar literals, not serialized JSON.  Use `{{{id}}}` or
                `{{{[Field Name]}}}` directly.
            - |-
              ## A substitution that renders empty is not "no match"

              When the source field is absent or empty, `["internalid","is","{{{id}}}"]`
              renders `["internalid","is",""]`, and the SuiteApp rewrites an empty
              `is` / `equalto` / `internalid anyof` value to `isempty` before the
              search. On `restletVersion: suiteapp2.0` that search is not treated as
              "no match": it can return existing records, and `addupdate` then
              updates one of them — an unrelated record receives the mapping (for
              example, a `cant_modify_sub` error on a customer the record never
              named). SuiteBundle and SuiteApp 1.0 discard a blank `internalid`
              match and create. Design so the operational lookup never renders
              empty: key it on a value every record carries (the source id stored
              as `externalid`), or route records without a destination id to a
              separate `add` import.
            - |-
              ## Body-level only

              This lookup identifies the record being imported, so bare
              body fields are the right paths here. A per-field lookup
              attached to a sublist row (`lookups[]` referenced from
              `mapping.lists[].fields[].lookupName`) is different: its
              expression addresses the current line with
              `<array>[*].<field>` — see `lookups[].expression`.
    hooks:
      type: object
      description: |
        Script hooks for custom processing at different stages of the import.
        Each hook references a SuiteScript file and function.
      properties:
        preMap:
          type: object
          description: Runs before field mapping is applied.
          properties:
            fileInternalId:
              type: [string, 'null']
              description: NetSuite internal ID of the SuiteScript file. Null on hook
                stubs where no SuiteScript file has been selected.
            function:
              type: string
              description: Name of the function to execute.
            configuration:
              type: [object, 'null']
              description: Configuration object passed to the hook function. Null when
                the hook carries no static parameters.
        postMap:
          type: object
          description: Runs after field mapping, before submission to NetSuite.
          properties:
            fileInternalId:
              type: [string, 'null']
              description: NetSuite internal ID of the SuiteScript file. Null on hook
                stubs where no SuiteScript file has been selected.
            function:
              type: string
              description: Name of the function to execute.
            configuration:
              type: [object, 'null']
              description: Configuration object passed to the hook function. Null when
                the hook carries no static parameters.
        postSubmit:
          type: object
          description: Runs after the record is submitted to NetSuite.
          properties:
            fileInternalId:
              type: [string, 'null']
              description: NetSuite internal ID of the SuiteScript file. Null on hook
                stubs where no SuiteScript file has been selected.
            function:
              type: string
              description: Name of the function to execute.
            configuration:
              type: [object, 'null']
              description: Configuration object passed to the hook function. Null when
                the hook carries no static parameters.
    mapping:
      type: object
      description: |-
        NetSuite-specific Mapper 1.0 field mappings (the "DA" dialect).
        Used by `NetSuiteDistributedImport` exclusively — NetSuite's
        Distributed Adaptor cannot consume generic v1 mappings or the
        Mapper 2.0 shape because it needs sublist, subrecord, and
        conditional lookup semantics the generic schemas don't model.

        Field-level shape: `fields` for body columns, `lists` for
        sublists / line-item arrays.
      x-celigo-ai-guidance:
        - |-
          Validated via the dedicated `PUT /v1/netsuiteDA/previewImportMappingFields`
          endpoint (NOT `/v1/processors/mapperProcessor`).
        - |-
          The preview resolves the mapping without writing to NetSuite: the multiselect row
          NetSuite rejected at save time (see `fields[].dataType`) rendered exactly like the
          row it accepted, so a passed preview does not prove the save.
      properties:
        fields:
          type: array
          items:
            type: object
            properties:
              extract:
                type: [string, 'null']
                description: |
                  Path in the source record to extract the value from, in
                  dot notation for nested fields (e.g., "address.city").
                  A bare string is always read as a path, never as a
                  constant — a path that matches no field sets the
                  destination field to an empty string (""), written,
                  not omitted and not the path text, and `discardIfEmpty`
                  is what skips it; constants belong in `hardCodedValue`,
                  and the platform stores `null` here on fields driven by
                  it. A Handlebars template (contains `{{`) reads the
                  record's fields by bare name; `{{record.<field>}}`
                  renders an empty string, not the value.
                examples: ["address.city"]
              generate:
                type: string
                description: |
                  The NetSuite field ID to write the value to (e.g., "companyname", "email", "subsidiary").
                  Besides field ids it includes Celigo's control rows, which change how the record is
                  written instead of setting a field — `celigo_recordmode_dynamic` (NetSuite record
                  mode), `celigo_nlobjTransformId` with `celigo_nlobjTransformType` (create by
                  transforming the source transaction, "Created From"), `celigo_replaceAllLines_<sublist id>`
                  (replace a sublist's lines on update), `celigo_initializeValues` (the article's
                  "Initialize Values" row: its `hardCodedValue` is a comma-separated list of the mapped
                  field ids NetSuite receives as record initializers when it creates the record), and
                  the rows the article lists by label (Ignore Mandatory Fields, Persist New Line
                  Insertion Order, Print Nlapi Debug Logs, Group Lines By, Use Address Subrecord, Void
                  Transaction).
                  For a NetSuite field it is always the field's script id: the mapping editor shows each
                  destination by its label ("Customer (InternalId)", "Items : Location (InternalId)"),
                  and a label saved here is not a field. The control rows above keep their own ids.
                examples: ["companyname"]
                x-celigo-ai-guidance:
                  - |-
                    `Items : Location (InternalId)` saved as a body row's `generate` — the editor's
                    label for `item[*].location.internalid`, not a field id — was accepted by the save,
                    rendered by the mapping preview, and ignored by NetSuite on a sales order import:
                    the import succeeded with the field blank and no error anywhere. A label is never
                    a script id. Resolve ids from the record metadata
                    (`GET /v1/netsuite/metadata/suitescript/connections/{_id}/recordTypes/{recordType}`,
                    `listNetSuiteRecordTypeFields`), whose rows carry each field's `id` and its editor
                    label as `name`; that list is the editor's destination dropdown and is form- and
                    role-dependent, so a standard field hidden on the form is absent from it yet still
                    written by id.
                  - |-
                    A line field is never a body row. `item[*].<field>` is the record metadata's id
                    for a sublist field (the editor shows its label, "Items : Location (InternalId)"),
                    and the form typed as a destination to add a row the editor's picker lacks (see
                    `lists`); the document stores it as the bare field id under `lists[]` with
                    `generate: item`. A body row carrying that form is not a line mapping.
                  - |-
                    `celigo_recordmode_dynamic` with `hardCodedValue: "true"` is Celigo's documented
                    "Use Dynamic Mode" row: the record is created or loaded in NetSuite's dynamic mode,
                    where NetSuite documents that body fields and sublist lines are sourced, calculated
                    and validated as each value is set, in UI order — one field can source or overwrite
                    another, so mapping-row order matters, and a field no mapping row sets can arrive
                    populated by NetSuite's own sourcing. Without the row the record is written in
                    NetSuite's default standard mode, where sourcing of empty dependent fields at save
                    depends on the SuiteScript save option `enableSourcing` (default false); whether
                    the SuiteApp passes it is not documented.
                  - |-
                    The fields `celigo_initializeValues` names are the record initializers of the
                    create or load call — NetSuite's default values for the record, in place before
                    the mapping rows are set. NetSuite documents that selecting a vendor or customer
                    on a transaction associates it with that entity's primary subsidiary, and that a
                    secondary subsidiary is chosen afterwards from the ones assigned to the entity.
              hardCodedValue:
                type: string
                description: |
                  A static value to always use instead of extracting from source data.
                  Mutually exclusive with extract.
              lookupName:
                type: string
                description: Reference to a lookup defined in netsuite_da.lookups by name.
              dataType:
                type: string
                description: |
                  Data type hint for the field value (e.g., "string", "number", "date", "boolean").
                  Omit it on a multiselect reference row (`internalId: true`), which takes an array
                  of numeric internal ids.
                x-celigo-ai-guidance:
                  - |-
                    On a multiselect reference row, `dataType: "stringarray"` with an array of string
                    ids was written as ONE comma-joined text selection and NetSuite rejected the save
                    with `Invalid <field> reference key <id1>,<id2>,…`, leaving the field empty; the
                    same row with no `dataType` and an array of numeric ids saved every id as a
                    selection.
              internalId:
                type: boolean
                description: |-
                  When true, the value is a NetSuite internal ID reference — the mapper's
                  "(InternalId)" destination row, stored on the base field id in `generate` rather
                  than as a `<field>.internalid` suffix.
              immutable:
                type: boolean
                description: When true, this field is only set on record creation, not on updates.
              discardIfEmpty:
                type: boolean
                description: When true, skip this field mapping if the extracted value is empty.
              extractDateFormat:
                type: string
                description: |
                  Date format of the extracted value (e.g., "MM/DD/YYYY", "ISO8601").
                  Used to parse date strings from source data.
              extractDateTimezone:
                type: [string, 'null']
                description: Timezone of the extracted date value (e.g., "America/New_York"). Stored as `null` when not configured.
              subRecordMapping:
                type: object
                description: |-
                  Nested Mapper 1.0 mapping for a NetSuite subrecord
                  embedded in this field.  A subrecord is a child
                  record that only exists inside a parent (e.g. the
                  Inventory Detail on a serialized-item line of a
                  sales order); NetSuite reaches it through the
                  parent.

                  **Recursive structure.**  The nested `mapping`
                  object has the same `{fields, lists}` shape as the
                  top-level `netsuite_da.mapping`.  Recursion is
                  allowed but rare.
                x-celigo-ai-guidance:
                  - |-
                    **Do not over-emit.** Per the Celigo help center:
                    "Unconfigured subrecord mappings can cause your NetSuite import to fail.
                    Only include subrecord mappings on imports that require subrecord data." Emit
                    this block ONLY when the destination record type genuinely requires the
                    subrecord.
                  - |-
                    **Common `recordType` values** (most common
                    first):
                    * `inventorydetail` — by far the most common.
                      Serial / lot / bin assignments on sales-order,
                      item-fulfillment, purchase-order, and inventory-
                      adjustment line items.  Nested `mapping`
                      typically has empty `fields` and a single
                      `inventoryassignment` sublist.
                    * `componentinventorydetail` — same concept on
                      work-order / assembly-build component lines.
                    * `itemvendorprice` — vendor-specific price tiers
                      on item-vendor relationships.
                    * `landedcost` — landed-cost allocations.
                    * `itempricing` — quantity-based price tiers on
                      contracts.
                    * `mainaddress` / `shippingaddress` /
                      `returnaddress` — address subrecords on
                      transactions.
                    * `countdetail` — per-line detail on physical-
                      inventory counts.
                  - |-
                    **Where this block lives.** The enclosing field's `generate` name is a
                    synthetic trigger (typically `celigo_*`) whose purpose is to carry this
                    `subRecordMapping` block — it is NOT a real NetSuite column.
                    The trigger → `recordType` correspondence is mostly `celigo_<recordType>`
                    but NOT a strict rule:
                    `celigo_inventorydetail` covers BOTH `inventorydetail` and
                    `componentinventorydetail` depending on the parent record,
                    and address triggers use the `celigo_address_<qualifier>` ↔ `<qualifier>address` flip (e.g.
                    `celigo_address_main` ↔ `mainaddress`).
                    Match trigger names on existing resources rather than synthesizing new ones.
                properties:
                  recordType:
                    type: string
                    description: |
                      NetSuite's internal record-type id of the
                      SUBRECORD (not the parent).  E.g.
                      `inventorydetail`, `itempricing`,
                      `mainaddress`.
                  jsonPath:
                    type: string
                    description: |
                      JSONPath from the source record root that selects
                      the data feeding this subrecord.  Semantics depend
                      on placement:
                      * Line-level (on `lists[].fields[].`
                        `subRecordMapping`) — the array of lines the
                        sublist iterates (`lineItems`); `$` only when
                        each record is itself one line.
                      * Body-level (on `fields[].subRecordMapping`)
                        — a path into the source record root.
                      Defaults to `$`.
                  mapping:
                    type: object
                    description: |
                      Nested `{fields, lists}` mapping for the
                      subrecord.  Identical shape to the top-level
                      `netsuite_da.mapping`.  Subrecords often have
                      empty `fields` and only a sublist (e.g.
                      `inventorydetail` → `inventoryassignment`).
                  lookups:
                    type: array
                    description: |
                      Subrecord-scoped lookups.  Same shape as the
                      top-level `netsuite_da.lookups`.  Fields inside
                      this `subRecordMapping.mapping` reference them
                      via `lookupName`.  Often `[]`.
                  referenceFieldId:
                    type: string
                    description: |
                      Secondary reference-field identifier used on a
                      small fraction of subrecord blocks.  Exact
                      semantics are not publicly
                      documented by Celigo — match the value on
                      existing resources when present; do NOT
                      synthesize one.  Leave unset unless a template
                      clearly requires it.
              conditional:
                type: object
                description: |
                  Conditional logic for when to apply this field mapping
                  ("Only perform mapping when" in the UI). Lookup-based
                  conditions evaluate the lookup named by `lookupName`,
                  which must be defined on this import.
                x-celigo-ai-guidance:
                  - |-
                    A `conditional.lookupName` that matches no lookup defined on the
                    import fails every record at runtime with
                    `Cannot set properties of undefined (setting '_hasStarNotation')`
                    (source `application`) — the message names neither the mapping row
                    nor the lookup. Diagnose by cross-referencing every body and sublist
                    row's `conditional.lookupName` against the import's defined lookups;
                    a lookup renamed or removed while a condition still references the
                    old name is the typical cause. Fix the reference or restore the
                    lookup — changing the RESTlet / SuiteScript version does not resolve
                    this error.
                  - |-
                    `when: record_updated` requires an operation that can update an
                    existing record: on an `add`-only operation every record fails with
                    `The mapping condition:"record_updated" not supported for the
                    operation`. It works on `addupdate` and `update`.
                  - |-
                    The condition is one of the fixed `when` values — there is no
                    predicate over a source field ("when `customer.id` is not empty",
                    "when `channel.name` is Point of Sale" cannot be written here).
                    `extract_not_empty` is the only source-driven gate: on a lookup row
                    it reads the row's `extract`, and when that is empty the row is
                    skipped and the field is left unset — nothing substitutes a value.
                    Value-dependent behaviour (a fallback record when the key is
                    missing) belongs inside the lookup's `expression` (see
                    `lookups[].expression`).
                  - |-
                    Two rows with the same `generate` are not a fallback pair: the
                    last row for a destination decides it alone — when its condition
                    skips it the field stays empty even if an earlier row produced a
                    value, and when it applies it overwrites the earlier row's value
                    (`ignore_if_set` reads the target record, not an earlier row).
                properties:
                  lookupName:
                    type: string
                    description: |-
                      Lookup to evaluate for the condition. Must exactly match the
                      `name` of a lookup defined on this import.
                  when:
                    type: string
                    enum:
                      - record_created
                      - record_updated
                      - extract_not_empty
                      - lookup_not_empty
                      - lookup_empty
                      - ignore_if_set
                    x-enumDescriptions:
                      record_created: Apply this mapping only when a new record is being created.
                      record_updated: Apply this mapping only when an existing record is being updated.
                      extract_not_empty: Apply this mapping only when the extracted source value is non-empty.
                      lookup_not_empty: Apply this mapping only when the lookup returns a value.
                      lookup_empty: Apply this mapping only when the lookup returns no value.
                      ignore_if_set: Skip this mapping if the target field already has a value.
                    description: Condition that controls when this field mapping is applied.
          description: |
            Body-level field mappings. Each entry maps a source field to a NetSuite body field.
        lists:
          type: array
          items:
            type: object
            properties:
              generate:
                type: string
                description: |
                  The NetSuite sublist ID as the record metadata lists it (e.g., "item" for sales
                  order line items, "addressbook" for address sublists); the mapping editor shows
                  the sublist by its label ("Items"), which is never the id.
              jsonPath:
                type: string
                description: |-
                  LEGACY — do not set. Nominally the JSON path to the array of sublist records, but NetSuite DA ignores a top-level jsonPath here.
                x-celigo-ai-guidance:
                  - |-
                    NetSuite DA ignores a top-level `jsonPath` on sublist entries and will break
                    iteration when one is present (only the first source element renders).
                    Drive iteration from each child field's `extract` instead (see `fields[*].extract` below).
              fields:
                type: array
                items:
                  type: object
                  properties:
                    extract:
                      type: [string, 'null']
                      description: |-
                        Path from the source record root that produces
                        the value for this sublist column. Paths are
                        always anchored at the source record root —
                        never relative to a pre-iterated row — and a
                        bare string is always read as a path, never as a
                        constant: a path that matches no field leaves the
                        column absent from every line (unlike a body
                        field, which is set to ""), never the text
                        itself. Constants belong in `hardCodedValue`; the
                        platform stores `null` here on fields driven by
                        it.
                      x-celigo-ai-guidance:
                        - |-
                          Two extract patterns, often mixed in the same
                          sublist:

                          1. `parent_array[*].field_name` (bracket-star)
                             — iterates the source array and produces one
                             sublist line per element. Use for values that
                             vary per line (line-item sku, quantity, price,
                             etc.):

                                 line_items[*].netsuite_item_id → item
                                 line_items[*].quantity         → quantity
                                 line_items[*].price            → rate

                          2. Bare or dotted path (`field_name` or
                             `parent.field`) — pulls a source-root scalar
                             and repeats it on every generated sublist
                             line. Use for values that don't vary per line
                             (e.g. a shared shipping carrier, order-level
                             metadata that decorates every package):

                                 Tracking[*].TrackingNumber → packagetrackingnumber
                                 ShippingCarrier            → packagedescr

                             Here every package line gets the same
                             `ShippingCarrier` value; iteration is
                             driven by `Tracking[*]`.
                        - |-
                          The mapper drives iteration from the `[*]` segments among the child extracts;
                          scalar extracts tag along.
                          If no child uses `[*]` and none set `extract` at all (every child is a `hardCodedValue`),
                          the sublist renders a single static line.
                        - |-
                          A row that resolves its value through `lookupName`
                          (typically `extract: ""`) is driven by the sibling
                          rows' `[*]` extracts, and the lookup's `expression`
                          addresses the current line with the same
                          `<array>[*].<field>` path — see
                          `netsuite_da.lookups[].expression`.
                        - |-
                          A Handlebars `extract` addresses the current line with
                          the same `<array>[*].<field>` path — in a substitution,
                          as a helper argument
                          (`{{multiply line_items[*].tax_lines.[0].rate 100}}`)
                          and as a block-helper argument
                          (`{{#if line_items[*].taxable}}5973{{/if}}`). The row
                          is evaluated once per line and drives the iteration by
                          itself; the mapping preview
                          (`PUT /v1/netsuiteDA/previewImportMappingFields`) renders
                          every form per line, including the block-helper form it
                          cannot evaluate in a lookup `expression`. An empty render
                          is sent as an empty value unless `discardIfEmpty` omits
                          the field; in the preview, a sublist whose only row renders
                          empty for a line omits that line from the output, while
                          beside another line row the line is returned with the
                          empty value. An
                          arithmetic helper on a line that lacks the field renders
                          `NaN`, so guard it on the object the helper reads
                          (`{{#if line_items[*].tax_lines.[0]}}…{{/if}}`), not on
                          the number: `#if` treats a real `0` rate as empty.
                          The same expression on a body row (`fields[]`) renders
                          the first line's value only.
                    generate:
                      type: string
                      description: |-
                        NetSuite sublist field ID to write to, stored as the bare field id (`location`,
                        `quantity`): the editor's `item[*].` prefix, the `.internalid` suffix (see
                        `internalId`) and the editor's label ("Items : Location (InternalId)") are
                        the editor's forms, not the stored value.
                      x-celigo-ai-guidance:
                        - |-
                          Which line field exists depends on the NetSuite account: a sales order line's
                          location is `location` unless the account's Intercompany Cross-Subsidiary
                          Fulfillment feature is enabled, when NetSuite replaces it with
                          `inventorylocation` — the record metadata then lists
                          `item[*].inventorylocation.internalid` and no `item[*].location.internalid`;
                          without the feature it lists `item[*].location.internalid` and
                          `item[*].location` and no row whose id contains `inventorylocation`. Map the
                          line location to whichever the account has, stored as `generate:
                          inventorylocation` or `generate: location` with `internalId: true` — the
                          metadata id's `.internalid` suffix is the `internalId` flag, not part of the
                          stored id.
                        - |-
                          Put the `item` row before the line's `inventorylocation` row. Observed on a
                          standard-mode sales order import (no `celigo_recordmode_dynamic` row):
                          with `inventorylocation` (`internalId: true`) mapped above `item`, every
                          line failed — the location was validated against a line that had no item
                          yet; moved below the `item` row, the same mapping saved.
                    hardCodedValue:
                      type: string
                      description: Static value for this sublist field.
                    lookupName:
                      type: string
                      description: Reference to a lookup by name.
                    dataType:
                      type: string
                      description: Data type hint for the field value.
                    internalId:
                      type: boolean
                      description: When true, the value is a NetSuite internal ID reference.
                    isKey:
                      type: boolean
                      description: |-
                        When true, this field is a key for matching the record's existing sublist lines: a
                        mapped line updates the one existing line whose key fields hold the same values —
                        every key field must match, so several keys narrow the match. `lists` says which
                        records match lines, the keys used when no field sets `isKey`, and what a line that
                        matches no line, or several, does.
                    immutable:
                      type: boolean
                      description: When true, this field is only set on record creation, not on updates.
                    discardIfEmpty:
                      type: boolean
                      description: When true, skips this field mapping if the extracted value is empty.
                    extractDateFormat:
                      type: string
                      description: Date format of the extracted value.
                    extractDateTimezone:
                      type: [string, 'null']
                      description: Timezone of the extracted date value. Stored as `null` when not configured.
                    subRecordMapping:
                      type: object
                      description: |-
                        Nested Mapper 1.0 mapping for a NetSuite
                        subrecord embedded in this sublist-field.  A
                        subrecord is a child record that only exists
                        inside a parent (e.g. the Inventory Detail on
                        a serialized-item line of a sales order);
                        NetSuite reaches it through the parent.

                        **Recursive structure.**  The nested
                        `mapping` object has the same
                        `{fields, lists}` shape as the top-level
                        `netsuite_da.mapping`.  Recursion is allowed
                        but rare.
                      x-celigo-ai-guidance:
                        - |-
                          **Do not over-emit.** Per the Celigo help center:
                          "Unconfigured subrecord mappings can cause your NetSuite import to fail.
                          Only include subrecord mappings on imports that require subrecord data." Emit
                          this block ONLY when the destination record type genuinely requires the
                          subrecord.
                        - |-
                          **Common `recordType` values** (most
                          common first):
                          * `inventorydetail` — by far the most
                            common.  Serial / lot / bin assignments on
                            sales-order, item-fulfillment, purchase-
                            order, and inventory-adjustment line items.
                            Nested `mapping` typically has empty
                            `fields` and a single
                            `inventoryassignment` sublist.
                          * `componentinventorydetail` — same concept
                            on work-order / assembly-build component
                            lines.
                          * `itemvendorprice` — vendor-specific price
                            tiers on item-vendor relationships.
                          * `landedcost` — landed-cost allocations.
                          * `itempricing` — quantity-based price tiers
                            on contracts.  Nested `mapping` typically
                            carries a `discount` sublist with
                            `fromquantity` and `rate` rows.
                          * `countdetail` — per-line detail on
                            physical-inventory counts.
                        - |-
                          **Where this block lives.** The enclosing sublist-field's `generate` name is a
                          synthetic trigger (typically `celigo_*`) whose purpose is to carry this
                          `subRecordMapping` block — it is NOT a real NetSuite column.
                          The trigger → `recordType` correspondence is mostly `celigo_<recordType>`
                          but NOT a strict rule:
                          `celigo_inventorydetail` covers BOTH `inventorydetail` and
                          `componentinventorydetail` depending on the parent record.
                          Match trigger names on existing resources rather than synthesizing new ones.
                      properties:
                        recordType:
                          type: string
                          description: |
                            NetSuite's internal record-type id of the
                            SUBRECORD (not the parent).  E.g.
                            `inventorydetail`, `itempricing`,
                            `componentinventorydetail`.
                        jsonPath:
                          type: string
                          description: |
                            Path from the source record root to the
                            array of lines whose elements feed this
                            subrecord — the same array the sublist
                            iterates (`lineItems`, `items`); the n-th
                            element populates the n-th sublist line.
                            `$` only when each source record is itself
                            one line. Defaults to `$`.
                          x-celigo-ai-guidance:
                            - |-
                              `$` on a record whose lines sit under a field renders no subrecord for any
                              line, and NetSuite rejects the first numbered line with `Please configure the
                              inventory detail in line N of the item list`; name the line array
                              (`lineItems`), never the current-line context.
                        mapping:
                          type: object
                          description: |
                            Nested `{fields, lists}` mapping for the
                            subrecord.  Identical shape to the
                            top-level `netsuite_da.mapping`.
                            Subrecords often have empty `fields` and
                            only a sublist (e.g. `inventorydetail` →
                            `inventoryassignment`).
                        lookups:
                          type: array
                          description: |
                            Subrecord-scoped lookups.  Same shape as
                            the top-level `netsuite_da.lookups`.
                            Fields inside this
                            `subRecordMapping.mapping` reference
                            them via `lookupName`.  Often `[]`.
                        referenceFieldId:
                          type: string
                          description: |
                            Secondary reference-field identifier used
                            on a small fraction of subrecord blocks.
                            Exact semantics are not publicly
                            documented by Celigo — match
                            the value on existing resources when
                            present; do NOT synthesize one.  Leave
                            unset unless a template clearly requires
                            it.
                    conditional:
                      type: object
                      description: |-
                        Conditional logic for when to apply this sublist field mapping
                        ("Only perform mapping when" in the UI). Lookup-based conditions
                        evaluate the lookup named by `lookupName`, which must be defined
                        on this import.
                      x-celigo-ai-guidance:
                        - |-
                          Same dangling-reference failure as body-field conditions: a
                          `lookupName` that matches no lookup defined on the import breaks
                          the run — on sublist rows this has been observed to stall the
                          flow job (it never completes) instead of producing the
                          `Cannot set properties of undefined (setting '_hasStarNotation')`
                          error record. Cross-reference every row's `conditional.lookupName`
                          against the import's defined lookups.
                        - |-
                          The operation contract differs from body-field conditions:
                          `when: record_updated` on an `add`-only operation is rejected
                          per-record on body rows (`The mapping condition:"record_updated"
                          not supported for the operation`) but was NOT rejected on sublist
                          rows in live verification. Do not rely on that tolerance — use
                          `when: record_updated` only on operations that can update
                          records (`addupdate` / `update`).
                        - |-
                          The condition is one of the fixed `when` values — the same
                          closed set as body rows, with no predicate over a source
                          field; `extract_not_empty` skips the row on the lines whose
                          extract is empty and leaves that line's field unset. Two
                          sublist rows with the same `generate` are not a fallback
                          pair either, and the order rule is not the body rows': among
                          extract rows the last row decides each line alone (a skipped
                          last row leaves the line's field unset even when an earlier
                          row produced a value), while a hard-coded row's value lands
                          on every line whatever its position — a later conditional
                          extract row does not override it.
                      properties:
                        lookupName:
                          type: string
                          description: |-
                            Lookup to evaluate for the condition. Must exactly match the
                            `name` of a lookup defined on this import.
                        when:
                          type: string
                          description: Condition that controls when this field mapping is applied.
                          enum:
                            - record_created
                            - record_updated
                            - extract_not_empty
                            - lookup_not_empty
                            - lookup_empty
                            - ignore_if_set
                          x-enumDescriptions:
                            record_created: Apply this mapping only when a new record is being created.
                            record_updated: Apply this mapping only when an existing record is being updated.
                            extract_not_empty: Apply this mapping only when the extracted source value is non-empty.
                            lookup_not_empty: Apply this mapping only when the lookup returns a value.
                            lookup_empty: Apply this mapping only when the lookup returns no value.
                            ignore_if_set: Skip this mapping if the target field already has a value.
                description: Field mappings for each column in the sublist.
          description: |
            Sublist (line-item) mappings. Each entry maps source data to a NetSuite sublist.

            Each mapped line updates the one existing line whose key fields hold the same values: its
            `isKey` fields, or, with none, the sublist's default key. The existing lines are the stored
            record's on an update, and on a transform (`Created From`: the body field
            `celigo_nlobjTransformId` holds the source transaction's internal id) the lines the transform
            fills in. Default keys:

            - the item (`item`, else `itemkey` or `itemname`) on item fulfillments, item receipts,
              invoices, cash sales, cash refunds, return authorizations, bin worksheets, inbound shipment
              receipts and inventory counts, and on an assembly build's `component` sublist;
            - the applied transaction (`refnum`) on the `apply`, `credit` and `deposit` sublists of
              customer and vendor payments, credit memos, vendor credits and customer refunds;
            - `docnumber` on a deposit's `payment` sublist;
            - `vendor` and `language` on an item record's `itemvendor` and `translations` sublists.

            A sublist with neither, such as a sales order's or purchase order's `item`, matches nothing, so
            an update adds every mapped line after the existing ones. Two matching lines fail the record
            with `MULTIPLE_LINES_WITH_SAME_KEYS` ("Multiple lines found with keys item=<value> ..."). A
            line that matches none is added as a new line, which an item fulfillment's `item` sublist
            refuses with `SSS_INVALID_SUBLIST_OPERATION`: its lines are its order's.

            On a fulfillment created from an order, a kit's lot-, serial- or bin-managed components are
            lines of their own under the kit's line, each with its own `line` and `orderline` (the
            component's own order line) and `kitmemberof` holding the kit line's id; the inventory detail
            belongs on those component lines, and a kit line refuses it.
          x-celigo-ai-guidance:
            - |-
              To make an update replace a sublist's lines, also map the body field
              `celigo_replaceAllLines_<sublist id>` (for example `celigo_replaceAllLines_item`) to `true`:
              the existing lines no mapped line matched are removed, then the mapped lines are written. Where
              lines can't be removed it clears them instead: `itemreceive` false on an item fulfillment or
              item receipt, `apply` false on an `apply` sublist. On a sublist with no `isKey` field and no
              default key every existing line is unmatched, so all are replaced; with a default key, the lines
              it matches stay.
            - |-
              Key an update on a value each line holds once: a line id the record's create wrote to a line
              field, or, on a fulfillment, the order line's id mapped to `orderline`. Keying on the item fails
              with `MULTIPLE_LINES_WITH_SAME_KEYS` when an order holds the same item on two lines, and records
              that already hold repeated lines fail the same way once a key is set.
            - |-
              A key field is read from the existing lines, never written, so a read-only field keys as well
              as a writable one. The mapper's "Items : Line ID" is `line` (the fulfillment's own line number,
              equal to the order line only on a fresh full transform) and "Items : Line Number" is `linenum`;
              `orderline` and `kitmemberof` are not in its picker — type `item[*].orderline` /
              `item[*].kitmemberof` as the destination (the metadata id form of a sublist field; the
              document stores `orderline` / `kitmemberof` under `lists[]` with `generate: item`).
            - |-
              Kit components on a fulfillment: the item is the only default key that reaches a component
              line, so a component two kit lines share fails with `MULTIPLE_LINES_WITH_SAME_KEYS`. Keying the
              component rows on the KIT's order line (`line` or `orderline`) selects the kit line instead and
              the save fails with `You cannot create an inventory detail for this item`. When the source
              carries the kit's order line on its component rows, keep the item as a key and add
              `item[*].kitmemberof` mapped from that line id as a second key, keep the kit rows in the list
              (their empty `kitmemberof` matches the kit line) with `item[*].celigo_ignore_current_line_invdetail_subrecord`
              true so no inventory detail is written on them, and build the inventory detail from each
              component row's own picks; component rows alone leave every kit line unfulfilled (`You must
              enter at least one line item for this transaction`). When the source can supply each
              component line's own order line id, key every row on `orderline` instead.
      x-celigo-agent:
        - mapping
    lookups:
      type: array
      items:
        type: object
        properties:
          name:
            type: string
            description: |-
              Unique identifier for this lookup. Mapping fields reference it
              via `lookupName` and Handlebars expressions reference it via
              `{{lookup "name" value}}`. Must be unique within this
              resource's `lookups` array.
            x-celigo-ai-guidance:
              - |-
                Mapping rows also reference lookups by this exact name in
                `conditional.lookupName` ("Only perform mapping when"). When renaming
                or removing a lookup, update every referencing row: a stale field-level
                `lookupName` fails records with
                `Unable to find lookup in mapping configs - <name>`; a stale
                `conditional.lookupName` on a body row fails them with the unnamed
                `Cannot set properties of undefined (setting '_hasStarNotation')` error
                (see `mapping.fields[].conditional`), and on a sublist row has been
                observed to stall the flow job with no error record
                (see `mapping.lists[].fields[].conditional`).
            examples: ["lookupCustomerByEmail"]
          recordType:
            type: string
            description: |-
              NetSuite record type to search. Use the internal record-type
              id (lowercase, underscored), e.g. `customer`, `item`,
              `salesorder`, `customlist_xxx`.
            examples: ["customer"]
          searchField:
            type: string
            description: |-
              NetSuite field on `recordType` to match against. Use the
              internal field id — e.g. `email`, `externalid`,
              `internalid`, `entityid`, `custitem_xxx`.
            examples: ["email"]
          resultField:
            type: string
            description: |-
              NetSuite field whose value is returned when a record matches.
              Typically `internalid` when the lookup resolves to a record
              reference, or any queryable scalar field.
            examples: ["internalid"]
          expression:
            type: string
            x-celigo-agent:
              - handlebars
            description: |-
              Optional advanced-search expression (NetSuite saved-search
              DSL) for multi-criterion lookups. When present, supersedes
              `searchField` / `operator` — those fields are ignored.
              Handlebars inside the expression is rendered against the
              whole source record before the search runs; a lookup on a
              sublist row reaches the current line through
              `<array>[*].<field>` (for example `line_items[*].sku`).
            x-celigo-ai-guidance:
              - |-
                ## Evaluation context — the whole source record, no `record.` prefix

                The expression's Handlebars renders against the incoming
                source record as the context root (the record is NOT
                wrapped under `record`), then the rendered JSON array is
                sent to NetSuite as the search criteria. Body-level fields
                are addressed bare: `{{{id}}}`, `{{{email}}}`.
              - |-
                ## Sublist-row lookups address the line with `<array>[*].<field>`

                A lookup referenced from a sublist mapping row
                (`mapping.lists[].fields[].lookupName`) still receives the
                whole record; the current line's fields are reached with the
                same bracket-star path the sublist extracts use —
                `{{{line_items[*].sku}}}` resolves the line's item (one line
                per sublist row). A bare line field (`{{sku}}`,
                `{{#contains sku "_"}}`) is undefined at the record root: a
                helper that receives it fails every record with
                `INVALID_HANDLE_BAR_EXPRESSION` — `Could not compile handle
                bar "<expression>" because "Cannot call method "indexOf" of
                undefined"` — before anything reaches NetSuite. When an
                audit diff shows `<array>[*].` removed from the expression
                right before such errors began, that edit is the cause; do
                not look for a line missing the field.
              - |-
                ## Rendered unmatched

                A rendered value NetSuite does not match fails the record
                with `VALUE_LOOKUP_FAILED` — `Could not find a match for
                "<rendered criteria>" for the record type "<recordType>"`
                — quoting the criteria exactly as rendered, so the message
                shows what the expression produced for that line. With
                `allowFailures: true` the `default` value is used instead
                and no error is raised. Give every branch an output.
              - |-
                ## An empty substitution searches `isempty`

                When the source path a criterion reads is null or absent
                (`["custentity_celigo_etail_cust_id","is","{{{customer.id}}}"]`
                on an order with no customer), the engine does not fail on
                the missing input: it searches the field with an `isempty`
                criterion, so the lookup now matches every target record
                whose field is BLANK. Two or more such records fail the
                record with `VALUE_LOOKUP_FAILED` — `More than one match
                for "[<field>,"isempty"]" for the record type "<recordType>"`
                (the message quotes the search field, never the empty
                source path); none fail it as `Could not find a match`;
                exactly one silently resolves to that record. Keep an empty
                key out of the search inside the expression — branch on
                the key: `{{#if customer.id}}[["custentity_celigo_etail_cust_id",
                "is","{{{customer.id}}}"]]{{else}}[["internalid","anyof",
                "<fallback internal id>"]]{{/if}}` routes records without a
                key to a fallback record while records with a key keep
                fail-on-miss; or render a value that can never match in the
                else branch and set `allowFailures: true` with `default`.
                A `searchField` / `operator` lookup (no `expression`) never
                reaches this state: an empty extract fails the record with
                `STATIC_MAPPING_ERROR` — `Exported value is empty/undefined
                for the field: $.<path>` — and resolves to `default` when
                `allowFailures` is true.
              - |-
                ## The mapping preview cannot evaluate `[*]` inside a block-helper argument of a lookup expression

                `PUT /v1/netsuiteDA/previewImportMappingFields` (the mapping
                editor's Preview) evaluates lookups for real — resolved
                internal ids appear in `nlobjSublistIds`, misses and
                compile errors in `data.mappingErrors[]` — and handles
                `[*]` in plain substitutions and inside a branch's output.
                It does NOT apply the per-line evaluation to `[*]` used as a
                block-helper ARGUMENT of a lookup expression (`{{#if line_items[*].x}}`,
                `{{#contains line_items[*].sku "_"}}`): the sublist comes
                back EMPTY with no error, whatever the expression would do
                in a run. An empty preview is therefore no evidence about
                such a lookup expression — never report it as "renders nothing"
                or as invalid on that basis; validate it with a run.
                `<array>.@index.<field>` is likewise not evaluable in the
                preview (the record is dropped with no error).
                A mapping row's `extract` with the same block-helper shape IS
                rendered per line by the preview — see
                `netsuite_da.mapping.lists[].fields[].extract`.
          operator:
            type: string
            description: |-
              Comparison operator for the `searchField` match. Common
              values: `is`, `contains`, `startswith`, `anyof`,
              `equalto`, `greaterthan`.
          includeInactive:
            type: boolean
            description: When true, includes inactive records in lookup results.
            x-celigo-ai-guidance:
              - |-
                When true, the search includes inactive NetSuite records.
                Default false — inactive records are excluded.
          useDefaultOnMultipleMatches:
            type: boolean
            description: |-
              When true and `allowFailures` is also true, a search that
              matches more than one record resolves to `default` instead
              of failing the record. Has no effect while `allowFailures`
              is false — an ambiguous match then fails the record whatever
              this flag says.
            x-celigo-ai-guidance:
              - |-
                Set it together with `allowFailures: true` whenever the
                search value can be empty or duplicated: with
                `allowFailures: true` alone an ambiguous match resolves to
                ONE of the matching records with no error, and with this
                flag alone the record still fails `More than one match`.
                Every ambiguous match then becomes `default`, a genuinely
                duplicated key included — when that must still fail, keep
                `allowFailures` false and handle the empty key in the
                `expression` instead (see `expression`).
          allowFailures:
            type: [boolean, 'null']
            description: |-
              When true, a lookup miss (no matching record and no
              `default`) resolves to `null` and the import continues, and
              a search matching more than one record resolves to one of
              them unless `useDefaultOnMultipleMatches` routes it to
              `default`. When false (default), a miss and an ambiguous
              match both halt the record. May be stored as null (treated
              as unset).
          map:
            type: [object, 'null']
            description: |-
              Optional static key→value object evaluated BEFORE the
              NetSuite search. When the incoming value matches a key, the
              mapped value is returned without hitting NetSuite. Null on
              dynamic (search-based) lookups with no static map.
          default:
            type: [string, 'null']
            description: |-
              Value returned when the search matches no records and the
              miss is allowed. `""`, `null` and an absent key are three
              stored states — the mapper's *Use empty string as default
              value*, *Use null as default value* and *Do nothing* — saved
              and read back as written, in both `lookups` and
              `netsuite_da.lookups`; a save with no `default` key stores
              none. When `allowFailures` is false an unmatched lookup halts
              the record whatever is stored here.
      description: |-
        Lookup definitions that resolve reference values from NetSuite.
        Referenced by name from field mappings via `lookupName` and from
        Handlebars expressions via `{{lookup "name" value}}`.
      x-celigo-ai-guidance:
        - |-
          ## Mirror invariant
          The Celigo platform persists NetSuite Distributed Import lookups in
          TWO locations: `netsuite_da.lookups` and top-level `lookups`.
          Both arrays must hold byte-for-byte identical content, so write
          both on every save.
        - |-
          ## One context for body and sublist lookups
          Every lookup's `expression` renders against the whole source
          record. A lookup referenced from a sublist row
          (`mapping.lists[].fields[].lookupName`) is evaluated once per
          line and addresses the current line with `<array>[*].<field>`
          — never a bare line field. See `expression` for the failure
          modes and the preview caveat.
      x-celigo-agent:
        - lookup
    rawOverride:
      type: object
      description: |
        Raw override object for advanced use cases. When useRawOverride is true,
        this object is sent directly to the NetSuite API, bypassing normal mapping.
    useRawOverride:
      type: boolean
      description: |
        When true, uses rawOverride instead of the normal mapping configuration.
    isMigrated:
      type: boolean
      description: When true, this import was migrated from a legacy format. Set by the system.
    retryUpdateAsAdd:
      type: boolean
      description: |
        When true, if an update fails because the record doesn't exist, automatically
        retry as an add operation. Useful for initial syncs where records may not exist yet.
    customFieldMetadata:
      type: object
      description: |
        Metadata about custom fields on the target record type.
        Populated by the system from NetSuite metadata — do not set manually.
    file:
      type: object
      description: |
        File cabinet configuration for file-based imports into NetSuite.
      properties:
        name:
          type: string
          description: Filename for the file in NetSuite File Cabinet.
        fileType:
          type: string
          description: |
            NetSuite file type (e.g., "PDF", "CSV", "PLAINTEXT", "EXCEL", "XML").
        folder:
          type: string
          description: Folder path or name in the NetSuite File Cabinet.
        folderInternalId:
          type: string
          description: Internal ID of the target folder in NetSuite File Cabinet.
        internalId:
          type: string
          description: Internal ID of an existing file to update.
        backupFolderInternalId:
          type: string
          description: Internal ID of a backup folder for file versioning.
    isFileProvider:
      type: boolean
      description: |
        Whether this import handles files in the NetSuite File Cabinet.
    preferences:
      type: object
      properties:
        ignoreReadOnlyFields:
          type: boolean
          description: When true, silently skip read-only fields instead of raising errors.
        warningAsError:
          type: boolean
          description: When true, treat NetSuite warnings as errors that stop the import.
        skipCustomMetadataRequests:
          type: boolean
          description: When true, skip fetching custom field metadata to improve performance.
      description: |
        Import behavior preferences that control how NetSuite handles the import operation.
    recordTypeId:
      type: string
      description: |
        The internal record type ID. Used for custom record types in NetSuite where
        the numeric ID is needed in addition to the recordType string.
  # Requireds apply only to real configs, not server-written bookkeeping stubs whose
  # keys are all in {lookups, mapping, missingOrCorruptedDAConfig} — e.g.
  # {"lookups":[],"mapping":{"fields":[],"lists":[]}} or {"missingOrCorruptedDAConfig":true},
  # written onto imports of every adaptorType. Stack-style conditional (no allOf).
  if:
    not:
      propertyNames:
        enum: [lookups, mapping, missingOrCorruptedDAConfig]
  then:
    required:
      - operation
      - recordType
    if:
      properties:
        operation:
          enum: [update, addupdate, delete]
      required:
        - operation
    then:
      required:
        - internalIdLookup
