MCPServer:
  type: object
  required:
    - _id
    - name
    - relativeURI
    - disabled
    - createdAt
    - lastModified
  description: MCP server object as returned by the API.
  allOf:
    - $ref: './base.yml#/MCPServerBase'
    - $ref: '../../../common/schemas/resource-response.yml#/ResourceResponse'
    - type: object
      properties:
        _userId:
          type: string
          format: objectId
          readOnly: true
          x-celigo-refModel: users
          description: Owning user ID.
          examples: ["624cb0346309dc3a543733a2"]
        _templateId:
          type: string
          format: objectId
          readOnly: true
          x-celigo-refModel: templates
          description: |-
            Marketplace template the server was installed from via
            `POST /v1/mcpservers/template/{_templateId}`. Present only on
            installed servers; a value sent on POST or PUT is ignored and the
            field is not a PATCH path.
          examples: ["6ab129aeb9e4547494c0667f"]
        enabledItemCount:
          type: integer
          readOnly: true
          description: |-
            Number of capabilities currently served — enabled `tools`, `apis`,
            `prompts`, and `resources` plus every enabled and available upstream
            tool, prompt, and resource row. Computed on GET and list responses
            only (it is absent from create and update responses) and reported
            even when `include` omits the arrays it counts.
          examples: [5]
        sandbox:
          type: boolean
          deprecated: true
          description: Legacy sandbox flag. Not present in current responses.
        draft:
          type: boolean
          readOnly: true
          description: |-
            When true, the server is an unconfirmed draft created by the
            AI-assisted builder. Present, together with `draftExpiresAt`, only
            on such drafts.
          examples: [true]
        draftExpiresAt:
          type: string
          format: date-time
          readOnly: true
          description: |-
            Timestamp when this draft MCP server expires and is automatically
            deleted. Present only on unconfirmed drafts, alongside `draft`.
          examples: ["2026-05-14T17:16:05.595Z"]
  x-celigo-ai-guidance:
    - |-
      Contains the complete MCP server configuration including metadata,
      tool entries, API entries, and their override settings.
