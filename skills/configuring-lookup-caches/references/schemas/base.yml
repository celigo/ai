LookupCacheBase:
  type: object
  description: Writable fields shared by the request and response schemas.
  properties:
    name:
      type: string
      maxLength: 200
      description: Display name.
      examples: ["Customer ID Cache", "Product SKU Lookup"]
      x-celigo-canon:
        decision: not-required
        reason: >-
          Server accepts an empty create body and defaults name to the empty string, so
          name is neither required nor non-empty — machine-generated ephemeral caches
          routinely carry empty names. Do not add minLength either.
        method: live-probe
        verified: '2026-07-03'
    description:
      type: string
      maxLength: 5120
      description: Purpose or contents of the cache.
      examples: ["Maps external customer IDs to internal Salesforce IDs for deduplication"]
    includeDataInTemplatesAndCloning:
      type: boolean
      default: false
      description: |-
        Whether to include the cached key-value data when this cache is
        used in templates or cloned. When `false` (default), only
        metadata transfers. Set to `true` for static reference tables.
      examples: [false, true]
      x-celigo-canon:
        decision: not-required
        reason: Server defaults the value on omission — universal stored presence is server-written.
        method: live-probe
        verified: '2026-07-03'
      x-celigo-ai-guidance:
        - |-
          When false (default), only the cache metadata is included — the actual
          key-value data is not transferred. Set to true if the cached data is
          part of the integration's configuration (e.g., static reference tables).
    externalId:
      type: string
      description: Caller-supplied identifier for cross-system correlation.
      examples: ["ext-cache-12345"]
      x-celigo-canon:
        decision: no-constraint
        reason: >-
          Free-form by design — values are caller-chosen and need not look like object ids;
          a very long probe value was accepted. No pattern, format, or length cap.
        method: live-probe
        verified: '2026-07-03'
